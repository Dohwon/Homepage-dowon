<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 685.2623792124926" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">대표 지시에서 완료 검증까지</title><desc id="system-map-desc">하나의 intake를 모드·부서 stage로 dispatch하고 승인·경로 확인·검증 gate를 거쳐 완료로 판정한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="685.2623792124926" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">대표 지시에서 완료 검증까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">하나의 intake를 모드·부서 stage로</tspan><tspan x="40" y="108">dispatch하고 승인·경로 확인·검증 gate를</tspan><tspan x="40" y="130">거쳐 완료로 판정한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 304 C 674 304, 955.933 400.738, 1009.93 400.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="775.967" y="338.369" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="814.967" y="354.369" text-anchor="middle" fill="#52606d" font-size="11">모드 선택</text></g><g data-flow="flow-02"><path d="M 1009.93 400.738 C 955.933 400.738, 914.992 557.262, 860.992 557.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="893.463" y="465" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="935.463" y="481" text-anchor="middle" fill="#52606d" font-size="11">stage 배정</text></g><g data-flow="flow-03"><path d="M 860.992 557.262 C 806.992 557.262, 433.008 557.262, 379.008 557.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="572" y="543.262" width="96" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="559.262" text-anchor="middle" fill="#52606d" font-size="11">실행 전 검사</text></g><g data-flow="flow-04"><path d="M 379.008 557.262 C 325.008 557.262, 284.067 400.738, 230.067 400.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="265.537" y="465" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="304.537" y="481" text-anchor="middle" fill="#52606d" font-size="11">완료 판정</text></g><g data-node="executive-intake"><rect x="495.0" y="230.0" width="250" height="148" rx="8" fill="#e9f2fb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="257.0" r="14" fill="#17212b"/><text x="521.0" y="262.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="262.0" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="262.0">대표 지시</tspan></text><text x="729.0" y="302.0" text-anchor="end" fill="#52606d" font-size="11">actor</text><text x="513.0" y="308.0" fill="#52606d" font-size="12"><tspan x="513.0" y="324.0">사람이 보고만 받을지 실제</tspan><tspan x="513.0" y="340.0">구현을 맡길지 요청한다.</tspan></text></g><g data-node="work-mode"><rect x="884.9331716810129" y="326.73762078750735" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="910.9331716810129" cy="353.73762078750735" r="14" fill="#17212b"/><text x="910.9331716810129" y="358.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="934.9331716810129" y="358.73762078750735" fill="#17212b" font-size="16" font-weight="700"><tspan x="934.9331716810129" y="358.73762078750735">업무 모드</tspan></text><text x="1118.933171681013" y="398.73762078750735" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="902.9331716810129" y="404.73762078750735" fill="#52606d" font-size="12"><tspan x="902.9331716810129" y="420.73762078750735">report-only와</tspan><tspan x="902.9331716810129" y="436.73762078750735">implementation을 실행 전에</tspan><tspan x="902.9331716810129" y="452.73762078750735">구분한다.</tspan></text></g><g data-node="stage-dispatch"><rect x="735.991953439914" y="483.26237921249265" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="761.991953439914" cy="510.26237921249265" r="14" fill="#17212b"/><text x="761.991953439914" y="515.2623792124926" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="785.991953439914" y="515.2623792124926" fill="#17212b" font-size="16" font-weight="700"><tspan x="785.991953439914" y="515.2623792124926">부서 stage</tspan></text><text x="969.991953439914" y="555.2623792124926" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="753.991953439914" y="561.2623792124926" fill="#52606d" font-size="12"><tspan x="753.991953439914" y="577.2623792124926">각 단계의 담당 agent와</tspan><tspan x="753.991953439914" y="593.2623792124926">산출물을 연결한다.</tspan></text></g><g data-node="runtime-preflight"><rect x="254.0080465600861" y="483.26237921249265" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="280.0080465600861" cy="510.26237921249265" r="14" fill="#17212b"/><text x="280.0080465600861" y="515.2623792124926" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="304.0080465600861" y="515.2623792124926" fill="#17212b" font-size="16" font-weight="700"><tspan x="304.0080465600861" y="515.2623792124926">실행 전 검사</tspan></text><text x="488.0080465600861" y="555.2623792124926" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="272.0080465600861" y="561.2623792124926" fill="#52606d" font-size="12"><tspan x="272.0080465600861" y="577.2623792124926">dispatch 전에 runtime,</tspan><tspan x="272.0080465600861" y="593.2623792124926">경로와 checkout을 확인한다.</tspan></text></g><g data-node="completion-gate"><rect x="105.066828318987" y="326.73762078750735" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="131.066828318987" cy="353.73762078750735" r="14" fill="#17212b"/><text x="131.066828318987" y="358.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="155.066828318987" y="358.73762078750735" fill="#17212b" font-size="16" font-weight="700"><tspan x="155.066828318987" y="358.73762078750735">완료 검증</tspan></text><text x="339.066828318987" y="398.73762078750735" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="123.066828318987" y="404.73762078750735" fill="#52606d" font-size="12"><tspan x="123.066828318987" y="420.73762078750735">요청한 파일·경로가 실제로</tspan><tspan x="123.066828318987" y="436.73762078750735">존재하고 검증을 통과했을 때</tspan><tspan x="123.066828318987" y="452.73762078750735">완료로 기록한다.</tspan></text></g></svg>
