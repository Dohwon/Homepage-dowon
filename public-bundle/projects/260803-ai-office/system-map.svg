<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">대표 지시에서 완료 검증까지</title><desc id="system-map-desc">하나의 intake를 모드·부서 stage로 dispatch하고 승인·경로 확인·검증 gate를 거쳐 완료로 판정한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">대표 지시에서 완료 검증까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">하나의 intake를 모드·부서 stage로 dispatch하고 승인·경로</tspan><tspan x="40" y="108">확인·검증 gate를 거쳐 완료로 판정한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">approval workflow</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">모드 선택</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="547" y="257" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">stage 배정</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="844.5" y="257" width="101" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">실행 전 검사</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">완료 판정</text></g><g data-node="executive-intake"><rect x="40" y="208" width="250" height="126" rx="8" fill="#e9f2fb" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">대표 지시</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">actor</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">사람이 보고만 받을지 실제 구현을 맡길지 요청한다.</tspan></text></g><g data-node="work-mode"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">업무 모드</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">report-only와 implementation을 실행</tspan><tspan x="350" y="304">전에 구분한다.</tspan></text></g><g data-node="stage-dispatch"><rect x="624" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">부서 stage</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">각 단계의 담당 agent와 산출물을 연결한다.</tspan></text></g><g data-node="runtime-preflight"><rect x="916" y="208" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">실행 전 검사</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">dispatch 전에 runtime, 경로와</tspan><tspan x="934" y="304">checkout을 확인한다.</tspan></text></g><g data-node="completion-gate"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">완료 검증</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">요청한 파일·경로가 실제로 존재하고 검증을 통과했을 때</tspan><tspan x="58" y="522">완료로 기록한다.</tspan></text></g></svg>
