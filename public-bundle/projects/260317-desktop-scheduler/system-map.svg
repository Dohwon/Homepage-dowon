<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 618" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">일정 입력에서 알림 상태까지</title><desc id="system-map-desc">단일 사용자 일정의 날짜·미루기 이력과 알림 상태를 로컬 앱 안에서 보존한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="618" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">일정 입력에서 알림 상태까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">단일 사용자 일정의 날짜·미루기 이력과 알림 상태를 로컬 앱 안에서</tspan><tspan x="40" y="108">보존한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 271 C 290 299, 358 243, 358 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="273" text-anchor="middle" fill="#52606d" font-size="11">날짜 탐색</text></g><g data-flow="flow-02"><path d="M 608 271 C 608 299, 676 243, 676 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="602.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="273" text-anchor="middle" fill="#52606d" font-size="11">일정 저장</text></g><g data-flow="flow-03"><path d="M 676 271 C 676 386, 290 386, 290 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="427" y="372" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="388" text-anchor="middle" fill="#52606d" font-size="11">알림 상태 갱신</text></g><g data-node="calendar-input"><rect x="40" y="208" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">일정 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">콘솔 없이 바탕화면 앱에서 일정을 만들고 날짜를 바꾼다.</tspan></text></g><g data-node="calendar-view"><rect x="358" y="208" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="235" r="14" fill="#17212b"/><text x="384" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="240" fill="#17212b" font-size="16" font-weight="700">6주 달력</text><text x="592" y="263" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="376" y="286" fill="#52606d" font-size="12"><tspan x="376" y="288">월 경계에서도 같은 6주 그리드로 일정을 탐색한다.</tspan></text></g><g data-node="sqlite-store"><rect x="676" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="235" r="14" fill="#17212b"/><text x="702" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="240" fill="#17212b" font-size="16" font-weight="700">로컬 SQLite</text><text x="910" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="694" y="286" fill="#52606d" font-size="12"><tspan x="694" y="288">일정 본문과 미루기 이력을 분리해 저장한다.</tspan></text></g><g data-node="notification-state"><rect x="40" y="438" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="465" r="14" fill="#17212b"/><text x="66" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="470" fill="#17212b" font-size="16" font-weight="700">알림 상태</text><text x="274" y="493" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="58" y="516" fill="#52606d" font-size="12"><tspan x="58" y="518">알림 발송 여부를 저장해 재시작과 재시도에 중복 알림이</tspan><tspan x="58" y="534">생기지 않게 한다.</tspan></text></g></svg>
