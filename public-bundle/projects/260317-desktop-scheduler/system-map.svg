<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">미루기 이력을 남기는 로컬 일정표: 구조와 결정 흐름</title><desc id="system-map-desc">주간 카드와 고정 6주 달력, SQLite 일정 원장과 중복 알림 방지, 콘솔 없는 Windows 실행 흐름을 작은 로컬 MVP로 묶은 결정을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">미루기 이력을 남기는 로컬 일정표: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">주간 카드와 고정 6주 달력, SQLite 일정 원장과 중복 알림 방지,</tspan><tspan x="80" y="108">콘솔 없는 Windows 실행 흐름을 작은 로컬 MVP로 묶은 결정을</tspan><tspan x="80" y="130">정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1090" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1248" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">바탕화면에서 바로 여는 단일 사용자 일정표</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="250" fill="#52606d" font-size="12">DeskFlow Scheduler는 팀 캘린더나 클라우드 서비스를 대체하기보다 Windows 바탕화면에서 빠르게 열어...</text></g><g data-node="fixed-calendar"><rect x="80" y="346" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">월 달력을 항상 6주로 고정</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="408" fill="#52606d" font-size="12">월마다 필요한 주 수에 맞춰 달력 높이를 바꾸지 않고 항상 6개의 ISO 주 행을 표시한다. 월을 넘길 때 창과 아래...</text></g><g data-node="postpone-history"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">날짜 변경과 미루기 이력 분리</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">일정을 미룰 때 due date만 덮어쓰지 않는다. previous date, postpone count와 statu...</text></g><g data-node="notification-state"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">알림 상태를 저장해 중복 방지</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">due 일정은 Tk popup과 Windows sound로 알린다. 별도 notification 라이브러리를 추가하지...</text></g><g data-node="launcher-rollback"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">콘솔 없는 실행 흐름으로 수정</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">초기 VBS launcher에서 PowerShell을 거쳐 `.pyw`와 `pythonw` 중심의 no-console...</text></g><g data-node="freeze-mvp"><rect x="80" y="978" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">로컬 MVP 범위 동결</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1040" fill="#52606d" font-size="12">task CRUD, 주간 카드, 6주 달력, 미루기와 알림을 구현한 뒤 MVP를 닫고 recurrence, backu...</text></g><g data-node="implementation-flow"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">GUI와 SQLite의 직접 연결</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">Tkinter GUI가 calendar utility와 storage를 직접 호출한다. SQLite는 task, 상태...</text></g><g data-node="validation"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">달력과 저장소 테스트 5개</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">현재 코드에서 6주 달력과 주 경계 2개, task 생성, due alarm 필터와 postpone history 3...</text></g><g data-node="limitations"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">Windows 실행과 보존에 남은 과제</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">README 상태가 project memory와 다르고 Windows 실제 기기 QA가 없다. recurrence,...</text></g></svg>
