<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 438" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">v5 지도 일기 기반에서 v6 계정·설정·권한 보완으로</title><desc id="system-map-desc">v5의 실제 주행과 저장 기록 기반을 분리하고, v6의 선택 로그인·계정별 로컬 우선 동기화·설정 허브·권한 복구를 구현했다. 로컬 검증과 iOS 번들 동기화는 완료했으며 실제 외부 서비스와 기기 검증은 남아 있다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="438" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">v5 지도 일기 기반에서 v6 계정·설정·권한 보완으로</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">v5의 실제 주행과 저장 기록 기반을 분리하고, v6의 선택 로그인·계정별</tspan><tspan x="40" y="108">로컬 우선 동기화·설정 허브·권한 복구를 구현했다. 로컬 검증과 iOS 번들</tspan><tspan x="40" y="130">동기화는 완료했으며 실제 외부 서비스와 기기 검증은 남아 있다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-00"><path d="M 582 321 L 1492 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="946" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1041" y="321" text-anchor="middle" fill="#52606d" font-size="11">자동 주행 중심 지도 일기로 확장</text></g><g data-flow="flow-01"><path d="M 874 321 L 1200 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="974" y="305" width="134" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1041" y="321" text-anchor="middle" fill="#52606d" font-size="11">승인된 위치와 끊김</text></g><g data-flow="flow-02"><path d="M 1166 321 L 1200 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1114.5" y="305" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="321" text-anchor="middle" fill="#52606d" font-size="11">저장 geometry</text></g><g data-flow="flow-03"><path d="M 1458 321 L 1784 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1552.5" y="305" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1625" y="321" text-anchor="middle" fill="#52606d" font-size="11">기준 셀과 준비 상태</text></g><g data-flow="flow-04"><path d="M 1750 321 L 1784 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1687.5" y="305" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1771" y="321" text-anchor="middle" fill="#52606d" font-size="11">지도 재사용과 표시 정책</text></g><g data-flow="flow-05"><path d="M 874 321 L 2076 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1384" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1479" y="321" text-anchor="middle" fill="#52606d" font-size="11">주행 종료와 앱 복귀 시 자동 저장</text></g><g data-flow="flow-06"><path d="M 2084 321 C 2084 349, 1166 293, 1166 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1552.5" y="307" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1625" y="323" text-anchor="middle" fill="#52606d" font-size="11">중복 없는 영구 기록</text></g><g data-flow="flow-07"><path d="M 2334 321 L 2368 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2271.5" y="305" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2355" y="321" text-anchor="middle" fill="#52606d" font-size="11">정리 결과와 저장 영수증</text></g><g data-flow="flow-08"><path d="M 1458 321 L 2368 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1833.5" y="305" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1917" y="321" text-anchor="middle" fill="#52606d" font-size="11">실제 저장 전후 칸 통계</text></g><g data-flow="flow-09"><path d="M 1750 321 L 2660 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2114" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2209" y="321" text-anchor="middle" fill="#52606d" font-size="11">화면별 동일한 정렬과 행동 위계</text></g><g data-flow="flow-10"><path d="M 1750 321 L 2952 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2260" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2355" y="321" text-anchor="middle" fill="#52606d" font-size="11">viewport 경계에 따른 노드 재배치</text></g><g data-flow="flow-11"><path d="M 2960 321 C 2960 349, 2042 293, 2042 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2406" y="307" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2501" y="323" text-anchor="middle" fill="#52606d" font-size="11">단일 지도 크기 동기화와 전체 경로 fit</text></g><g data-flow="flow-v6-00"><path d="M 290 321 L 1492 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="800" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="321" text-anchor="middle" fill="#52606d" font-size="11">기존 화면 흐름을 v6 개선 기반으로 보존</text></g><g data-flow="flow-v6-01"><path d="M 2334 321 L 3536 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2844" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2939" y="321" text-anchor="middle" fill="#52606d" font-size="11">로컬 영구 저장 뒤 완료 기록만 업로드</text></g><g data-flow="flow-v6-02"><path d="M 3502 321 L 3536 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="3428" y="305" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="3523" y="321" text-anchor="middle" fill="#52606d" font-size="11">로그인 사용자 소유권과 복원 범위</text></g><g data-flow="flow-v6-03"><path d="M 3502 321 L 3828 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="3574.5" y="305" width="189" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="3669" y="321" text-anchor="middle" fill="#52606d" font-size="11">계정 상태와 권한 진입 표시</text></g><g data-flow="flow-v6-04"><path d="M 1750 321 L 3828 321" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2709.5" y="305" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2793" y="321" text-anchor="middle" fill="#52606d" font-size="11">홈에서 설정 허브로 진입</text></g><g data-node="v6-foundation"><rect x="40" y="258" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="285" r="14" fill="#17212b"/><text x="66" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="290" fill="#17212b" font-size="16" font-weight="700">v6 분리 기반</text><text x="274" y="313" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="336" fill="#52606d" font-size="12"><tspan x="58" y="338">v5 현재 작업 트리와 Git 이력을 복제하고 로그인,</tspan><tspan x="58" y="354">설정, 권한 관리 보완용 전용 브랜치를 만들었다. 승인</tspan><tspan x="58" y="370">설계를 구현했으며 실제 서비스와 기기 검증은 별도다.</tspan></text></g><g data-node="version-lineage"><rect x="332" y="258" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="285" r="14" fill="#17212b"/><text x="358" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="290" fill="#17212b" font-size="16" font-weight="700">v1→v5 제품 진화</text><text x="566" y="313" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="350" y="336" fill="#52606d" font-size="12"><tspan x="350" y="338">수동 원본 도로 기록에서 경로 미리보기와 iOS 주행 기록,</tspan><tspan x="350" y="354">자동 감지를 거쳐 지도 일기와 영역 통계 중심 구조로</tspan><tspan x="350" y="370">확장했다.</tspan></text></g><g data-node="native-drive"><rect x="624" y="258" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="285" r="14" fill="#17212b"/><text x="650" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="290" fill="#17212b" font-size="16" font-weight="700">실제 주행 수집</text><text x="858" y="313" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="642" y="336" fill="#52606d" font-size="12"><tspan x="642" y="338">승인된 위치와 끊김 구간 및 세션 시작 시각을 제공한다.</tspan></text></g><g data-node="saved-records"><rect x="916" y="258" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="285" r="14" fill="#17212b"/><text x="942" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="290" fill="#17212b" font-size="16" font-weight="700">저장 기록</text><text x="1150" y="313" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="934" y="336" fill="#52606d" font-size="12"><tspan x="934" y="338">기존 저장 geometry와 메타데이터를 유지한다.</tspan></text></g><g data-node="territory-runtime"><rect x="1208" y="258" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="285" r="14" fill="#17212b"/><text x="1234" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="290" fill="#17212b" font-size="16" font-weight="700">기준 셀 계산</text><text x="1442" y="313" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="1226" y="336" fill="#52606d" font-size="12"><tspan x="1226" y="338">저장과 실시간 셀을 분리하고 작업 한도 및 취소 상태를</tspan><tspan x="1226" y="354">관리하며 기존 색칠 칸 재방문을 자동 집계한다.</tspan></text></g><g data-node="journal-router"><rect x="1500" y="258" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="1526" cy="285" r="14" fill="#17212b"/><text x="1526" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="1550" y="290" fill="#17212b" font-size="16" font-weight="700">전체 화면 전환</text><text x="1734" y="313" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="1518" y="336" fill="#52606d" font-size="12"><tspan x="1518" y="338">일반 검색 재진입은 초기화하고 주행 개입 초안과 기존 기록</tspan><tspan x="1518" y="354">편집은 보존한다. 뒤로가기 버튼과 좌측 가장자리 스와이프는</tspan><tspan x="1518" y="370">같은 전환 명령을 사용하며 권한 화면에서는 단일 지도를 숨겨</tspan></text></g><g data-node="map-display"><rect x="1792" y="258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1818" cy="285" r="14" fill="#17212b"/><text x="1818" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">7</text><text x="1842" y="290" fill="#17212b" font-size="16" font-weight="700">지도와 주행 지표</text><text x="2026" y="313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1810" y="336" fill="#52606d" font-size="12"><tspan x="1810" y="338">실제 km와 주행 경과 시간 및 새 칸을 한 행에 표시하고</tspan><tspan x="1810" y="354">종료 확인은 dim 위에서 입력을 받는다. 상하단</tspan><tspan x="1810" y="370">iPhone 안전영역과 공통 간격 및 테마 배경으로 버튼</tspan></text></g><g data-node="durable-save"><rect x="2084" y="258" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="2110" cy="285" r="14" fill="#17212b"/><text x="2110" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">8</text><text x="2134" y="290" fill="#17212b" font-size="16" font-weight="700">GPS 자동 저장 후 원본 정리</text><text x="2318" y="313" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="2102" y="336" fill="#52606d" font-size="12"><tspan x="2102" y="338">도로 확정 없이 GPS 구간과 거리를 저장하며 긴 공백은</tspan><tspan x="2102" y="354">연결하지 않는다. localStorage 용량 초과 때</tspan><tspan x="2102" y="370">IndexedDB의 영구 쓰기가 끝난 뒤에만 원본을 정리하고</tspan></text></g><g data-node="record-pages"><rect x="2376" y="258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="2402" cy="285" r="14" fill="#17212b"/><text x="2402" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">9</text><text x="2426" y="290" fill="#17212b" font-size="16" font-weight="700">완료와 기록함</text><text x="2610" y="313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="2394" y="336" fill="#52606d" font-size="12"><tspan x="2394" y="338">준비된 실제 통계와 저장 기록 상세를 제공한다.</tspan></text></g><g data-node="v38-visual-guideline"><rect x="2668" y="258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="2694" cy="285" r="14" fill="#17212b"/><text x="2694" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">10</text><text x="2718" y="290" fill="#17212b" font-size="16" font-weight="700">공통 화면 규격</text><text x="2902" y="313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="2686" y="336" fill="#52606d" font-size="12"><tspan x="2686" y="338">iPhone 안전영역 안의 중앙 제목과 44–48px</tspan><tspan x="2686" y="354">뒤로가기 영역, 52px 검색 행, 44px 지도 컨트롤</tspan><tspan x="2686" y="370">열, 지표 세 행, 기록 상세 편집과 주·보조·파괴적 행동</tspan></text></g><g data-node="responsive-layout"><rect x="2960" y="258" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="2986" cy="285" r="14" fill="#17212b"/><text x="2986" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">11</text><text x="3010" y="290" fill="#17212b" font-size="16" font-weight="700">폭과 실제 가용 높이 기반 작업 공간</text><text x="3194" y="313" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="2978" y="336" fill="#52606d" font-size="12"><tspan x="2978" y="338">Compact는 지도 위와 콘텐츠 아래, Medium은</tspan><tspan x="2978" y="354">홈·주행 지도와 오른쪽 패널, Expanded는</tspan><tspan x="2978" y="370">검색·검토·편집까지 지도와 폼을 좌우로 배치한다. 홈 정보</tspan></text></g><g data-node="account-auth"><rect x="3252" y="258" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="3278" cy="285" r="14" fill="#17212b"/><text x="3278" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">12</text><text x="3302" y="290" fill="#17212b" font-size="16" font-weight="700">선택 로그인과 계정 수명</text><text x="3486" y="313" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="3270" y="336" fill="#52606d" font-size="12"><tspan x="3270" y="338">Apple·Google PKCE 로그인과 비로그인 사용,</tspan><tspan x="3270" y="354">복수 identity 연결, provider 재인증</tspan><tspan x="3270" y="370">challenge, 60일 삭제 대기와 복구를 구현했다.</tspan></text></g><g data-node="cloud-sync"><rect x="3544" y="258" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="3570" cy="285" r="14" fill="#17212b"/><text x="3570" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">13</text><text x="3594" y="290" fill="#17212b" font-size="16" font-weight="700">로컬 우선 Supabase 동기화</text><text x="3778" y="313" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="3562" y="336" fill="#52606d" font-size="12"><tspan x="3562" y="338">계정별 기기 영구 저장 뒤 완료 기록과 정제 GPS만 멱등</tspan><tspan x="3562" y="354">업로드하며 네트워크 실패는 소유자별 영구 대기열에서</tspan><tspan x="3562" y="370">재시도한다. guest 기록은 합치기 동의 전 업로드하지</tspan></text></g><g data-node="settings-permissions"><rect x="3836" y="258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="3862" cy="285" r="14" fill="#17212b"/><text x="3862" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">14</text><text x="3886" y="290" fill="#17212b" font-size="16" font-weight="700">설정 허브와 순차 권한 복구</text><text x="4070" y="313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="3854" y="336" fill="#52606d" font-size="12"><tspan x="3854" y="338">계정·작동 방식·권한·내보내기·데이터 안내를 한 허브에</tspan><tspan x="3854" y="354">모으고 최초 안내 뒤 iOS 권한을 순서대로 요청하며 거부</tspan><tspan x="3854" y="370">시 설정 앱으로 연결한다.</tspan></text></g></svg>
