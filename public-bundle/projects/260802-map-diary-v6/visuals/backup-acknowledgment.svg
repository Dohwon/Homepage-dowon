<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
  <title id="title">백업 확인과 전송 중 편집 보존</title>
  <desc id="desc">대기 작업을 전송한 후 응답 실패나 취소는 작업을 남긴다. 서버가 확인한 경우에도 현재 대기 항목의 작업 식별자와 체크섬이 전송 당시와 같을 때만 정리한다.</desc>
  <rect width="760" height="510" rx="14" fill="#f8faf9"/>
  <g font-family="sans-serif" fill="#263f39">
    <text x="30" y="38" font-size="18" font-weight="700">백업 중 기록을 다시 고치면?</text>
    <text x="30" y="61" font-size="12" fill="#526962">한 번 보낸 응답이 늦게 와도 더 새로 수정된 작업을 지우지 않는 조건</text>
    <text x="330" y="101" text-anchor="middle" font-size="14" font-weight="700">계정별 대기 작업 선택과 전송</text>
    <path d="M330 113V130" stroke="#6d8980" stroke-width="2"/>
    <path d="M330 130L455 167 330 204 205 167Z" fill="#edf3fa" stroke="#718daa" stroke-width="2"/>
    <text x="330" y="163" text-anchor="middle" font-size="14" font-weight="700">서버 확인을</text><text x="330" y="181" text-anchor="middle" font-size="14" font-weight="700">받았나?</text>
    <path d="M455 167H507" fill="none" stroke="#ac785b" stroke-width="2"/><path d="M500 162l8 5-8 5" fill="none" stroke="#ac785b" stroke-width="2"/>
    <text x="481" y="154" text-anchor="middle" font-size="12" fill="#925d46">실패·취소</text><text x="516" y="162" font-size="13" font-weight="700" fill="#925d46">대기 작업 보존</text><text x="516" y="181" font-size="13" fill="#925d46">동일 작업으로 재시도</text>
    <path d="M330 204V235" fill="none" stroke="#728d84" stroke-width="2"/><path d="M325 227l5 8 5-8" fill="none" stroke="#728d84" stroke-width="2"/>
    <text x="342" y="225" font-size="12" fill="#526962">확인됨</text>
    <path d="M330 240L455 282 330 324 205 282Z" fill="#eaf3f0" stroke="#4b8979" stroke-width="2"/>
    <text x="330" y="277" text-anchor="middle" font-size="14" font-weight="700">현재 대기 항목이</text><text x="330" y="296" text-anchor="middle" font-size="14" font-weight="700">전송 당시와 같은가?</text>
    <path d="M455 282H507" fill="none" stroke="#ac785b" stroke-width="2"/><path d="M500 277l8 5-8 5" fill="none" stroke="#ac785b" stroke-width="2"/>
    <text x="481" y="269" text-anchor="middle" font-size="12" fill="#925d46">다름</text><text x="516" y="277" font-size="13" font-weight="700" fill="#925d46">새 수정 보존</text><text x="516" y="296" font-size="13" fill="#925d46">이전 응답으로 지우지 않음</text>
    <path d="M330 324V365" fill="none" stroke="#4b8979" stroke-width="2"/><path d="M325 357l5 8 5-8" fill="none" stroke="#4b8979" stroke-width="2"/>
    <text x="342" y="350" font-size="12" fill="#39796b">식별자와 체크섬 일치</text>
    <rect x="220" y="370" width="220" height="56" rx="9" fill="#e5f3ee" stroke="#4b8979"/>
    <text x="330" y="403" text-anchor="middle" font-size="14" font-weight="700">해당 대기 작업 정리</text>
    <text x="30" y="478" font-size="12" fill="#526962">계정 전환이나 인증 세대 변경 시 기존 응답을 현재 계정의 진행 상태에 반영하지 않는다.</text>
  </g>
</svg>
