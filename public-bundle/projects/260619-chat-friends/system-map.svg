<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 588.2623792124926" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">대화 입력에서 관계 기억까지</title><desc id="system-map-desc">텍스트·음성 대화와 이미지 흐름을 공통 대화 상태에 연결하고 기억 추출과 안전 처리를 분리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="588.2623792124926" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">대화 입력에서 관계 기억까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">텍스트·음성 대화와 이미지 흐름을 공통 대화 상태에 연결하고 기억 추출과</tspan><tspan x="40" y="108">안전 처리를 분리한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 218 C 674 218, 955.933 314.738, 1009.93 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="775.467" y="252.369" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="814.967" y="268.369" text-anchor="middle" fill="#52606d" font-size="11">대화 갱신</text></g><g data-flow="flow-02"><path d="M 1009.93 314.738 C 955.933 314.738, 914.992 471.262, 860.992 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="895.963" y="379" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="935.463" y="395" text-anchor="middle" fill="#52606d" font-size="11">응답 요청</text></g><g data-flow="flow-03"><path d="M 860.992 471.262 C 806.992 471.262, 433.008 471.262, 379.008 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="457.262" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="473.262" text-anchor="middle" fill="#52606d" font-size="11">기억 후보</text></g><g data-flow="flow-04"><path d="M 379.008 471.262 C 325.008 471.262, 284.067 314.738, 230.067 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="265.037" y="379" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="304.537" y="395" text-anchor="middle" fill="#52606d" font-size="11">기억 반영</text></g><g data-node="message-input"><rect x="495.0" y="155.0" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="182.0" r="14" fill="#17212b"/><text x="521.0" y="187.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="187.0" fill="#17212b" font-size="16" font-weight="700">텍스트·음성 입력</text><text x="729.0" y="210.0" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="233.0" fill="#52606d" font-size="12"><tspan x="513.0" y="235.0">사용자가 채팅 또는 실시간 음성으로 관계 맥락을 이어 간다.</tspan></text></g><g data-node="conversation-state"><rect x="884.9331716810129" y="251.73762078750735" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="910.9331716810129" cy="278.73762078750735" r="14" fill="#17212b"/><text x="910.9331716810129" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="934.9331716810129" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">대화 상태</text><text x="1118.933171681013" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="902.9331716810129" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="902.9331716810129" y="331.73762078750735">현재 대화와 선톡·단체 대화 같은 관계 흐름을 관리한다.</tspan></text></g><g data-node="response-service"><rect x="735.991953439914" y="408.26237921249265" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="761.991953439914" cy="435.26237921249265" r="14" fill="#17212b"/><text x="761.991953439914" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="785.991953439914" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">응답 생성</text><text x="969.991953439914" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="753.991953439914" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="753.991953439914" y="488.26237921249265">구조화 응답 복구와 안전 대화를 포함한 답변을 만든다.</tspan></text></g><g data-node="memory-extractor"><rect x="254.0080465600861" y="408.26237921249265" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="280.0080465600861" cy="435.26237921249265" r="14" fill="#17212b"/><text x="280.0080465600861" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="304.0080465600861" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">기억 추출</text><text x="488.0080465600861" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="272.0080465600861" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="272.0080465600861" y="488.26237921249265">답변 저장과 장기 기억 추출을 별도 작업으로 처리한다.</tspan></text></g><g data-node="relationship-memory"><rect x="105.066828318987" y="251.73762078750735" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="131.066828318987" cy="278.73762078750735" r="14" fill="#17212b"/><text x="131.066828318987" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="155.066828318987" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">관계 기억</text><text x="339.066828318987" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="123.066828318987" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="123.066828318987" y="331.73762078750735">삭제 권한과 생활 상태를 고려해 다음 대화의 맥락으로</tspan><tspan x="123.066828318987" y="347.73762078750735">제공한다.</tspan></text></g></svg>
