<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 685.2623792124926" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">대화 입력에서 관계 기억까지</title><desc id="system-map-desc">텍스트·음성 대화와 이미지 흐름을 공통 대화 상태에 연결하고 기억 추출과 안전 처리를 분리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="685.2623792124926" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">대화 입력에서 관계 기억까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">텍스트·음성 대화와 이미지 흐름을 공통</tspan><tspan x="40" y="108">대화 상태에 연결하고 기억 추출과 안전</tspan><tspan x="40" y="130">처리를 분리한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 304 C 674 304, 955.933 400.738, 1009.93 400.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="775.967" y="338.369" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="814.967" y="354.369" text-anchor="middle" fill="#52606d" font-size="11">대화 갱신</text></g><g data-flow="flow-02"><path d="M 1009.93 400.738 C 955.933 400.738, 914.992 557.262, 860.992 557.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="896.463" y="465" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="935.463" y="481" text-anchor="middle" fill="#52606d" font-size="11">응답 요청</text></g><g data-flow="flow-03"><path d="M 860.992 557.262 C 806.992 557.262, 433.008 557.262, 379.008 557.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="543.262" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="559.262" text-anchor="middle" fill="#52606d" font-size="11">기억 후보</text></g><g data-flow="flow-04"><path d="M 379.008 557.262 C 325.008 557.262, 284.067 400.738, 230.067 400.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="265.537" y="465" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="304.537" y="481" text-anchor="middle" fill="#52606d" font-size="11">기억 반영</text></g><g data-node="message-input"><rect x="495.0" y="230.0" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="257.0" r="14" fill="#17212b"/><text x="521.0" y="262.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="262.0" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="262.0">텍스트·음성 입력</tspan></text><text x="729.0" y="302.0" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="308.0" fill="#52606d" font-size="12"><tspan x="513.0" y="324.0">사용자가 채팅 또는 실시간</tspan><tspan x="513.0" y="340.0">음성으로 관계 맥락을 이어</tspan><tspan x="513.0" y="356.0">간다.</tspan></text></g><g data-node="conversation-state"><rect x="884.9331716810129" y="326.73762078750735" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="910.9331716810129" cy="353.73762078750735" r="14" fill="#17212b"/><text x="910.9331716810129" y="358.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="934.9331716810129" y="358.73762078750735" fill="#17212b" font-size="16" font-weight="700"><tspan x="934.9331716810129" y="358.73762078750735">대화 상태</tspan></text><text x="1118.933171681013" y="398.73762078750735" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="902.9331716810129" y="404.73762078750735" fill="#52606d" font-size="12"><tspan x="902.9331716810129" y="420.73762078750735">현재 대화와 선톡·단체 대화</tspan><tspan x="902.9331716810129" y="436.73762078750735">같은 관계 흐름을 관리한다.</tspan></text></g><g data-node="response-service"><rect x="735.991953439914" y="483.26237921249265" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="761.991953439914" cy="510.26237921249265" r="14" fill="#17212b"/><text x="761.991953439914" y="515.2623792124926" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="785.991953439914" y="515.2623792124926" fill="#17212b" font-size="16" font-weight="700"><tspan x="785.991953439914" y="515.2623792124926">응답 생성</tspan></text><text x="969.991953439914" y="555.2623792124926" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="753.991953439914" y="561.2623792124926" fill="#52606d" font-size="12"><tspan x="753.991953439914" y="577.2623792124926">구조화 응답 복구와 안전</tspan><tspan x="753.991953439914" y="593.2623792124926">대화를 포함한 답변을 만든다.</tspan></text></g><g data-node="memory-extractor"><rect x="254.0080465600861" y="483.26237921249265" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="280.0080465600861" cy="510.26237921249265" r="14" fill="#17212b"/><text x="280.0080465600861" y="515.2623792124926" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="304.0080465600861" y="515.2623792124926" fill="#17212b" font-size="16" font-weight="700"><tspan x="304.0080465600861" y="515.2623792124926">기억 추출</tspan></text><text x="488.0080465600861" y="555.2623792124926" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="272.0080465600861" y="561.2623792124926" fill="#52606d" font-size="12"><tspan x="272.0080465600861" y="577.2623792124926">답변 저장과 장기 기억 추출을</tspan><tspan x="272.0080465600861" y="593.2623792124926">별도 작업으로 처리한다.</tspan></text></g><g data-node="relationship-memory"><rect x="105.066828318987" y="326.73762078750735" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="131.066828318987" cy="353.73762078750735" r="14" fill="#17212b"/><text x="131.066828318987" y="358.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="155.066828318987" y="358.73762078750735" fill="#17212b" font-size="16" font-weight="700"><tspan x="155.066828318987" y="358.73762078750735">관계 기억</tspan></text><text x="339.066828318987" y="398.73762078750735" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="123.066828318987" y="404.73762078750735" fill="#52606d" font-size="12"><tspan x="123.066828318987" y="420.73762078750735">삭제 권한과 생활 상태를</tspan><tspan x="123.066828318987" y="436.73762078750735">고려해 다음 대화의 맥락으로</tspan><tspan x="123.066828318987" y="452.73762078750735">제공한다.</tspan></text></g></svg>
