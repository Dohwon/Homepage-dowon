<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1770" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">관계 맥락을 이어 가도록 설계한 AI 친구 채팅: 구조와 결정 흐름</title><desc id="system-map-desc">세 명의 고정 페르소나가 1:1과 단체 대화에서 기억, 이미지, 선톡과 안전 상태를 이어가도록 생성 경로를 나누고 실패를 격리한 선택을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1770" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">관계 맥락을 이어 가도록 설계한 AI 친구 채팅: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">세 명의 고정 페르소나가 1:1과 단체 대화에서 기억, 이미지, 선톡과 안전</tspan><tspan x="80" y="108">상태를 이어가도록 생성 경로를 나누고 실패를 격리한 선택을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 260 L 560 316" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="278" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="295" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 418 L 560 474" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="436" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="453" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 576 L 560 632" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="594" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="611" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 734 L 560 790" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="752" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="769" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 892 L 560 948" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="910" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="927" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1050 L 560 1106" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1068" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1085" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1208 L 560 1264" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1226" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1243" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1366 L 560 1422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1384" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1401" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1524 L 560 1580" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1542" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1559" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="persona-and-entry"><rect x="80" y="166" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="200" r="18" fill="#17212b"/><text x="116" y="205" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="197" fill="#17212b" font-size="17" font-weight="700">고정 페르소나와 두 가지 진입 경로</text><text x="1022" y="197" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="228" fill="#52606d" font-size="12">세 친구의 개성은 모델 선택만으로 구분하지 않고 말투 규칙, 금지 행동과 대화 예시로 고정했다. 같은 질문에 표현만...</text></g><g data-node="async-memory-boundary"><rect x="80" y="324" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="358" r="18" fill="#17212b"/><text x="116" y="363" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="355" fill="#17212b" font-size="17" font-weight="700">답변 저장과 기억 추출 분리</text><text x="1022" y="355" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="386" fill="#52606d" font-size="12">초기에는 한 생성 결과에서 답변과 기억을 함께 얻으려 했지만, 기억 파싱이 실패하면 사용자가 이미 기다린 답변까지 실...</text></g><g data-node="proactive-and-group-flow"><rect x="80" y="482" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="516" r="18" fill="#17212b"/><text x="116" y="521" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="513" fill="#17212b" font-size="17" font-weight="700">선톡 빈도와 단체 대화 길이 조정</text><text x="1022" y="513" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="544" fill="#52606d" font-size="12">먼저 오는 메시지는 30분에서 2시간 사이 간격, 낮은 생략률과 친구별 세 번 상한으로 조정했다. 완전히 드문 이벤트...</text></g><g data-node="image-path"><rect x="80" y="640" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="674" r="18" fill="#17212b"/><text x="116" y="679" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="671" fill="#17212b" font-size="17" font-weight="700">이미지를 별도 경로와 캐시로 분리</text><text x="1022" y="671" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="702" fill="#52606d" font-size="12">이미지 데이터를 메시지 본문에 직접 넣으면 최근 대화를 읽을 때마다 큰 payload가 반복 전송됐다. 이미지는 별도...</text></g><g data-node="parser-and-safety"><rect x="80" y="798" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="832" r="18" fill="#17212b"/><text x="116" y="837" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="829" fill="#17212b" font-size="17" font-weight="700">구조화 출력 복구와 안전 대화 분리</text><text x="1022" y="829" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="860" fill="#52606d" font-size="12">모델이 완결된 JSON 뒤에 설명을 덧붙이는 실제 장애를 겪은 뒤, 전체 문자열이 정확히 JSON인지 요구하는 파서를...</text></g><g data-node="relationship-memory"><rect x="80" y="956" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="990" r="18" fill="#17212b"/><text x="116" y="995" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="987" fill="#17212b" font-size="17" font-weight="700">삭제와 기억의 소유권을 분리</text><text x="1022" y="987" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1018" fill="#52606d" font-size="12">친구 삭제는 행을 지우고 새 친구를 만드는 방식이 아니라 soft delete와 restore로 처리한다. 친구 ID...</text></g><g data-node="situational-reality"><rect x="80" y="1114" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1148" r="18" fill="#17212b"/><text x="116" y="1153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1145" fill="#17212b" font-size="17" font-weight="700">생활 상태와 시간 현실성 유지</text><text x="1022" y="1145" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1176" fill="#52606d" font-size="12">생활 프로필, 현재 상황과 친구 상태 변경 이력을 별도 구조로 둬 최근 몇 문장만으로 친구의 하루를 재구성하지 않는다...</text></g><g data-node="implementation-flow"><rect x="80" y="1272" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1306" r="18" fill="#17212b"/><text x="116" y="1311" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1303" fill="#17212b" font-size="17" font-weight="700">대화와 보조 작업의 구현 구조</text><text x="1022" y="1303" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1334" fill="#52606d" font-size="12">Next.js API와 화면이 Prisma 데이터베이스를 사용하고, conversation runner가 1:1과 단...</text></g><g data-node="validation"><rect x="80" y="1430" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1464" r="18" fill="#17212b"/><text x="116" y="1469" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1461" fill="#17212b" font-size="17" font-weight="700">과거 자동 검증과 현재 작업 상태</text><text x="1022" y="1461" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1492" fill="#52606d" font-size="12">과거 작업 기록은 모델 분리 단계에서 41개, 단체 대화 확장 단계에서 46개 테스트와 typecheck, build...</text></g><g data-node="limitations"><rect x="80" y="1588" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1622" r="18" fill="#17212b"/><text x="116" y="1627" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1619" fill="#17212b" font-size="17" font-weight="700">관계형 제품에 남은 운영 한계</text><text x="1022" y="1619" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1650" fill="#52606d" font-size="12">in-process 기억 추출은 프로세스 종료 시 유실될 수 있고 재시도 원장이 없다. 안전 상태기계의 현재 통합과...</text></g></svg>
