<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1950" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">기능 호출 사전의 역할 분리와 홀드아웃 검증: 구조와 결정 흐름</title><desc id="system-map-desc">하나의 키워드 목록을 네 종류의 사전으로 분해하고, raw와 corrected 라벨 및 시기별 홀드아웃을 따로 읽어 LLM 대체 가능성과 배포 한계를 판단한 과정을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1950" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">기능 호출 사전의 역할 분리와 홀드아웃 검증: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">하나의 키워드 목록을 네 종류의 사전으로 분해하고, raw와</tspan><tspan x="80" y="108">corrected 라벨 및 시기별 홀드아웃을 따로 읽어 LLM 대체 가능성과</tspan><tspan x="80" y="130">배포 한계를 판단한 과정을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1406" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1564" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-10"><path d="M 560 1704 L 560 1760" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1722" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1739" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="independent-asset-owner"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">사전과 평가 자산을 독립 번들로 이동</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">active dictionary, 생성 중간본, 릴리즈 묶음과 리플레이 결과를 전용 프로젝트가 소유하도록 했다. Semantic 프로젝트는 동사 학습에, MoE 프로젝트는 라우팅에...</text></g><g data-node="four-dictionary-roles"><rect x="80" y="346" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">사전을 네 가지 역할로 분해</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="408" fill="#52606d" font-size="12">`substitution`은 STT 오인식과 동음 변형을 교정하고, `mapping`은 의도가 분명한 완성 명령을 직접 매핑한다. `contains_token`은 엔티티와 액션 그룹...</text></g><g data-node="precision-recall-contract"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">mapping과 contains_token의 목표를 분리</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">`mapping`에는 대상과 실행 의도가 분명하고 오매칭 위험이 낮은 문장만 넣어 정밀도를 우선했다. `contains_token`은 최소 엔티티 그룹과 액션 그룹을 함께 요구하면서...</text></g><g data-node="protect-ambiguous-input"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">대상 없는 짧은 동사는 바로 실행하지 않음</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">`올려`, `내려`, `켜`, `꺼`처럼 대상이 없는 짧은 동사는 여러 기능에 적용될 수 있다. 직전 대화에서 대상이 확정됐으면 그 문맥을 재사용하고, 문맥이 없으면 중간 인텐트로...</text></g><g data-node="separate-evaluation-populations"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">raw·corrected·홀드아웃을 따로 평가</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">운영 로그의 기존 라벨인 raw와 사람이 재검수한 corrected 라벨을 같은 정답으로 취급하지 않았다. 학습·튜닝에 쓰인 기간과 이후 시기의 홀드아웃도 분리했다. Q1 corre...</text></g><g data-node="holdout-release-gate"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">non19와 fallback을 함께 보는 배포 게이트</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">배포 판단은 전체 정확도만 보지 않는다. 직전 버전보다 fallback 정확도가 떨어지지 않아야 하고, non19가 유지되거나 상승해야 하며, 학습하지 않은 기간에서 다시 검증해야...</text></g><g data-node="resolve-rule-order"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">충돌 순서를 아직 단일화하지 못한 상태</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1198" fill="#52606d" font-size="12">정책 문서는 substitution 뒤 mapping, contains_token, contains 순서를 권장한다. 반면 팀 가이드는 contains, contains_token,...</text></g><g data-node="separate-moe-shadow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">MoE shadow 결과를 사전 정확도와 분리</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">MoE shadow는 dictionary replay와 다른 계약이다. 593건에서 오류 없이 실행됐지만 route 정확도 83.81%, policy 정확도 85.83%, end-t...</text></g><g data-node="implementation-assets"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">현재 자산과 재실행 경계</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1514" fill="#52606d" font-size="12">번들에는 네 종류의 active dictionary, 과거 생성본과 릴리즈 묶음, 기간별 리플레이 결과, 팀 정책과 shadow report가 함께 있다. 이 구조만으로 어떤 결과가...</text></g><g data-node="verified-results"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">확인된 결과와 해석 범위</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size="12">Q1 quick, 3월 corrected 홀드아웃과 11~12월 raw/corrected 결과 파일은 현재 번들에 남아 있다. 이 결과는 corrected 기준에서 높은 성능 구간이...</text></g><g data-node="current-status"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">현재 상태와 다음 gate</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1830" fill="#52606d" font-size="12">이 프로젝트가 만든 핵심 가치는 정밀 사전과 재현율 사전을 분리하고, raw와 corrected의 간극을 운영 판단으로 바꾼 것이다. 사전 자산의 소유 위치도 명확해졌다.</text></g></svg>
