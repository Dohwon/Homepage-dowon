<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">멀티턴 LLM 테스트 실행 구조: 구조와 결정 흐름</title><desc id="system-map-desc">REPL, JSON과 XLSX가 동일한 session state를 사용하고 persona 변화, 구조 복구와 전체 호출 로그를 남기는 실험 도구의 범위와 미정의 품질 gate를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">멀티턴 LLM 테스트 실행 구조: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">REPL, JSON과 XLSX가 동일한 session state를 사용하고</tspan><tspan x="80" y="108">persona 변화, 구조 복구와 전체 호출 로그를 남기는 실험 도구의</tspan><tspan x="80" y="130">범위와 미정의 품질 gate를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1248" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="shared-runner"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">세 실행 표면의 공통 계약</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="250" fill="#52606d" font-size="12">개발자는 REPL로 즉시 대화하고, JSON으로 정해진 scenario를 반복하며, 비개발 검토자는 XLSX에서 여러 행을 편집할 수 있다. 세 모드는 같은 호출과 기록 구조를 사용한다.</text></g><g data-node="session-state"><rect x="80" y="346" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">history와 persona를 명시적 상태로 관리</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="408" fill="#52606d" font-size="12">user와 model history를 SessionState가 소유한다. 모델 응답의 style signal은 현재 persona vector를 바꾸고, 다음 turn의 system...</text></g><g data-node="schema-compatibility"><rect x="80" y="504" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">provider 호환 범위로 schema 축소</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="566" fill="#52606d" font-size="12">지원이 불확실한 JSON Schema 제약을 제거하고 필수 필드 중심으로 축소했다. provider와 schema가 충돌하면 no-schema 옵션으로 실행할 수 있다.</text></g><g data-node="json-recovery"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">구조 실패에서도 raw 기록 보존</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">모델이 JSON 앞뒤에 설명을 붙인 경우 첫 번째 완결 객체를 찾아 복구한다. 복구하지 못해도 raw response와 request 기록을 남기고 scenario 전체를 즉시 폐기...</text></g><g data-node="retry-policy"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">네트워크 오류만 제한 재시도</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">연결, SSL과 timeout 같은 네트워크성 오류는 최대 3회 재시도한다. 일반 HTTP 오류는 현재 즉시 실패해 잘못된 요청을 반복하지 않는다.</text></g><g data-node="row-isolation"><rect x="80" y="978" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">XLSX 행마다 session reset</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1040" fill="#52606d" font-size="12">한 행은 하나의 독립 scenario다. 행이 바뀔 때 persona와 history를 reset해 앞선 테스트의 style 상태가 다음 행을 오염시키지 않게 한다.</text></g><g data-node="full-call-log"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">요청과 응답 전체를 재현 로그로 사용</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">system prompt, request body, raw response, parsed result와 persona transition을 함께 기록한다. 최종 텍스트만 저장하는 방...</text></g><g data-node="validation"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">실행 흔적과 품질 평가는 다름</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">원본 XLSX runner는 model response를 파싱하고 prompt, request와 response 전체를 JSONL로 기록한다. 이 구현 근거가 보장하는 것은 재현 가...</text></g><g data-node="limitations"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">다음 평가 계약</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">fixed scenario manifest, 기대 state transition, judge rubric과 합격 목표가 필요하다. 자동 테스트와 live 재실행도 이번 작업에서 확인...</text></g></svg>
