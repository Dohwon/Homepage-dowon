<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 550" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">테스트 행에서 재현 로그까지</title><desc id="system-map-desc">공통 실행 계약으로 persona·history를 관리하고 provider 응답과 실패 원문을 행별로 보존한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1546" height="550" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">테스트 행에서 재현 로그까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">공통 실행 계약으로 persona·history를</tspan><tspan x="40" y="108">관리하고 provider 응답과 실패 원문을</tspan><tspan x="40" y="130">행별로 보존한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="flow-01"><path d="M 290 304 C 290 363, 344 363, 344 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="272" y="349" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="365" text-anchor="middle" fill="#52606d" font-size="11">세션 초기화</text></g><g data-flow="flow-02"><path d="M 594 422 C 594 481, 648 245, 648 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="582" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="365" text-anchor="middle" fill="#52606d" font-size="11">공통 요청</text></g><g data-flow="flow-03"><path d="M 898 304 C 898 363, 952 363, 952 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="886" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="365" text-anchor="middle" fill="#52606d" font-size="11">응답 보존</text></g><g data-flow="flow-04"><path d="M 1202 422 C 1202 481, 1256 245, 1256 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1190" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="365" text-anchor="middle" fill="#52606d" font-size="11">재현 기록</text></g><g data-node="xlsx-row"><rect x="40" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">테스트 행</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">한 행의 질문과 persona를</tspan><tspan x="58" y="340">하나의 세션 실행으로</tspan><tspan x="58" y="356">취급한다.</tspan></text></g><g data-node="session-state"><rect x="344" y="348" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="375" r="14" fill="#17212b"/><text x="370" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="394" y="380">history·persona</tspan><tspan x="394" y="398">상태</tspan></text><text x="578" y="420" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="362" y="426" fill="#52606d" font-size="12"><tspan x="362" y="442">멀티턴 history와 persona를</tspan><tspan x="362" y="458">다음 요청에 명시적으로</tspan><tspan x="362" y="474">전달한다.</tspan></text></g><g data-node="provider-runner"><rect x="648" y="230" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="257" r="14" fill="#17212b"/><text x="674" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="698" y="262">Provider 실행기</tspan></text><text x="882" y="302" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="666" y="308" fill="#52606d" font-size="12"><tspan x="666" y="324">세 실행 표면이 공통</tspan><tspan x="666" y="340">요청·응답 계약을 사용한다.</tspan></text></g><g data-node="raw-response"><rect x="952" y="348" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="375" r="14" fill="#17212b"/><text x="978" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="1002" y="380">원시 응답</tspan></text><text x="1186" y="420" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="970" y="426" fill="#52606d" font-size="12"><tspan x="970" y="442">schema 실패나 네트워크</tspan><tspan x="970" y="458">오류에도 요청과 응답 원문을</tspan><tspan x="970" y="474">보존한다.</tspan></text></g><g data-node="replay-report"><rect x="1256" y="230" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="257" r="14" fill="#17212b"/><text x="1282" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="1306" y="262">재현 로그·평가</tspan></text><text x="1490" y="302" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1274" y="308" fill="#52606d" font-size="12"><tspan x="1274" y="324">실행 흔적과 품질 평가를</tspan><tspan x="1274" y="340">분리해 다음 분석에서 다시</tspan><tspan x="1274" y="356">사용할 수 있게 한다.</tspan></text></g></svg>
