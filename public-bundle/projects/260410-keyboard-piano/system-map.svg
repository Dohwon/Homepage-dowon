<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 618" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">키 입력에서 피아노 소리와 연습 화면까지</title><desc id="system-map-desc">브라우저 키보드 입력을 음계와 피아노 샘플 재생으로 연결하고 연주·연습 상태를 화면에 표시한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="618" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">키 입력에서 피아노 소리와 연습 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">브라우저 키보드 입력을 음계와 피아노 샘플 재생으로 연결하고 연주·연습</tspan><tspan x="40" y="108">상태를 화면에 표시한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 271 C 290 299, 358 243, 358 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="273" text-anchor="middle" fill="#52606d" font-size="11">음계 변환</text></g><g data-flow="flow-02"><path d="M 608 271 C 608 299, 676 243, 676 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="602.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="273" text-anchor="middle" fill="#52606d" font-size="11">소리 선택</text></g><g data-flow="flow-03"><path d="M 676 271 C 676 386, 290 386, 290 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="443.5" y="372" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="388" text-anchor="middle" fill="#52606d" font-size="11">연주 상태</text></g><g data-flow="flow-04"><path d="M 290 501 C 290 529, 358 473, 358 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="487" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="503" text-anchor="middle" fill="#52606d" font-size="11">화면 표시</text></g><g data-node="keyboard-input"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">키보드 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">설치 없이 브라우저에서 컴퓨터 키를 누른다.</tspan></text></g><g data-node="note-mapping"><rect x="358" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="235" r="14" fill="#17212b"/><text x="384" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="240" fill="#17212b" font-size="16" font-weight="700">반음계 매핑</text><text x="592" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="376" y="286" fill="#52606d" font-size="12"><tspan x="376" y="288">J 키를 중심으로 각 키를 음계와 연결한다.</tspan></text></g><g data-node="piano-samples"><rect x="676" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="235" r="14" fill="#17212b"/><text x="702" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="240" fill="#17212b" font-size="16" font-weight="700">피아노 샘플</text><text x="910" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="694" y="286" fill="#52606d" font-size="12"><tspan x="694" y="288">합성음 대신 매핑된 건반의 피아노 음원을 재생한다.</tspan></text></g><g data-node="play-mode"><rect x="40" y="438" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="465" r="14" fill="#17212b"/><text x="66" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="470" fill="#17212b" font-size="16" font-weight="700">연주·연습 상태</text><text x="274" y="493" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="58" y="516" fill="#52606d" font-size="12"><tspan x="58" y="518">자유 연주와 낙하 노트 연습 흐름을 구분한다.</tspan></text></g><g data-node="piano-screen"><rect x="358" y="438" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="465" r="14" fill="#17212b"/><text x="384" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="470" fill="#17212b" font-size="16" font-weight="700">건반 화면</text><text x="592" y="493" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="376" y="516" fill="#52606d" font-size="12"><tspan x="376" y="518">현재 입력과 다음 노트를 시각적으로 보여 준다.</tspan></text></g></svg>
