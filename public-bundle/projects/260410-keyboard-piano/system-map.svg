<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1454" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">키보드를 건반으로 바꾼 브라우저 피아노: 구조와 결정 흐름</title><desc id="system-map-desc">문자키 중심의 반음계 매핑, 모드가 켜졌을 때만 확장키를 사용하는 입력 경계, 합성음에서 샘플 음원으로의 롤백과 연습 기능 확장을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1454" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">키보드를 건반으로 바꾼 브라우저 피아노: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">문자키 중심의 반음계 매핑, 모드가 켜졌을 때만 확장키를 사용하는 입력</tspan><tspan x="80" y="108">경계, 합성음에서 샘플 음원으로의 롤백과 연습 기능 확장을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 260 L 560 316" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="278" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="295" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 418 L 560 474" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="436" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="453" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 576 L 560 632" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="594" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="611" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 734 L 560 790" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="752" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="769" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 892 L 560 948" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="910" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="927" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-06"><path d="M 560 1050 L 560 1106" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1068" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1085" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-07"><path d="M 560 1208 L 560 1264" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1226" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1243" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="166" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="200" r="18" fill="#17212b"/><text x="116" y="205" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="197" fill="#17212b" font-size="17" font-weight="700">설치 없이 바로 연주하는 정적 앱</text><text x="1022" y="197" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="228" fill="#52606d" font-size="12">Keyboard Piano는 서버, 계정과 빌드 과정 없이 브라우저에서 바로 여는 Web Audio 앱으로 범위를 정했다. 컴퓨터 키보드의 중심에 손을 둔 상태에서 흰건반과 검은건반...</text></g><g data-node="keyboard-map"><rect x="80" y="324" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="358" r="18" fill="#17212b"/><text x="116" y="363" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="355" fill="#17212b" font-size="17" font-weight="700">J 키를 중심으로 반음계 배치</text><text x="1022" y="355" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="386" fill="#52606d" font-size="12">J 키를 C4 기준으로 두고 주변 문자키를 반음계 건반에 대응시켰다. 현재 수정된 코드는 C3에서 D5와 추가 음까지 넓어졌지만 README 일부는 초기 범위를 설명한다. 사용자에게...</text></g><g data-node="sample-audio-rollback"><rect x="80" y="482" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="516" r="18" fill="#17212b"/><text x="116" y="521" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="513" fill="#17212b" font-size="17" font-weight="700">합성음에서 피아노 샘플로 전환</text><text x="1022" y="513" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="544" fill="#52606d" font-size="12">초기 oscillator 합성음은 구현이 가볍지만 실제 피아노와 거리가 있는 음색이었다. 이를 철회하고 로컬 피아노 샘플과 reverb를 사용하는 방식으로 바꿨다. 음질을 얻는 대신...</text></g><g data-node="practice-mode"><rect x="80" y="640" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="674" r="18" fill="#17212b"/><text x="116" y="679" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="671" fill="#17212b" font-size="17" font-weight="700">자유 연주와 연습 흐름 분리</text><text x="1022" y="671" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="702" fill="#52606d" font-size="12">자유 연주 경험을 유지하면서 연습 기능은 별도 탭으로 분리했다. 목표 음을 따라가는 학습 상태가 기본 연주 입력을 방해하지 않게 하고, 사용자가 연주와 연습 중 어느 모드에 있는지...</text></g><g data-node="falling-notes"><rect x="80" y="798" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="832" r="18" fill="#17212b"/><text x="116" y="837" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="829" fill="#17212b" font-size="17" font-weight="700">다음 입력을 낙하 노트로 시각화</text><text x="1022" y="829" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="860" fill="#52606d" font-size="12">연습 중 다음 입력을 텍스트만 보여 주지 않고 낙하 노트, demo와 hint로 시각화한다. 현재 음과 목표 음의 관계를 건반 위치와 시간 흐름으로 이해시키려는 선택이다.</text></g><g data-node="implementation-flow"><rect x="80" y="956" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="990" r="18" fill="#17212b"/><text x="116" y="995" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="987" fill="#17212b" font-size="17" font-weight="700">하나의 브라우저 스크립트에 모인 상태</text><text x="1022" y="987" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1018" fill="#52606d" font-size="12">브라우저 스크립트가 key map, AudioContext, 샘플 로딩과 pitch shift, reverb, 자유 연주와 연습 상태, 곡 진행을 관리한다. HTML과 CSS는 건반...</text></g><g data-node="validation"><rect x="80" y="1114" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1148" r="18" fill="#17212b"/><text x="116" y="1153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1145" fill="#17212b" font-size="17" font-weight="700">현재는 문법까지만 확인</text><text x="1022" y="1145" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1176" fill="#52606d" font-size="12">현재 브라우저 스크립트의 JavaScript 문법을 확인했다. 자동 테스트와 매핑된 작업 세션은 없다. dirty 코드의 연습곡 수와 상태는 읽을 수 있지만 실제 사용자 입력과 소리...</text></g><g data-node="limitations"><rect x="80" y="1272" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1306" r="18" fill="#17212b"/><text x="116" y="1311" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1303" fill="#17212b" font-size="17" font-weight="700">음원과 입력 환경에 남은 한계</text><text x="1022" y="1303" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1334" fill="#52606d" font-size="12">자동 테스트가 없고 현재 변경은 커밋된 기준과 다르며 README도 일부 구식이다. 음원 라이선스와 배포 자산, 실제 오디오 품질, 키 rollover와 latency를 확인해야 한다.</text></g></svg>
