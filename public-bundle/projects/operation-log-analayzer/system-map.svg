<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1360" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">로그 파일에서 월별 세션 산출물까지</title><desc id="system-map-desc">손상 입력을 격리하고 중복 제거·시간순 세션 복원·상태 계산을 거쳐 품질 산출물을 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1360" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">로그 파일에서 월별 세션 산출물까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">손상 입력을 격리하고 중복 제거·시간순</tspan><tspan x="40" y="108">세션 복원·상태 계산을 거쳐 품질 산출물을</tspan><tspan x="40" y="130">만든다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 378 C 620 416, 620 416, 620 454" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="578" y="402" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="418" text-anchor="middle" fill="#52606d" font-size="11">정제·격리</text></g><g data-flow="flow-02"><path d="M 620 610 C 620 648, 620 648, 620 686" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="634" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="650" text-anchor="middle" fill="#52606d" font-size="11">세션 복원</text></g><g data-flow="flow-03"><path d="M 620 842 C 620 880, 620 880, 620 918" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="866" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="882" text-anchor="middle" fill="#52606d" font-size="11">품질 계산</text></g><g data-flow="flow-04"><path d="M 620 1074 C 620 1112, 620 1112, 620 1150" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="1098" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1114" text-anchor="middle" fill="#52606d" font-size="11">산출물 생성</text></g><g data-node="log-files"><rect x="495.0" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="257" r="14" fill="#17212b"/><text x="521.0" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="262">운영 로그 파일</tspan></text><text x="729.0" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="308" fill="#52606d" font-size="12"><tspan x="513.0" y="324">여러 파일에 흩어진 이벤트와</tspan><tspan x="513.0" y="340">인코딩 상태를 입력으로</tspan><tspan x="513.0" y="356">받는다.</tspan></text></g><g data-node="clean-event-stream"><rect x="495.0" y="462" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="489" r="14" fill="#17212b"/><text x="521.0" y="494" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="494" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="494">정제 이벤트 스트림</tspan></text><text x="729.0" y="534" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="540" fill="#52606d" font-size="12"><tspan x="513.0" y="556">손상 파일을 중단시키지 않고</tspan><tspan x="513.0" y="572">격리한 뒤 명시적으로 중복</tspan><tspan x="513.0" y="588">제거한다.</tspan></text></g><g data-node="session-state-machine"><rect x="495.0" y="694" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="721" r="14" fill="#17212b"/><text x="521.0" y="726" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="726" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="726">세션 상태 기계</tspan></text><text x="729.0" y="766" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="772" fill="#52606d" font-size="12"><tspan x="513.0" y="788">SQLite 오름차순 스트리밍으로</tspan><tspan x="513.0" y="804">log_id별 FIFO pairing과 세션</tspan><tspan x="513.0" y="820">순서를 복원한다.</tspan></text></g><g data-node="quality-signals"><rect x="495.0" y="926" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="953" r="14" fill="#17212b"/><text x="521.0" y="958" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="958" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="958">검색·실패 품질</tspan><tspan x="545.0" y="976">신호</tspan></text><text x="729.0" y="998" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="1004" fill="#52606d" font-size="12"><tspan x="513.0" y="1020">검색 후보와 실제 실행, 실패</tspan><tspan x="513.0" y="1036">원인과 제품 backlog를</tspan><tspan x="513.0" y="1052">분리한다.</tspan></text></g><g data-node="monthly-artifacts"><rect x="495.0" y="1158" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1185" r="14" fill="#17212b"/><text x="521.0" y="1190" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1190" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1190">월별 산출물</tspan></text><text x="729.0" y="1230" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1236" fill="#52606d" font-size="12"><tspan x="513.0" y="1252">재현 가능한 월별 파일과 인계</tspan><tspan x="513.0" y="1268">자료로 결과를 남긴다.</tspan></text></g></svg>
