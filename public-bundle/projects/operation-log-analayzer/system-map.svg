<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1228" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">로그 파일에서 월별 세션 산출물까지</title><desc id="system-map-desc">손상 입력을 격리하고 중복 제거·시간순 세션 복원·상태 계산을 거쳐 품질 산출물을 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1228" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">로그 파일에서 월별 세션 산출물까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">손상 입력을 격리하고 중복 제거·시간순 세션 복원·상태 계산을 거쳐 품질</tspan><tspan x="40" y="108">산출물을 만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 334 C 620 372, 620 372, 620 410" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="358" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="374" text-anchor="middle" fill="#52606d" font-size="11">정제·격리</text></g><g data-flow="flow-02"><path d="M 620 544 C 620 582, 620 582, 620 620" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="568" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="584" text-anchor="middle" fill="#52606d" font-size="11">세션 복원</text></g><g data-flow="flow-03"><path d="M 620 754 C 620 792, 620 792, 620 830" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="778" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="794" text-anchor="middle" fill="#52606d" font-size="11">품질 계산</text></g><g data-flow="flow-04"><path d="M 620 964 C 620 1002, 620 1002, 620 1040" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="988" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1004" text-anchor="middle" fill="#52606d" font-size="11">산출물 생성</text></g><g data-node="log-files"><rect x="495.0" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700">운영 로그 파일</text><text x="729.0" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="288">여러 파일에 흩어진 이벤트와 인코딩 상태를 입력으로 받는다.</tspan></text></g><g data-node="clean-event-stream"><rect x="495.0" y="418" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="445" r="14" fill="#17212b"/><text x="521.0" y="450" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="450" fill="#17212b" font-size="16" font-weight="700">정제 이벤트 스트림</text><text x="729.0" y="473" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="496" fill="#52606d" font-size="12"><tspan x="513.0" y="498">손상 파일을 중단시키지 않고 격리한 뒤 명시적으로 중복</tspan><tspan x="513.0" y="514">제거한다.</tspan></text></g><g data-node="session-state-machine"><rect x="495.0" y="628" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="655" r="14" fill="#17212b"/><text x="521.0" y="660" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="660" fill="#17212b" font-size="16" font-weight="700">세션 상태 기계</text><text x="729.0" y="683" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="706" fill="#52606d" font-size="12"><tspan x="513.0" y="708">SQLite 오름차순 스트리밍으로 log_id별 FIFO</tspan><tspan x="513.0" y="724">pairing과 세션 순서를 복원한다.</tspan></text></g><g data-node="quality-signals"><rect x="495.0" y="838" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="865" r="14" fill="#17212b"/><text x="521.0" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="870" fill="#17212b" font-size="16" font-weight="700">검색·실패 품질 신호</text><text x="729.0" y="893" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="916" fill="#52606d" font-size="12"><tspan x="513.0" y="918">검색 후보와 실제 실행, 실패 원인과 제품 backlog를</tspan><tspan x="513.0" y="934">분리한다.</tspan></text></g><g data-node="monthly-artifacts"><rect x="495.0" y="1048" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1075" r="14" fill="#17212b"/><text x="521.0" y="1080" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1080" fill="#17212b" font-size="16" font-weight="700">월별 산출물</text><text x="729.0" y="1103" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1126" fill="#52606d" font-size="12"><tspan x="513.0" y="1128">재현 가능한 월별 파일과 인계 자료로 결과를 남긴다.</tspan></text></g></svg>
