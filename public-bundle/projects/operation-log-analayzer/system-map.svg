<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">대용량 운영 로그의 세션 복원과 품질 정정: 구조와 결정 흐름</title><desc id="system-map-desc">인코딩 손상과 중복을 먼저 격리하고 수백만 행을 시간순 세션으로 복원해 cloud와 on-device 사용, 실패 원인과 계산 불가능한 지표를 월별 운영 판단으로 바꾼 과정을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">대용량 운영 로그의 세션 복원과 품질 정정: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">인코딩 손상과 중복을 먼저 격리하고 수백만 행을 시간순 세션으로 복원해</tspan><tspan x="80" y="108">cloud와 on-device 사용, 실패 원인과 계산 불가능한 지표를 월별</tspan><tspan x="80" y="130">운영 판단으로 바꾼 과정을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1248" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1406" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="quarantine-corrupt-input"><rect x="80" y="188" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">인코딩 손상 입력을 중단하고 격리</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="250" fill="#52606d" font-size="12">첫 4~6월 입력은 계속 처리하지 않았다. 디코딩 replacement 문자가 포함된 실행을 불완전 run으로 보존하...</text></g><g data-node="explicit-dedup"><rect x="80" y="346" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">일곱 파일을 병합한 뒤 명시적으로 중복 제거</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="408" fill="#52606d" font-size="12">월별 재수집 파일은 기간이 겹칠 수 있어 일곱 입력을 합친 뒤 중복 키로 제거했다. 과거 실행에서는 원본 4,656,...</text></g><g data-node="sqlite-ascending-order"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">SQLite 오름차순 스트리밍으로 세션 순서 복원</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">수백만 행을 메모리에서 한 번에 정렬하지 않고 임시 SQLite에 적재했다. timestamp와 row ID 인덱스를...</text></g><g data-node="session-state-machine"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">log_id별 상태 기계와 FIFO pairing</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">전체 로그에 하나의 전역 상태를 두지 않고 `log_id`마다 세션 유형과 현재 모드를 관리했다. cloud toke...</text></g><g data-node="split-search-signals"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">검색 후보와 실제 검색 실행을 별도 지표로 분리</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">검색이 필요해 보이는 질문과 실제 검색 후처리가 실행된 답변은 같은 신호가 아니다. 사용자 발화의 키워드로 후보를 만...</text></g><g data-node="failure-taxonomy"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">실패 원인과 제품 backlog를 분리</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">실패를 한 종류로 합치지 않고 클라우드 이용 미동의, 이해 실패, 일반 처리 실패, 네트워크·타임아웃 등으로 나눴다....</text></g><g data-node="null-not-zero"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">계산 불가능한 사용자 지표를 0으로 쓰지 않음</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1198" fill="#52606d" font-size="12">2026년 일부 월에는 사용자 식별 필드가 비어 있었다. 초기 workbook은 전체 사용자와 동의 미완료 사용자를...</text></g><g data-node="implementation-flow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">입력에서 월별 산출물까지의 구현</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">CSV는 chunk 단위로 SQLite에 들어가며 timestamp와 세션 키가 정규화된다. 첫 pass가 세션 유형...</text></g><g data-node="verified-results"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">확인된 실행 규모와 산출물</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">2026년 6월 worklog에는 중복 제거 후 4,656,218행과 1,937,834세션을 처리한 기록이 있다. 월...</text></g><g data-node="unresolved-boundaries"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">재현과 인계에 남은 한계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1672" fill="#52606d" font-size="12">이번 근거 세트에는 dedup 전처리, 본 처리, 비즈니스 분석을 하나의 재현 명령으로 검증한 기록이 없다. 과거 w...</text></g></svg>
