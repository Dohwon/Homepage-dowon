<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1476" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">선호 분석과 수동 큐레이션을 잇는 도구: 구조와 결정 흐름</title><desc id="system-map-desc">후보 탐색, 외모와 성격 분석, 생성 초상과 소개 패키지를 단계로 나누고 자동 매칭 대신 동의 기반 운영자 큐레이션을 선택한 에디토리얼 MVP를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1476" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">선호 분석과 수동 큐레이션을 잇는 도구: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">후보 탐색, 외모와 성격 분석, 생성 초상과 소개 패키지를 단계로 나누고</tspan><tspan x="80" y="108">자동 매칭 대신 동의 기반 운영자 큐레이션을 선택한 에디토리얼 MVP를</tspan><tspan x="80" y="130">정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="932" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1090" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="bounded-selection"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">후보 선택을 3명에서 10명으로 제한</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">한 번에 비교할 후보는 최소 3명, 최대 10명으로 제한했다. 후보가 너무 적으면 공통 선호를 찾기 어렵고 무제한이면 각 선택의 이유를 기억하기 어렵다. 수집량보다 비교 가능한 입력...</text></g><g data-node="split-analysis"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">외모와 성격 분석을 별도 단계로</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">외모와 성격을 하나의 점수로 합치지 않고 별도 탭, 선택과 결과로 분리했다. 서로 다른 판단 근거를 같은 축으로 섞으면 사용자가 왜 결과가 나왔는지 설명하기 어렵기 때문이다. 두 분...</text></g><g data-node="structured-fallback"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">구조화 결과와 demo fallback</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">분석 결과는 화면이 안정적으로 소비할 수 있는 구조로 받는다. 외부 모델 설정이 없거나 호출이 실패할 때는 local 또는 demo 결과를 사용해 후보 선택부터 결과 화면까지의 UX...</text></g><g data-node="editorial-output"><rect x="80" y="662" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">분석을 소개 패키지로 확장</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="724" fill="#52606d" font-size="12">결과를 선호 설명 텍스트로 끝내지 않고 생성 초상과 Curator Match Pack으로 확장했다. 선택 근거, 종합 설명과 이미지 콘셉트를 한 묶음으로 만들어 운영자가 소개를 검토...</text></g><g data-node="manual-curation"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">자동 매칭 대신 운영자 검토</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="882" fill="#52606d" font-size="12">분석 결과만으로 사용자를 자동 연결하지 않는다. 신청 단계에서 표시명, 연락 방법과 동의를 받고 운영자가 큐레이션 큐에서 검토한다. 관리 화면은 신청 조회와 XLS 내보내기를 제공해...</text></g><g data-node="implementation-flow"><rect x="80" y="978" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">선택에서 운영 큐까지</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1040" fill="#52606d" font-size="12">단일 Node 서버가 정적 사용자 화면과 관리자 화면, 검색, 분석, 이미지, match pack과 신청 API를 제공한다. 사용자 화면은 검색 후보와 선택 후보를 분리하고 외모와...</text></g><g data-node="validation"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">현재 문법과 과거 endpoint 확인</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">현재 서버, 사용자 화면과 관리자 화면의 JavaScript 문법을 확인했다. 구현 로그에는 과거 health 응답과 주요 endpoint를 호출한 기록이 있다. 자동 테스트와 현재...</text></g><g data-node="limitations"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">신청 데이터를 다루기 전의 과제</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1356" fill="#52606d" font-size="12">표시명과 연락 방법, 동의 기록의 최소 수집, 암호화, 보존과 삭제 정책이 부족하다. 단순 관리자 인증은 공개 운영 강도로 충분하지 않고, 여러 운영자의 권한과 변경 감사도 없다.</text></g></svg>
