<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1338" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">신청 데이터에서 소개 패키지까지</title><desc id="system-map-desc">후보 분석을 자동 매칭으로 확정하지 않고 운영자 검토를 거쳐 소개용 결과물로 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1338" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">신청 데이터에서 소개 패키지까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">후보 분석을 자동 매칭으로 확정하지 않고</tspan><tspan x="40" y="108">운영자 검토를 거쳐 소개용 결과물로 만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 356 C 620 394, 620 394, 620 432" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="380" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="396" text-anchor="middle" fill="#52606d" font-size="11">후보 선택</text></g><g data-flow="flow-02"><path d="M 620 588 C 620 626, 620 626, 620 664" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="584" y="612" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="628" text-anchor="middle" fill="#52606d" font-size="11">분석</text></g><g data-flow="flow-03"><path d="M 620 820 C 620 858, 620 858, 620 896" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="844" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="860" text-anchor="middle" fill="#52606d" font-size="11">검토 대기</text></g><g data-flow="flow-04"><path d="M 620 1052 C 620 1090, 620 1090, 620 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="1076" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1092" text-anchor="middle" fill="#52606d" font-size="11">소개 패키지</text></g><g data-node="application"><rect x="495.0" y="208" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="240">신청 데이터</tspan></text><text x="729.0" y="280" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="302">사용자가 제공한 자기소개와</tspan><tspan x="513.0" y="318">선호 정보다.</tspan></text></g><g data-node="candidate-set"><rect x="495.0" y="440" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="467" r="14" fill="#17212b"/><text x="521.0" y="472" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="472" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="472">후보 묶음</tspan></text><text x="729.0" y="512" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="518" fill="#52606d" font-size="12"><tspan x="513.0" y="534">비교할 후보를 제한된 수로</tspan><tspan x="513.0" y="550">선택하고 분석 대상 집합을</tspan><tspan x="513.0" y="566">만든다.</tspan></text></g><g data-node="trait-analysis"><rect x="495.0" y="672" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="699" r="14" fill="#17212b"/><text x="521.0" y="704" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="704" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="704">외모·성격 분석</tspan></text><text x="729.0" y="744" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="750" fill="#52606d" font-size="12"><tspan x="513.0" y="766">외모와 성격을 분리된 분석</tspan><tspan x="513.0" y="782">단계와 구조화 결과로</tspan><tspan x="513.0" y="798">처리한다.</tspan></text></g><g data-node="operator-review"><rect x="495.0" y="904" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="931" r="14" fill="#17212b"/><text x="521.0" y="936" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="936" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="936">운영자 큐</tspan></text><text x="729.0" y="976" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="982" fill="#52606d" font-size="12"><tspan x="513.0" y="998">자동 결과를 바로 매칭하지</tspan><tspan x="513.0" y="1014">않고 사람이 검토·수정한다.</tspan></text></g><g data-node="intro-package"><rect x="495.0" y="1136" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1163" r="14" fill="#17212b"/><text x="521.0" y="1168" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1168" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1168">소개 패키지</tspan></text><text x="729.0" y="1208" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1214" fill="#52606d" font-size="12"><tspan x="513.0" y="1230">검토된 후보와 설명을 다음</tspan><tspan x="513.0" y="1246">운영 단계에서 사용할</tspan><tspan x="513.0" y="1262">패키지로 만든다.</tspan></text></g></svg>
