<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1228" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">신청 데이터에서 소개 패키지까지</title><desc id="system-map-desc">후보 분석을 자동 매칭으로 확정하지 않고 운영자 검토를 거쳐 소개용 결과물로 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1228" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">신청 데이터에서 소개 패키지까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">후보 분석을 자동 매칭으로 확정하지 않고 운영자 검토를 거쳐 소개용 결과물로</tspan><tspan x="40" y="108">만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 334 C 620 372, 620 372, 620 410" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="358" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="374" text-anchor="middle" fill="#52606d" font-size="11">후보 선택</text></g><g data-flow="flow-02"><path d="M 620 544 C 620 582, 620 582, 620 620" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="584" y="568" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="584" text-anchor="middle" fill="#52606d" font-size="11">분석</text></g><g data-flow="flow-03"><path d="M 620 754 C 620 792, 620 792, 620 830" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="778" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="794" text-anchor="middle" fill="#52606d" font-size="11">검토 대기</text></g><g data-flow="flow-04"><path d="M 620 964 C 620 1002, 620 1002, 620 1040" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="988" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1004" text-anchor="middle" fill="#52606d" font-size="11">소개 패키지</text></g><g data-node="application"><rect x="495.0" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700">신청 데이터</text><text x="729.0" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="288">사용자가 제공한 자기소개와 선호 정보다.</tspan></text></g><g data-node="candidate-set"><rect x="495.0" y="418" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="445" r="14" fill="#17212b"/><text x="521.0" y="450" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="450" fill="#17212b" font-size="16" font-weight="700">후보 묶음</text><text x="729.0" y="473" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="496" fill="#52606d" font-size="12"><tspan x="513.0" y="498">비교할 후보를 제한된 수로 선택하고 분석 대상 집합을</tspan><tspan x="513.0" y="514">만든다.</tspan></text></g><g data-node="trait-analysis"><rect x="495.0" y="628" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="655" r="14" fill="#17212b"/><text x="521.0" y="660" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="660" fill="#17212b" font-size="16" font-weight="700">외모·성격 분석</text><text x="729.0" y="683" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="706" fill="#52606d" font-size="12"><tspan x="513.0" y="708">외모와 성격을 분리된 분석 단계와 구조화 결과로 처리한다.</tspan></text></g><g data-node="operator-review"><rect x="495.0" y="838" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="865" r="14" fill="#17212b"/><text x="521.0" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="870" fill="#17212b" font-size="16" font-weight="700">운영자 큐</text><text x="729.0" y="893" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="916" fill="#52606d" font-size="12"><tspan x="513.0" y="918">자동 결과를 바로 매칭하지 않고 사람이 검토·수정한다.</tspan></text></g><g data-node="intro-package"><rect x="495.0" y="1048" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1075" r="14" fill="#17212b"/><text x="521.0" y="1080" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1080" fill="#17212b" font-size="16" font-weight="700">소개 패키지</text><text x="729.0" y="1103" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1126" fill="#52606d" font-size="12"><tspan x="513.0" y="1128">검토된 후보와 설명을 다음 운영 단계에서 사용할 패키지로</tspan><tspan x="513.0" y="1144">만든다.</tspan></text></g></svg>
