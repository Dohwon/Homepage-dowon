<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">도로 선택에서 주행 기록까지</title><desc id="system-map-desc">웹에서 설명 가능한 장거리 경로를 계산하고 지도에 표시한 뒤 실제 주행과 simulation 기록을 구분한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="420" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">도로 선택에서 주행 기록까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">웹에서 설명 가능한 장거리 경로를 계산하고 지도에 표시한 뒤 실제 주행과</tspan><tspan x="40" y="108">simulation 기록을 구분한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-01"><path d="M 290 299 L 324 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="283" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="299" text-anchor="middle" fill="#52606d" font-size="11">경로 계산</text></g><g data-flow="flow-02"><path d="M 582 299 L 616 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="552.5" y="283" width="101" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="299" text-anchor="middle" fill="#52606d" font-size="11">부가정보 결합</text></g><g data-flow="flow-03"><path d="M 874 299 L 908 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="855.5" y="283" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="299" text-anchor="middle" fill="#52606d" font-size="11">지도 표시</text></g><g data-flow="flow-04"><path d="M 1166 299 L 1200 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1147.5" y="283" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="299" text-anchor="middle" fill="#52606d" font-size="11">주행 기록</text></g><g data-node="route-request"><rect x="40" y="236" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="263" r="14" fill="#17212b"/><text x="66" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="268" fill="#17212b" font-size="16" font-weight="700">장거리 경로 요청</text><text x="274" y="291" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="314" fill="#52606d" font-size="12"><tspan x="58" y="316">최단거리보다 오래 달릴 도로와 설명 가능한 주행을 요청한다.</tspan></text></g><g data-node="route-core"><rect x="332" y="236" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="263" r="14" fill="#17212b"/><text x="358" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="268" fill="#17212b" font-size="16" font-weight="700">경로 계산</text><text x="566" y="291" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="350" y="314" fill="#52606d" font-size="12"><tspan x="350" y="316">경로 provider에서 받은 기본 경로를 주행 가능한 구간</tspan><tspan x="350" y="332">구조로 만든다.</tspan></text></g><g data-node="road-enrichment"><rect x="624" y="236" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="263" r="14" fill="#17212b"/><text x="650" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="268" fill="#17212b" font-size="16" font-weight="700">도로 부가정보</text><text x="858" y="291" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="314" fill="#52606d" font-size="12"><tspan x="642" y="316">차선·속도·단속 등 신뢰 기준을 통과한 정보를 경로에</tspan><tspan x="642" y="332">덧붙인다.</tspan></text></g><g data-node="map-driving-ui"><rect x="916" y="236" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="263" r="14" fill="#17212b"/><text x="942" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="268" fill="#17212b" font-size="16" font-weight="700">지도·주행 화면</text><text x="1150" y="291" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="934" y="314" fill="#52606d" font-size="12"><tspan x="934" y="316">heading-up 지도와 Road Master 상태로 현재</tspan><tspan x="934" y="332">경로와 진입 방향을 보여 준다.</tspan></text></g><g data-node="drive-record"><rect x="1208" y="236" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="263" r="14" fill="#17212b"/><text x="1234" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="268" fill="#17212b" font-size="16" font-weight="700">실제 주행 기록</text><text x="1442" y="291" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1226" y="314" fill="#52606d" font-size="12"><tspan x="1226" y="316">실제 차량 좌표와 simulation을 구분해 주행 결과를</tspan><tspan x="1226" y="332">저장한다.</tspan></text></g></svg>
