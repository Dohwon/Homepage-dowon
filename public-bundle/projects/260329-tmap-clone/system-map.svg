<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1498 460" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">도로 선택에서 주행 기록까지</title><desc id="system-map-desc">웹에서 설명 가능한 장거리 경로를 계산하고 지도에 표시한 뒤 실제 주행과 simulation 기록을 구분한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1498" height="460" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">도로 선택에서 주행 기록까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">웹에서 설명 가능한 장거리 경로를 계산하고</tspan><tspan x="40" y="108">지도에 표시한 뒤 실제 주행과 simulation</tspan><tspan x="40" y="130">기록을 구분한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-01"><path d="M 290 332 L 324 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="272" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="332" text-anchor="middle" fill="#52606d" font-size="11">경로 계산</text></g><g data-flow="flow-02"><path d="M 582 332 L 616 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="552" y="316" width="102" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="332" text-anchor="middle" fill="#52606d" font-size="11">부가정보 결합</text></g><g data-flow="flow-03"><path d="M 874 332 L 908 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="856" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="332" text-anchor="middle" fill="#52606d" font-size="11">지도 표시</text></g><g data-flow="flow-04"><path d="M 1166 332 L 1200 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1148" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="332" text-anchor="middle" fill="#52606d" font-size="11">주행 기록</text></g><g data-node="route-request"><rect x="40" y="258" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="285" r="14" fill="#17212b"/><text x="66" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="290">장거리 경로 요청</tspan></text><text x="274" y="330" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="336" fill="#52606d" font-size="12"><tspan x="58" y="352">최단거리보다 오래 달릴</tspan><tspan x="58" y="368">도로와 설명 가능한 주행을</tspan><tspan x="58" y="384">요청한다.</tspan></text></g><g data-node="route-core"><rect x="332" y="258" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="285" r="14" fill="#17212b"/><text x="358" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="382" y="290">경로 계산</tspan></text><text x="566" y="330" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="350" y="336" fill="#52606d" font-size="12"><tspan x="350" y="352">경로 provider에서 받은 기본</tspan><tspan x="350" y="368">경로를 주행 가능한 구간</tspan><tspan x="350" y="384">구조로 만든다.</tspan></text></g><g data-node="road-enrichment"><rect x="624" y="258" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="285" r="14" fill="#17212b"/><text x="650" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="674" y="290">도로 부가정보</tspan></text><text x="858" y="330" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="336" fill="#52606d" font-size="12"><tspan x="642" y="352">차선·속도·단속 등 신뢰</tspan><tspan x="642" y="368">기준을 통과한 정보를 경로에</tspan><tspan x="642" y="384">덧붙인다.</tspan></text></g><g data-node="map-driving-ui"><rect x="916" y="258" width="250" height="148" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="285" r="14" fill="#17212b"/><text x="942" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="966" y="290">지도·주행 화면</tspan></text><text x="1150" y="330" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="934" y="336" fill="#52606d" font-size="12"><tspan x="934" y="352">heading-up 지도와 Road</tspan><tspan x="934" y="368">Master 상태로 현재 경로와</tspan><tspan x="934" y="384">진입 방향을 보여 준다.</tspan></text></g><g data-node="drive-record"><rect x="1208" y="258" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="285" r="14" fill="#17212b"/><text x="1234" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="1258" y="290">실제 주행 기록</tspan></text><text x="1442" y="330" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1226" y="336" fill="#52606d" font-size="12"><tspan x="1226" y="352">실제 차량 좌표와</tspan><tspan x="1226" y="368">simulation을 구분해 주행</tspan><tspan x="1226" y="384">결과를 저장한다.</tspan></text></g></svg>
