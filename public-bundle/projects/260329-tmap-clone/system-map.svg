<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 2108" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">오래 달리고 싶은 도로를 고르는 웹 내비게이션: 구조와 결정 흐름</title><desc id="system-map-desc">최단 경로 복제보다 설명 가능한 장거리 주행, 실제 위치를 놓치지 않는 heading-up 카메라, 검증된 데이터만 표시하는 Road Master 경험을 반복 수정한 웹 내비게이션 기록이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="2108" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">오래 달리고 싶은 도로를 고르는 웹 내비게이션: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">최단 경로 복제보다 설명 가능한 장거리 주행, 실제 위치를 놓치지 않는</tspan><tspan x="80" y="108">heading-up 카메라, 검증된 데이터만 표시하는 Road Master</tspan><tspan x="80" y="130">경험을 반복 수정한 웹 내비게이션 기록이다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#syste