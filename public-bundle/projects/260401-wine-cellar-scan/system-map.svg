<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">라벨 후보를 확인해 남기는 와인 장부: 구조와 결정 흐름</title><desc id="system-map-desc">OCR 결과를 자동 확정하지 않고 사용자가 후보를 검토한 뒤 개인 시음 기록으로 저장하며, 복원할 근거가 없는 기존 오매칭은 추정 수정하지 않은 v1의 선택을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">라벨 후보를 확인해 남기는 와인 장부: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">OCR 결과를 자동 확정하지 않고 사용자가 후보를 검토한 뒤 개인 시음</tspan><tspan x="80" y="108">기록으로 저장하며, 복원할 근거가 없는 기존 오매칭은 추정 수정하지 않은</tspan><tspan x="80" y="130">v1의 선택을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1090" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1248" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">인식보다 확인을 중심에 둔 v1</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">와인 라벨은 서체, 반사와 배경 때문에 한 번의 OCR 결과를 제품 사실로 쓰기 어렵다. 이 프로젝트는 사진에서 와인을 자동 등록하는 제품보다 후보를 만들고 사용자가 확인한 뒤 개인...</text></g><g data-node="confirmation-flow"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">OCR 후보를 자동 확정하지 않기</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">스캔 결과는 후보 목록으로만 취급하고 사용자가 와인을 확인한 뒤 저장한다. 정확도가 높아 보이는 첫 결과를 곧바로 장부에 넣는 대안은 이름이 비슷한 와인을 같은 항목으로 합칠 위험이...</text></g><g data-node="local-ledger-scope"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">개인 JSON 장부로 범위 제한</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">개인 기록은 로컬 JSON에 저장한다. 계정, 다중 사용자와 기기 동기화를 먼저 만들지 않아 후보 확인과 저장, 조회와 삭제를 작은 구조에서 검증했다. 대신 동시 쓰기, 백업과 장기...</text></g><g data-node="personal-positioning"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">전문 재고보다 시음과 재구매 기록</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">장기 제품 방향은 전문 수집가의 재고 평가보다 개인 사용자의 시음과 재구매 기록에 뒀다. 몇 병이 남았는지보다 어떤 와인을 몇 번 마셨고 다시 선택할지에 집중한다.</text></g><g data-node="grouped-cellar-book"><rect x="80" y="820" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">저장 행을 와인 카드로 묶기</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="882" fill="#52606d" font-size="12">Cellar Book은 저장 건마다 카드를 만들지 않고 wine ID별로 기록을 묶는다. 같은 와인을 여러 번 저장했다면 카드에는 실제 저장 횟수를 Times로 표시한다. 서로 다른...</text></g><g data-node="preserve-uncertain-history"><rect x="80" y="978" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">복원 근거가 없는 기존 기록 보존</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1040" fill="#52606d" font-size="12">운영 기록에는 7번의 저장이 있지만 고유 wine ID는 3개뿐이었다. OCR 오매칭으로 서로 다른 와인이 같은 ID에 묶였을 가능성이 있어도 원본 라벨과 교정 이력이 없으면 어느...</text></g><g data-node="implementation-flow"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">스캔에서 장부 카드까지</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">Node 서버가 simulation과 live OCR 경로, 후보, 기록 CRUD와 정적 화면을 제공한다. 사용자가 후보를 확정하면 JSON 장부에 저장되고 프런트는 wine ID별...</text></g><g data-node="validation"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">API 흐름과 현재 화면의 검증 경계</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">과거 검증 harness에는 서버 시작, 메타 조회, simulation scan, 기록 생성, 조회와 삭제를 실제 API로 통과한 결과가 있다. 당시 원격 상태에서 7개 기록과 3...</text></g><g data-node="limitations"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">오매칭 이후 복구의 한계</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">서로 다른 와인이 같은 ID로 저장되면 카드 묶음과 횟수가 함께 왜곡된다. 원본 라벨, OCR 후보와 사용자의 교정 이력을 남기지 않은 기존 기록은 사후 복원이 어렵다. 현재 보존...</text></g></svg>
