<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1228" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">라벨 이미지에서 와인 장부까지</title><desc id="system-map-desc">OCR 후보를 자동 확정하지 않고 사용자의 확인을 거쳐 개인 장부 카드로 저장한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1228" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">라벨 이미지에서 와인 장부까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">OCR 후보를 자동 확정하지 않고 사용자의 확인을 거쳐 개인 장부 카드로</tspan><tspan x="40" y="108">저장한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 334 C 620 372, 620 372, 620 410" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="358" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="374" text-anchor="middle" fill="#52606d" font-size="11">후보 추출</text></g><g data-flow="flow-02"><path d="M 620 544 C 620 582, 620 582, 620 620" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="568" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="584" text-anchor="middle" fill="#52606d" font-size="11">확인 요청</text></g><g data-flow="flow-03"><path d="M 620 754 C 620 792, 620 792, 620 830" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="778" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="794" text-anchor="middle" fill="#52606d" font-size="11">확정 저장</text></g><g data-flow="flow-04"><path d="M 620 964 C 620 1002, 620 1002, 620 1040" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="988" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1004" text-anchor="middle" fill="#52606d" font-size="11">카드 표시</text></g><g data-node="label-image"><rect x="495.0" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700">라벨 이미지</text><text x="729.0" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="288">사용자가 촬영하거나 올린 와인 라벨 사진이다.</tspan></text></g><g data-node="ocr-candidates"><rect x="495.0" y="418" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="445" r="14" fill="#17212b"/><text x="521.0" y="450" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="450" fill="#17212b" font-size="16" font-weight="700">OCR 후보</text><text x="729.0" y="473" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="496" fill="#52606d" font-size="12"><tspan x="513.0" y="498">이미지에서 읽힌 이름과 빈티지 후보를 여러 값으로 제공한다.</tspan></text></g><g data-node="user-confirmation"><rect x="495.0" y="628" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="655" r="14" fill="#17212b"/><text x="521.0" y="660" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="660" fill="#17212b" font-size="16" font-weight="700">사용자 확인</text><text x="729.0" y="683" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="706" fill="#52606d" font-size="12"><tspan x="513.0" y="708">인식 결과를 그대로 확정하지 않고 사용자가 올바른 항목을</tspan><tspan x="513.0" y="724">고른다.</tspan></text></g><g data-node="cellar-record"><rect x="495.0" y="838" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="865" r="14" fill="#17212b"/><text x="521.0" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="870" fill="#17212b" font-size="16" font-weight="700">개인 장부</text><text x="729.0" y="893" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="916" fill="#52606d" font-size="12"><tspan x="513.0" y="918">확정된 와인과 시음·재구매 메모를 개인 JSON으로</tspan><tspan x="513.0" y="934">보존한다.</tspan></text></g><g data-node="wine-card"><rect x="495.0" y="1048" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1075" r="14" fill="#17212b"/><text x="521.0" y="1080" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1080" fill="#17212b" font-size="16" font-weight="700">와인 카드</text><text x="729.0" y="1103" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1126" fill="#52606d" font-size="12"><tspan x="513.0" y="1128">저장된 행을 다시 읽기 쉬운 카드와 목록으로 보여 준다.</tspan></text></g></svg>
