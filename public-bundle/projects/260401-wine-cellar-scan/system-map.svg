<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1338" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">라벨 이미지에서 와인 장부까지</title><desc id="system-map-desc">OCR 후보를 자동 확정하지 않고 사용자의 확인을 거쳐 개인 장부 카드로 저장한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1338" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">라벨 이미지에서 와인 장부까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">OCR 후보를 자동 확정하지 않고 사용자의</tspan><tspan x="40" y="108">확인을 거쳐 개인 장부 카드로 저장한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 356 C 620 394, 620 394, 620 432" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="380" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="396" text-anchor="middle" fill="#52606d" font-size="11">후보 추출</text></g><g data-flow="flow-02"><path d="M 620 588 C 620 626, 620 626, 620 664" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="612" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="628" text-anchor="middle" fill="#52606d" font-size="11">확인 요청</text></g><g data-flow="flow-03"><path d="M 620 820 C 620 858, 620 858, 620 896" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="844" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="860" text-anchor="middle" fill="#52606d" font-size="11">확정 저장</text></g><g data-flow="flow-04"><path d="M 620 1052 C 620 1090, 620 1090, 620 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="1076" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1092" text-anchor="middle" fill="#52606d" font-size="11">카드 표시</text></g><g data-node="label-image"><rect x="495.0" y="208" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="240">라벨 이미지</tspan></text><text x="729.0" y="280" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="302">사용자가 촬영하거나 올린</tspan><tspan x="513.0" y="318">와인 라벨 사진이다.</tspan></text></g><g data-node="ocr-candidates"><rect x="495.0" y="440" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="467" r="14" fill="#17212b"/><text x="521.0" y="472" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="472" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="472">OCR 후보</tspan></text><text x="729.0" y="512" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="518" fill="#52606d" font-size="12"><tspan x="513.0" y="534">이미지에서 읽힌 이름과</tspan><tspan x="513.0" y="550">빈티지 후보를 여러 값으로</tspan><tspan x="513.0" y="566">제공한다.</tspan></text></g><g data-node="user-confirmation"><rect x="495.0" y="672" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="699" r="14" fill="#17212b"/><text x="521.0" y="704" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="704" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="704">사용자 확인</tspan></text><text x="729.0" y="744" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="750" fill="#52606d" font-size="12"><tspan x="513.0" y="766">인식 결과를 그대로 확정하지</tspan><tspan x="513.0" y="782">않고 사용자가 올바른 항목을</tspan><tspan x="513.0" y="798">고른다.</tspan></text></g><g data-node="cellar-record"><rect x="495.0" y="904" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="931" r="14" fill="#17212b"/><text x="521.0" y="936" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="936" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="936">개인 장부</tspan></text><text x="729.0" y="976" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="982" fill="#52606d" font-size="12"><tspan x="513.0" y="998">확정된 와인과 시음·재구매</tspan><tspan x="513.0" y="1014">메모를 개인 JSON으로</tspan><tspan x="513.0" y="1030">보존한다.</tspan></text></g><g data-node="wine-card"><rect x="495.0" y="1136" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1163" r="14" fill="#17212b"/><text x="521.0" y="1168" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1168" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1168">와인 카드</tspan></text><text x="729.0" y="1208" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1214" fill="#52606d" font-size="12"><tspan x="513.0" y="1230">저장된 행을 다시 읽기 쉬운</tspan><tspan x="513.0" y="1246">카드와 목록으로 보여 준다.</tspan></text></g></svg>
