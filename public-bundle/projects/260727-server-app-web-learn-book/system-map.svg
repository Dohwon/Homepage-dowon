<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 618" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">원고에서 검색 가능한 학습서까지</title><desc id="system-map-desc">Markdown 원고와 glossary를 정본으로 삼아 PM 질문 중심의 정적 HTML과 검색 색인을 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="618" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">원고에서 검색 가능한 학습서까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">Markdown 원고와 glossary를 정본으로 삼아 PM 질문 중심의</tspan><tspan x="40" y="108">정적 HTML과 검색 색인을 만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 271 C 290 299, 358 243, 358 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="273" text-anchor="middle" fill="#52606d" font-size="11">원고 구성</text></g><g data-flow="flow-02"><path d="M 608 271 C 608 299, 676 243, 676 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="602.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="273" text-anchor="middle" fill="#52606d" font-size="11">용어 추출</text></g><g data-flow="flow-03"><path d="M 483 334 C 483 382, 165 382, 165 430" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="273.5" y="368" width="101" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="384" text-anchor="middle" fill="#52606d" font-size="11">HTML 변환</text></g><g data-flow="flow-04"><path d="M 676 271 C 676 386, 290 386, 290 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="427" y="372" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="388" text-anchor="middle" fill="#52606d" font-size="11">검색 index</text></g><g data-flow="flow-05"><path d="M 290 501 C 290 529, 358 473, 358 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="288" y="487" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="503" text-anchor="middle" fill="#52606d" font-size="11">출판</text></g><g data-node="pm-question"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">PM 질문</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">구현 단계보다 의사결정 맥락을 알고 싶은 질문에서 학습</tspan><tspan x="58" y="304">단위를 시작한다.</tspan></text></g><g data-node="markdown-source"><rect x="358" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="235" r="14" fill="#17212b"/><text x="384" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="240" fill="#17212b" font-size="16" font-weight="700">Markdown 원고</text><text x="592" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="376" y="286" fill="#52606d" font-size="12"><tspan x="376" y="288">10권 구조와 실제 관찰을 담는 출판 정본이다.</tspan></text></g><g data-node="glossary"><rect x="676" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="235" r="14" fill="#17212b"/><text x="702" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="240" fill="#17212b" font-size="16" font-weight="700">용어집</text><text x="910" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="694" y="286" fill="#52606d" font-size="12"><tspan x="694" y="288">본문과 분리된 정의와 검색어를 관리한다.</tspan></text></g><g data-node="html-builder"><rect x="40" y="438" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="465" r="14" fill="#17212b"/><text x="66" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="470" fill="#17212b" font-size="16" font-weight="700">정적 HTML 생성</text><text x="274" y="493" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="58" y="516" fill="#52606d" font-size="12"><tspan x="58" y="518">원고를 브라우저에서 읽는 문서와 검색 index로 변환한다.</tspan></text></g><g data-node="learning-site"><rect x="358" y="438" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="465" r="14" fill="#17212b"/><text x="384" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="470" fill="#17212b" font-size="16" font-weight="700">학습서 웹</text><text x="592" y="493" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="516" fill="#52606d" font-size="12"><tspan x="376" y="518">기술 정의와 의사결정 맥락을 연결해 탐색할 수 있는</tspan><tspan x="376" y="534">결과물이다.</tspan></text></g></svg>
