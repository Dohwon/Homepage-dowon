<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">비개발 PM을 위한 서비스 기술 학습서 설계: 구조와 결정 흐름</title><desc id="system-map-desc">용어 암기 대신 화면·API·서버·운영의 경계를 따라 판단하도록 10권 커리큘럼과 Markdown 기반 정적 출판·검색 구조를 만든 과정과 아직 채워야 할 본문 범위를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">비개발 PM을 위한 서비스 기술 학습서 설계: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">용어 암기 대신 화면·API·서버·운영의 경계를 따라 판단하도록 10권</tspan><tspan x="80" y="108">커리큘럼과 Markdown 기반 정적 출판·검색 구조를 만든 과정과 아직</tspan><tspan x="80" y="130">채워야 할 본문 범위를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1248" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1406" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="why-first-structure"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">기술 정의보다 의사결정 맥락을 먼저 설명</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="250" fill="#52606d" font-size="12">각 장은 현실 상황과 문제, 비유, 기술 흐름, 실제 서비스, 장애 단서, 회의 질문을 하나의 학습 단위로 묶는다. 독자가 용어 정의를 외운 뒤 적용법을 찾는 대신, 어떤 문제가 기...</text></g><g data-node="ten-volume-boundary"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">시스템 경계를 따라 10권으로 확장</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">커리큘럼은 인터넷·웹·앱·서버 연결에서 시작해 모바일 통신, 서버와 클라우드, AI·RAG·Agent, 트러블슈팅, 브라우저, 비동기·실시간, API·인증·보안, IoT·OTA, 관...</text></g><g data-node="separate-goal-progress"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">3,000쪽 목표와 현재 원고를 분리</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">제작 계획은 약 3,000쪽의 8~10권 시리즈를 목표로 잡았지만 현재 원고가 완성 책이 아니라고 명시한다. 권별 파일이 모두 존재한다는 사실을 전권이 출판 분량으로 완성됐다는 주장...</text></g><g data-node="markdown-canonical-source"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">Markdown을 원본으로 정적 HTML 생성</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="724" fill="#52606d" font-size="12">원고의 정본은 `book/` 아래 Markdown으로 두고 Python build가 목차, 이전·다음 이동과 navigation을 포함한 정적 HTML을 생성한다. 웹에서 직접 본문...</text></g><g data-node="two-stage-search"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">glossary와 본문을 분리한 검색</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">검색은 용어 정의와 책 본문을 같은 결과 목록에 섞지 않는다. glossary term과 alias, 짧은 정의, 생긴 이유를 먼저 점수화하고, 별도 영역에서 제목·소제목·본문을 검...</text></g><g data-node="separate-observation-proposal"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">실제 관찰과 미래 architecture 후보를 구분</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">실무 사례는 현재 앱에서 확인한 동작과 향후 도입할 수 있는 cloud·streaming architecture를 같은 사실처럼 쓰지 않는다. 관찰된 요청·응답과 운영 경계를 먼저...</text></g><g data-node="decision-centered-lessons"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">구현 단계보다 PM 질문을 학습 단위로 선택</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">같은 기술도 도입 여부보다 누가 권한을 발급하고, 어디에서 retry하며, 실패를 어떤 지표로 관측하는지가 제품 결과를 바꾼다. 각 장에는 “앱이 직접 권한을 갖는가”, “backe...</text></g><g data-node="implementation-flow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">원고에서 웹 문서와 검색 index까지</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">`build_book_pages.py`는 고정된 Markdown 목록을 순회해 HTML을 만들고 각 페이지의 목차와 이전·다음 링크를 구성한다. `build_search_index....</text></g><g data-node="verified-assets"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">확인된 출판 자산</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">10권의 Markdown 파일과 roadmap, 제작 계획, glossary, 실무 사례가 존재하며, 대응하는 정적 HTML과 검색 index도 남아 있다. 생성 파일은 원고보다 늦...</text></g><g data-node="current-status"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">출판 골격과 미완성 본문의 경계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1672" fill="#52606d" font-size="12">현재 결과는 10권 완간이 아니라 PM이 시스템 경계를 따라 배울 수 있는 커리큘럼, 원고 정본과 정적 출판·검색 파이프라인이다. 특히 why-first 장 구조와 1권의 연결 서사...</text></g></svg>
