<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">원고에서 검색 가능한 학습서까지</title><desc id="system-map-desc">Markdown 원고와 glossary를 정본으로 삼아 PM 질문 중심의 정적 HTML과 검색 색인을 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="684" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">원고에서 검색 가능한 학습서까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">Markdown 원고와 glossary를 정본으로 삼아</tspan><tspan x="40" y="108">PM 질문 중심의 정적 HTML과 검색 색인을</tspan><tspan x="40" y="130">만든다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 304 C 290 332, 358 276, 358 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="306" text-anchor="middle" fill="#52606d" font-size="11">원고 구성</text></g><g data-flow="flow-02"><path d="M 608 304 C 608 332, 676 276, 676 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="603" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="306" text-anchor="middle" fill="#52606d" font-size="11">용어 추출</text></g><g data-flow="flow-03"><path d="M 483 378 C 483 426, 165 426, 165 474" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="412" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="428" text-anchor="middle" fill="#52606d" font-size="11">HTML 변환</text></g><g data-flow="flow-04"><path d="M 676 304 C 676 430, 290 430, 290 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="441" y="416" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="432" text-anchor="middle" fill="#52606d" font-size="11">검색 index</text></g><g data-flow="flow-05"><path d="M 290 556 C 290 584, 358 528, 358 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="288" y="542" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="558" text-anchor="middle" fill="#52606d" font-size="11">출판</text></g><g data-node="pm-question"><rect x="40" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">PM 질문</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">구현 단계보다 의사결정</tspan><tspan x="58" y="340">맥락을 알고 싶은 질문에서</tspan><tspan x="58" y="356">학습 단위를 시작한다.</tspan></text></g><g data-node="markdown-source"><rect x="358" y="230" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="257" r="14" fill="#17212b"/><text x="384" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="262">Markdown 원고</tspan></text><text x="592" y="302" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="376" y="308" fill="#52606d" font-size="12"><tspan x="376" y="324">10권 구조와 실제 관찰을 담는</tspan><tspan x="376" y="340">출판 정본이다.</tspan></text></g><g data-node="glossary"><rect x="676" y="230" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="257" r="14" fill="#17212b"/><text x="702" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="726" y="262">용어집</tspan></text><text x="910" y="302" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="694" y="308" fill="#52606d" font-size="12"><tspan x="694" y="324">본문과 분리된 정의와</tspan><tspan x="694" y="340">검색어를 관리한다.</tspan></text></g><g data-node="html-builder"><rect x="40" y="482" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="509" r="14" fill="#17212b"/><text x="66" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="514">정적 HTML 생성</tspan></text><text x="274" y="554" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="58" y="560" fill="#52606d" font-size="12"><tspan x="58" y="576">원고를 브라우저에서 읽는</tspan><tspan x="58" y="592">문서와 검색 index로</tspan><tspan x="58" y="608">변환한다.</tspan></text></g><g data-node="learning-site"><rect x="358" y="482" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="509" r="14" fill="#17212b"/><text x="384" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="514">학습서 웹</tspan></text><text x="592" y="554" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="560" fill="#52606d" font-size="12"><tspan x="376" y="576">기술 정의와 의사결정 맥락을</tspan><tspan x="376" y="592">연결해 탐색할 수 있는</tspan><tspan x="376" y="608">결과물이다.</tspan></text></g></svg>
