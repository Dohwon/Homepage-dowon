<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 572" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">제품 정의에서 검증 가능한 테스트셋까지</title><desc id="system-map-desc">제품 문서의 slot·alias·dependency와 route 경계를 조합해 positive·negative·command 테스트셋을 생성한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1546" height="572" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">제품 정의에서 검증 가능한 테스트셋까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">제품 문서의 slot·alias·dependency와</tspan><tspan x="40" y="108">route 경계를 조합해</tspan><tspan x="40" y="130">positive·negative·command 테스트셋을</tspan><tspan x="40" y="152">생성한다.</tspan></text><rect x="40" y="200" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="215" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="flow-01"><path d="M 290 326 C 290 385, 344 385, 344 444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="278" y="371" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="387" text-anchor="middle" fill="#52606d" font-size="11">규칙 추출</text></g><g data-flow="flow-02"><path d="M 594 444 C 594 503, 648 267, 648 326" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="582" y="371" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="387" text-anchor="middle" fill="#52606d" font-size="11">조합 생성</text></g><g data-flow="flow-03"><path d="M 898 326 C 898 385, 952 385, 952 444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="889" y="371" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="387" text-anchor="middle" fill="#52606d" font-size="11">셋 분리</text></g><g data-flow="flow-04"><path d="M 1202 444 C 1202 503, 1256 267, 1256 326" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1178" y="371" width="102" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="387" text-anchor="middle" fill="#52606d" font-size="11">커버리지 확인</text></g><g data-node="product-spec"><rect x="40" y="252" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="279" r="14" fill="#17212b"/><text x="66" y="284" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="284" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="284">제품 명세</tspan></text><text x="274" y="324" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="330" fill="#52606d" font-size="12"><tspan x="58" y="346">기능, slot과 지원 범위를</tspan><tspan x="58" y="362">정의한 원천 문서다.</tspan></text></g><g data-node="coverage-model"><rect x="344" y="370" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="397" r="14" fill="#17212b"/><text x="370" y="402" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="402" fill="#17212b" font-size="16" font-weight="700"><tspan x="394" y="402">상태·의존성 모델</tspan></text><text x="578" y="442" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362" y="448" fill="#52606d" font-size="12"><tspan x="362" y="464">slot 상태와</tspan><tspan x="362" y="480">alias·dependency를 별도</tspan><tspan x="362" y="496">규칙으로 정리한다.</tspan></text></g><g data-node="case-generator"><rect x="648" y="252" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="279" r="14" fill="#17212b"/><text x="674" y="284" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="284" fill="#17212b" font-size="16" font-weight="700"><tspan x="698" y="284">테스트 생성기</tspan></text><text x="882" y="324" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="666" y="330" fill="#52606d" font-size="12"><tspan x="666" y="346">조건 조합 하나를 한 행으로</tspan><tspan x="666" y="362">유지하며 schedule matrix를</tspan><tspan x="666" y="378">생성한다.</tspan></text></g><g data-node="route-datasets"><rect x="952" y="370" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="397" r="14" fill="#17212b"/><text x="978" y="402" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="402" fill="#17212b" font-size="16" font-weight="700"><tspan x="1002" y="402">세 종류 테스트셋</tspan></text><text x="1186" y="442" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="970" y="448" fill="#52606d" font-size="12"><tspan x="970" y="464">positive는 source span,</tspan><tspan x="970" y="480">negative는 경계, command는</tspan><tspan x="970" y="496">action family를 보존한다.</tspan></text></g><g data-node="coverage-gate"><rect x="1256" y="252" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="279" r="14" fill="#17212b"/><text x="1282" y="284" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="284" fill="#17212b" font-size="16" font-weight="700"><tspan x="1306" y="284">커버리지 gate</tspan></text><text x="1490" y="324" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="1274" y="330" fill="#52606d" font-size="12"><tspan x="1274" y="346">생성 통과와 실제 command</tspan><tspan x="1274" y="362">coverage를 구분해 다음</tspan><tspan x="1274" y="378">작업을 판단한다.</tspan></text></g></svg>
