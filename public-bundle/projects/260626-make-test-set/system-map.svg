 font-weight="700">negative는 route별 경계를 설계</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">unsupported, 일반 대화, 외부 지식과 공격·민감 경계를 route quota로 나누고 중복, 길이와 금지...</text></g><g data-node="command-family"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">command는 action family를 먼저 본다</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1356" fill="#52606d" font-size="12">표면 동사가 비슷하더라도 이동, 복귀, 상태 조회와 설정 변경에는 서로 다른 표현 제약이 필요하다. action fa...</text></g><g data-node="command-gap"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">command coverage 157/176</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1514" fill="#52606d" font-size="12">초기 범위는 73개에서 157개로 넓어졌지만 후속 검토에서 수행 불가 항목만 제외한 대표 기준은 약 176개로 정정됐...</text></g><g data-node="archive-and-rollback"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">이전 형식을 archive로 보존</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size=