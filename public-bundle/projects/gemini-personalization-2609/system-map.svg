<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 584" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">개인화 입력에서 검증 가능한 평가 결과까지</title><desc id="system-map-desc">사례 입력을 로컬 응답 경로에 전달하고 검색과 답변을 기록한 뒤 별도 채점과 무결성 검증을 수행한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1850" height="584" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">개인화 입력에서 검증 가능한 평가</tspan><tspan x="40" y="86">결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="120">사례 입력을 로컬 응답 경로에 전달하고</tspan><tspan x="40" y="142">검색과 답변을 기록한 뒤 별도 채점과 무결성</tspan><tspan x="40" y="164">검증을 수행한다.</tspan></text><rect x="40" y="212" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="227" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="a"><path d="M 290 338 C 290 397, 344 397, 344 456" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="278" y="383" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="399" text-anchor="middle" fill="#52606d" font-size="11">사례 전달</text></g><g data-flow="b"><path d="M 594 456 C 594 515, 648 279, 648 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="561" y="383" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="399" text-anchor="middle" fill="#52606d" font-size="11">필요한 경우 검색</text></g><g data-flow="c"><path d="M 898 338 C 898 397, 952 397, 952 456" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="865" y="383" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="399" text-anchor="middle" fill="#52606d" font-size="11">근거와 실행 상태</text></g><g data-flow="d"><path d="M 594 456 C 594 484, 952 428, 952 456" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="719" y="442" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="773" y="458" text-anchor="middle" fill="#52606d" font-size="11">최종 답변 기록</text></g><g data-flow="e"><path d="M 1202 456 C 1202 515, 1256 279, 1256 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1169" y="383" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="399" text-anchor="middle" fill="#52606d" font-size="11">응답과 추적 전달</text></g><g data-flow="f"><path d="M 1506 338 C 1506 397, 1560 397, 1560 456" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1473" y="383" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1533" y="399" text-anchor="middle" fill="#52606d" font-size="11">판정과 원본 대조</text></g><g data-node="input"><rect x="40" y="264" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="291" r="14" fill="#17212b"/><text x="66" y="296" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="296" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="296">평가 사례</tspan></text><text x="274" y="336" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="342" fill="#52606d" font-size="12"><tspan x="58" y="358">발화와 선호 및 이전 대화와</tspan><tspan x="58" y="374">상황 조건을 제공한다.</tspan></text></g><g data-node="runner"><rect x="344" y="382" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="409" r="14" fill="#17212b"/><text x="370" y="414" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="414" fill="#17212b" font-size="16" font-weight="700"><tspan x="394" y="414">실행기</tspan></text><text x="578" y="454" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362" y="460" fill="#52606d" font-size="12"><tspan x="362" y="476">고정된 조건으로 입력을</tspan><tspan x="362" y="492">조립하고 응답 경로를</tspan><tspan x="362" y="508">호출한다.</tspan></text></g><g data-node="search"><rect x="648" y="264" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="291" r="14" fill="#17212b"/><text x="674" y="296" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="296" fill="#17212b" font-size="16" font-weight="700"><tspan x="698" y="296">검색 경로</tspan></text><text x="882" y="336" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="666" y="342" fill="#52606d" font-size="12"><tspan x="666" y="358">필요한 사례에서 검색 근거와</tspan><tspan x="666" y="374">실행 상태를 반환한다.</tspan></text></g><g data-node="answer"><rect x="952" y="382" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="409" r="14" fill="#17212b"/><text x="978" y="414" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="414" fill="#17212b" font-size="16" font-weight="700"><tspan x="1002" y="414">답변과 추적</tspan></text><text x="1186" y="454" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="970" y="460" fill="#52606d" font-size="12"><tspan x="970" y="476">사례별 응답과 검색 상태 및</tspan><tspan x="970" y="492">오류를 보존한다.</tspan></text></g><g data-node="judge"><rect x="1256" y="264" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="291" r="14" fill="#17212b"/><text x="1282" y="296" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="296" fill="#17212b" font-size="16" font-weight="700"><tspan x="1306" y="296">채점기</tspan></text><text x="1490" y="336" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="1274" y="342" fill="#52606d" font-size="12"><tspan x="1274" y="358">응답 품질을 평가하고 실행</tspan><tspan x="1274" y="374">실패와 구별한다.</tspan></text></g><g data-node="audit"><rect x="1560" y="382" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1586" cy="409" r="14" fill="#17212b"/><text x="1586" y="414" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="1610" y="414" fill="#17212b" font-size="16" font-weight="700"><tspan x="1610" y="414">결과 검증</tspan></text><text x="1794" y="454" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1578" y="460" fill="#52606d" font-size="12"><tspan x="1578" y="476">사례 건수와 해시 및 결과표를</tspan><tspan x="1578" y="492">대조한다.</tspan></text></g></svg>
