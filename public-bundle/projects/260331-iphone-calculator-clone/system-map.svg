<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 605.0" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">버튼 입력에서 계산 화면까지</title><desc id="system-map-desc">DOM 화면과 계산 상태를 분리하고 입력 상태에 따라 버튼 표시와 계산 결과를 전이시킨다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="605.0" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">버튼 입력에서 계산 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">DOM 화면과 계산 상태를 분리하고 입력 상태에 따라 버튼 표시와 계산</tspan><tspan x="40" y="108">결과를 전이시킨다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 228 C 674 228, 976 358, 1030 358" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="785.5" y="279" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="825" y="295" text-anchor="middle" fill="#52606d" font-size="11">상태 전이</text></g><g data-flow="flow-02"><path d="M 1030 358 C 976 358, 674 488, 620 488" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="785.5" y="409" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="825" y="425" text-anchor="middle" fill="#52606d" font-size="11">버튼 상태</text></g><g data-flow="flow-03"><path d="M 1030 358 C 976 358, 264 358, 210 358" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="344" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="360" text-anchor="middle" fill="#52606d" font-size="11">결과 렌더링</text></g><g data-node="key-input"><rect x="495.0" y="165.0" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="192.0" r="14" fill="#17212b"/><text x="521.0" y="197.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="197.0" fill="#17212b" font-size="16" font-weight="700">숫자·연산자 입력</text><text x="729.0" y="220.0" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="243.0" fill="#52606d" font-size="12"><tspan x="513.0" y="245.0">사용자가 숫자, 연산자, 소수점과 equals를 누른다.</tspan></text></g><g data-node="calculator-state"><rect x="905.0" y="295.0" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="931.0" cy="322.0" r="14" fill="#17212b"/><text x="931.0" y="327.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="955.0" y="327.0" fill="#17212b" font-size="16" font-weight="700">계산 상태</text><text x="1139.0" y="350.0" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="923.0" y="373.0" fill="#52606d" font-size="12"><tspan x="923.0" y="375.0">현재 피연산자·연산자·결과·반복 equals를 DOM과</tspan><tspan x="923.0" y="391.0">독립적으로 보존한다.</tspan></text></g><g data-node="button-mode"><rect x="495.0" y="425.0" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="452.0" r="14" fill="#17212b"/><text x="521.0" y="457.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="457.0" fill="#17212b" font-size="16" font-weight="700">AC·C 상태</text><text x="729.0" y="480.0" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="513.0" y="503.0" fill="#52606d" font-size="12"><tspan x="513.0" y="505.0">계산 상태에 맞춰 지우기 버튼과 연산자 교체 동작을 바꾼다.</tspan></text></g><g data-node="display-result"><rect x="85.0" y="295.0" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="111.0" cy="322.0" r="14" fill="#17212b"/><text x="111.0" y="327.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="135.0" y="327.0" fill="#17212b" font-size="16" font-weight="700">계산기 화면</text><text x="319.0" y="350.0" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="103.0" y="373.0" fill="#52606d" font-size="12"><tspan x="103.0" y="375.0">세로 4칙연산 UI에 상태와 결과를 안정적으로 표시한다.</tspan></text></g></svg>
