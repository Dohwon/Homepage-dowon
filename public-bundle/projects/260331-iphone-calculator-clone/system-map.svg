<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1476" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">계산 상태를 분리한 iPhone 계산기 클론: 구조와 결정 흐름</title><desc id="system-map-desc">iPhone 기본 계산기의 세로 4칙연산 흐름을 작은 상태 엔진으로 분리하고 AC와 C, 연산자 교체와 반복 계산을 테스트한 정적 상호작용 프로토타입을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1476" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">계산 상태를 분리한 iPhone 계산기 클론: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">iPhone 기본 계산기의 세로 4칙연산 흐름을 작은 상태 엔진으로 분리하고</tspan><tspan x="80" y="108">AC와 C, 연산자 교체와 반복 계산을 테스트한 정적 상호작용 프로토타입을</tspan><tspan x="80" y="130">정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="932" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1090" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">일반 계산기가 아닌 상호작용 클론</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="250" fill="#52606d" font-size="12">목표는 기능이 많은 계산기를 만드는 것이 아니라 iPhone 기본 계산기의 세로 화면과 핵심 4칙연산 상호작용을 웹에...</text></g><g data-node="engine-state"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">계산 엔진을 DOM에서 분리</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">표시 문자열과 버튼 class 안에 계산 규칙을 흩어 놓지 않고 엔진 객체가 현재 표시값, 대기 중 연산, 새 입력...</text></g><g data-node="clear-state"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">입력 상태에 따른 AC와 C 전환</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">초기 상태와 계산 전체를 지워야 할 때는 AC를, 현재 입력만 지울 수 있을 때는 C를 보여 준다. 두 동작을 하나의...</text></g><g data-node="operator-behavior"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">연산자 교체와 반복 equals</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="724" fill="#52606d" font-size="12">숫자 없이 연산자를 연속해서 누르면 계산을 실행하지 않고 마지막 연산자로 교체한다. equals를 다시 누르면 직전...</text></g><g data-node="interface-contract"><rect x="80" y="820" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">세로 4칙연산 화면 유지</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="882" fill="#52606d" font-size="12">0 버튼은 두 칸을 차지하고 선택된 연산자는 active 상태를 보인다. 긴 표시값은 버튼이나 화면 폭을 밀어내지 않...</text></g><g data-node="implementation-flow"><rect x="80" y="978" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">정적 UI와 상태 엔진 연결</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1040" fill="#52606d" font-size="12">정적 HTML과 CSS가 display와 keypad를 만들고 브라우저 스크립트가 버튼 이벤트를 독립 calculat...</text></g><g data-node="validation"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">상태 전이 12개 테스트</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">현재 코드에서 덧셈, 뺄셈, 곱셈, 나눗셈, 소수, 부호, percent, 연산자 교체, 반복 equals, 0 나누...</text></g><g data-node="limitations"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">시각과 실제 기기 검증의 공백</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1356" fill="#52606d" font-size="12">실제 iPhone viewport와 safe area, 글꼴, 색과 간격 비교가 없다. 모바일 Safari, 회전,...</text></g></svg>
