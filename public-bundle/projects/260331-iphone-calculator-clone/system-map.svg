<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">버튼 입력에서 계산 화면까지</title><desc id="system-map-desc">DOM 화면과 계산 상태를 분리하고 입력 상태에 따라 버튼 표시와 계산 결과를 전이시킨다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="420" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">버튼 입력에서 계산 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">DOM 화면과 계산 상태를 분리하고 입력 상태에 따라 버튼 표시와 계산</tspan><tspan x="40" y="108">결과를 전이시킨다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">state machine ui</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">상태 전이</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">버튼 상태</text></g><g data-flow="flow-03"><path d="M 582 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="704" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="273" text-anchor="middle" fill="#52606d" font-size="11">결과 렌더링</text></g><g data-node="key-input"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">숫자·연산자 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">사용자가 숫자, 연산자, 소수점과 equals를 누른다.</tspan></text></g><g data-node="calculator-state"><rect x="332" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">계산 상태</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">현재 피연산자·연산자·결과·반복 equals를 DOM과</tspan><tspan x="350" y="304">독립적으로 보존한다.</tspan></text></g><g data-node="button-mode"><rect x="624" y="208" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">AC·C 상태</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">계산 상태에 맞춰 지우기 버튼과 연산자 교체 동작을 바꾼다.</tspan></text></g><g data-node="display-result"><rect x="916" y="208" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">계산기 화면</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">세로 4칙연산 UI에 상태와 결과를 안정적으로 표시한다.</tspan></text></g></svg>
