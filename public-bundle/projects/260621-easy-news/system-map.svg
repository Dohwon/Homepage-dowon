<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1950" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">복잡한 뉴스를 짧게 이해하는 Easy News: 구조와 결정 흐름</title><desc id="system-map-desc">거대한 뉴스 그래프 대신 이슈별 인과 타임라인을 택하고, 재현 가능한 RSS 수집과 원자 스냅샷, stale 캐시 롤백을 거쳐 오늘의 뉴스를 보여 주는 구조를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1950" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">복잡한 뉴스를 짧게 이해하는 Easy News: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">거대한 뉴스 그래프 대신 이슈별 인과 타임라인을 택하고, 재현 가능한 RSS</tspan><tspan x="80" y="108">수집과 원자 스냅샷, stale 캐시 롤백을 거쳐 오늘의 뉴스를 보여 주는</tspan><tspan x="80" y="130">구조를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1406" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1564" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-10"><path d="M 560 1704 L 560 1760" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1722" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1739" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">세 분 안에 이슈 흐름 읽기</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">Easy News는 모든 기사를 모아 오래 탐색하게 만드는 뉴스 포털보다, 오늘 중요한 이슈가 왜 생겼고 무엇이 달라...</text></g><g data-node="issue-reading-model"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">거대 그래프 대신 이슈 타임라인</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">모든 기사와 관계를 한 화면의 네트워크로 펼치면 모바일에서 노드 수와 연결선을 해석하는 데 시간이 더 든다. 이 접근...</text></g><g data-node="save-and-watch"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">저장과 지켜보기의 의도 분리</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">다시 읽고 싶은 기사 묶음과 앞으로 변화를 알려 달라는 요청은 같은 북마크가 아니다. 저장은 보관 의도, 지켜보기는...</text></g><g data-node="staged-mvp"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">검토된 seed에서 실제 RSS로 단계 확장</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">첫 vertical slice는 운영자가 검토한 JSON seed와 localStorage watch로 만들었다. 수...</text></g><g data-node="atomic-snapshot"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">반쯤 갱신된 뉴스 노출 방지</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">수집 결과를 현재 파일에 곧바로 덮어쓰면 중간 실패 때 스키마 일부만 바뀐 상태를 앱이 읽을 수 있다. builder...</text></g><g data-node="stale-cache-rollback"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">정적 import와 cache-first 철회</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="1040" fill="#52606d" font-size="12">자동 갱신 파일이 바뀌어도 화면에는 오래된 날짜가 계속 보이는 장애가 있었다. 정적 import와 navigation...</text></g><g data-node="scheduler-runtime"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">서버 수명주기에 맞춘 갱신</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="1198" fill="#52606d" font-size="12">외부 cron에만 기대던 흐름을 서버 시작 시 1회 갱신, 매일 KST 09시 내부 scheduler, stale 요...</text></g><g data-node="mobile-quality"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">모바일 읽기와 접근성 기준</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1356" fill="#52606d" font-size="12">외부 링크는 HTTPS만 허용하고 날짜 계산은 KST로 통일했다. 주요 touch target은 48px을 기준으로...</text></g><g data-node="implementation-flow"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">수집에서 오늘 화면까지</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1514" fill="#52606d" font-size="12">Next.js app router가 Zod로 검증된 스냅샷을 요청 시 읽고 오늘, 이슈 상세와 내 뉴스 화면을 구성한...</text></g><g data-node="validation"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">과거 테스트와 현재 자원 한계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size="12">과거 최신 자동 갱신 변경은 16개 파일의 62개 테스트와 production build 통과를 보고한다. 그 이전...</text></g><g data-node="limitations"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">운영 뉴스 제품까지 남은 일</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1830" fill="#52606d" font-size="12">내부 scheduler는 상시 실행 서버가 필요하고 날짜별 원본과 history가 없다. 운영자 review UI,...</text></g></svg>
