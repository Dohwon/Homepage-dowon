<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1338" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">뉴스 원천에서 오늘 읽기 화면까지</title><desc id="system-map-desc">검토된 seed와 RSS를 수집해 이슈 타임라인과 원자적 snapshot으로 제공한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1338" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">뉴스 원천에서 오늘 읽기 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">검토된 seed와 RSS를 수집해 이슈 타임라인과</tspan><tspan x="40" y="108">원자적 snapshot으로 제공한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 356 C 620 394, 620 394, 620 432" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="578" y="380" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="396" text-anchor="middle" fill="#52606d" font-size="11">수집·정리</text></g><g data-flow="flow-02"><path d="M 620 588 C 620 626, 620 626, 620 664" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="572" y="612" width="96" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="628" text-anchor="middle" fill="#52606d" font-size="11">검토 후 발행</text></g><g data-flow="flow-03"><path d="M 620 820 C 620 858, 620 858, 620 896" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="844" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="860" text-anchor="middle" fill="#52606d" font-size="11">사용자 저장</text></g><g data-flow="flow-04"><path d="M 620 820 C 620 974, 620 974, 620 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="960" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="976" text-anchor="middle" fill="#52606d" font-size="11">오늘 화면</text></g><g data-node="news-sources"><rect x="495.0" y="208" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="240">뉴스 원천</tspan></text><text x="729.0" y="280" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="302">검토된 seed와 외부 RSS에서</tspan><tspan x="513.0" y="318">기사 후보를 받는다.</tspan></text></g><g data-node="issue-timeline"><rect x="495.0" y="440" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="467" r="14" fill="#17212b"/><text x="521.0" y="472" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="472" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="472">이슈 타임라인</tspan></text><text x="729.0" y="512" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="518" fill="#52606d" font-size="12"><tspan x="513.0" y="534">거대한 관계 그래프 대신 한</tspan><tspan x="513.0" y="550">이슈의 시간 흐름으로</tspan><tspan x="513.0" y="566">정리한다.</tspan></text></g><g data-node="reviewed-snapshot"><rect x="495.0" y="672" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="699" r="14" fill="#17212b"/><text x="521.0" y="704" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="704" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="704">검토된 snapshot</tspan></text><text x="729.0" y="744" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="750" fill="#52606d" font-size="12"><tspan x="513.0" y="766">반쯤 갱신된 결과가 공개되지</tspan><tspan x="513.0" y="782">않도록 한 번에 교체할 발행</tspan><tspan x="513.0" y="798">상태다.</tspan></text></g><g data-node="watch-list"><rect x="495.0" y="904" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="931" r="14" fill="#17212b"/><text x="521.0" y="936" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="936" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="936">저장·지켜보기</tspan></text><text x="729.0" y="976" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="982" fill="#52606d" font-size="12"><tspan x="513.0" y="998">나중에 읽기와 계속</tspan><tspan x="513.0" y="1014">추적하기의 사용자 의도를</tspan><tspan x="513.0" y="1030">분리한다.</tspan></text></g><g data-node="mobile-reader"><rect x="495.0" y="1136" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1163" r="14" fill="#17212b"/><text x="521.0" y="1168" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1168" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1168">모바일 읽기 화면</tspan></text><text x="729.0" y="1208" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1214" fill="#52606d" font-size="12"><tspan x="513.0" y="1230">짧은 시간에 이슈 흐름을 읽고</tspan><tspan x="513.0" y="1246">접근성 기준을 확인하는</tspan><tspan x="513.0" y="1262">화면이다.</tspan></text></g></svg>
