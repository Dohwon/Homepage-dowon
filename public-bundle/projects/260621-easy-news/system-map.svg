<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">뉴스 원천에서 오늘 읽기 화면까지</title><desc id="system-map-desc">검토된 seed와 RSS를 수집해 이슈 타임라인과 원자적 snapshot으로 제공한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">뉴스 원천에서 오늘 읽기 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">검토된 seed와 RSS를 수집해 이슈 타임라인과 원자적 snapshot으로</tspan><tspan x="40" y="108">제공한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">news publishing</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">수집·정리</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="552.5" y="257" width="101" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">검토 후 발행</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="850" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">사용자 저장</text></g><g data-flow="flow-04"><path d="M 749 334 C 749 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="417.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="457" y="380" text-anchor="middle" fill="#52606d" font-size="11">오늘 화면</text></g><g data-node="news-sources"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">뉴스 원천</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">검토된 seed와 외부 RSS에서 기사 후보를 받는다.</tspan></text></g><g data-node="issue-timeline"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">이슈 타임라인</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">거대한 관계 그래프 대신 한 이슈의 시간 흐름으로 정리한다.</tspan></text></g><g data-node="reviewed-snapshot"><rect x="624" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">검토된 snapshot</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">반쯤 갱신된 결과가 공개되지 않도록 한 번에 교체할 발행</tspan><tspan x="642" y="304">상태다.</tspan></text></g><g data-node="watch-list"><rect x="916" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">저장·지켜보기</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">나중에 읽기와 계속 추적하기의 사용자 의도를 분리한다.</tspan></text></g><g data-node="mobile-reader"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">모바일 읽기 화면</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">짧은 시간에 이슈 흐름을 읽고 접근성 기준을 확인하는</tspan><tspan x="58" y="522">화면이다.</tspan></text></g></svg>
