<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">학습 답안에서 다음 복습까지</title><desc id="system-map-desc">답안 판정과 연속 정답 상태를 바탕으로 복습 우선 세션과 계정 동기화를 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">학습 답안에서 다음 복습까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">답안 판정과 연속 정답 상태를 바탕으로 복습 우선 세션과 계정 동기화를</tspan><tspan x="40" y="108">만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">learning loop</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">카드 선택</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">답안 입력</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="855.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">상태 갱신</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558" y="364" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">진행도 저장</text></g><g data-node="word-bank"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">단어 카드</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">JLPT 급수별 학습 카드와 현재 상태를 제공한다.</tspan></text></g><g data-node="session-selector"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">복습 세션</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">오답과 due 카드를 신규 단어보다 먼저 골라 세션을</tspan><tspan x="350" y="304">만든다.</tspan></text></g><g data-node="answer-checker"><rect x="624" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">답안 판정</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">정규화·동의어를 먼저 적용하고 필요한 경우 의미 유사도를</tspan><tspan x="642" y="304">보조로 사용한다.</tspan></text></g><g data-node="mastery-state"><rect x="916" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">연속 정답 상태</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">연속 성공 횟수로 다음 복습 간격과 archive 여부를</tspan><tspan x="934" y="304">계산한다.</tspan></text></g><g data-node="progress-sync"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">진행도·계정 동기화</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">로컬 학습 기록을 보존하면서 로그인 계정과 병합한다.</tspan></text></g></svg>
