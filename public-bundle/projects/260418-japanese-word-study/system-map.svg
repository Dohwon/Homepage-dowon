<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 506" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">학습 답안에서 다음 복습까지</title><desc id="system-map-desc">답안 판정과 연속 정답 상태를 바탕으로 복습 우선 세션과 계정 동기화를 만든다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="506" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">학습 답안에서 다음 복습까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">답안 판정과 연속 정답 상태를 바탕으로 복습 우선 세션과 계정 동기화를</tspan><tspan x="40" y="108">만든다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="flow-01"><path d="M 290 271 C 290 330, 344 330, 344 389" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="277.5" y="316" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="332" text-anchor="middle" fill="#52606d" font-size="11">카드 선택</text></g><g data-flow="flow-02"><path d="M 594 389 C 594 448, 648 212, 648 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581.5" y="316" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="332" text-anchor="middle" fill="#52606d" font-size="11">답안 입력</text></g><g data-flow="flow-03"><path d="M 898 271 C 898 330, 952 330, 952 389" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="885.5" y="316" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="332" text-anchor="middle" fill="#52606d" font-size="11">상태 갱신</text></g><g data-flow="flow-04"><path d="M 1202 389 C 1202 448, 1256 212, 1256 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1184" y="316" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="332" text-anchor="middle" fill="#52606d" font-size="11">진행도 저장</text></g><g data-node="word-bank"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">단어 카드</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">JLPT 급수별 학습 카드와 현재 상태를 제공한다.</tspan></text></g><g data-node="session-selector"><rect x="344" y="326" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="353" r="14" fill="#17212b"/><text x="370" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="358" fill="#17212b" font-size="16" font-weight="700">복습 세션</text><text x="578" y="381" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362" y="404" fill="#52606d" font-size="12"><tspan x="362" y="406">오답과 due 카드를 신규 단어보다 먼저 골라 세션을</tspan><tspan x="362" y="422">만든다.</tspan></text></g><g data-node="answer-checker"><rect x="648" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="235" r="14" fill="#17212b"/><text x="674" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="240" fill="#17212b" font-size="16" font-weight="700">답안 판정</text><text x="882" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="666" y="286" fill="#52606d" font-size="12"><tspan x="666" y="288">정규화·동의어를 먼저 적용하고 필요한 경우 의미 유사도를</tspan><tspan x="666" y="304">보조로 사용한다.</tspan></text></g><g data-node="mastery-state"><rect x="952" y="326" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="353" r="14" fill="#17212b"/><text x="978" y="358" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="358" fill="#17212b" font-size="16" font-weight="700">연속 정답 상태</text><text x="1186" y="381" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="970" y="404" fill="#52606d" font-size="12"><tspan x="970" y="406">연속 성공 횟수로 다음 복습 간격과 archive 여부를</tspan><tspan x="970" y="422">계산한다.</tspan></text></g><g data-node="progress-sync"><rect x="1256" y="208" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="235" r="14" fill="#17212b"/><text x="1282" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="240" fill="#17212b" font-size="16" font-weight="700">진행도·계정 동기화</text><text x="1490" y="263" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1274" y="286" fill="#52606d" font-size="12"><tspan x="1274" y="288">로컬 학습 기록을 보존하면서 로그인 계정과 병합한다.</tspan></text></g></svg>
