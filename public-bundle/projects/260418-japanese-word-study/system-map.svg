<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">복습 우선으로 다시 짠 일본어 단어 학습: 구조와 결정 흐름</title><desc id="system-map-desc">JLPT N5부터 N1까지의 단어를 신규 진도보다 오답과 due 복습에 우선 배치하고, 연속 정답 단계와 local 계정 병합, 의미 유사도 보조 판정을 결합한 학습 앱을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">복습 우선으로 다시 짠 일본어 단어 학습: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">JLPT N5부터 N1까지의 단어를 신규 진도보다 오답과 due 복습에 우선</tspan><tspan x="80" y="108">배치하고, 연속 정답 단계와 local 계정 병합, 의미 유사도 보조 판정을</tspan><tspan x="80" y="130">결합한 학습 앱을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1248" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1406" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">단어 수보다 다시 만날 순서</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="250" fill="#52606d" font-size="12">이 앱은 28일 안에 새 단어를 많이 넘기는 것보다 틀린 단어와 복습 시점이 온 단어를 다시 만나게 하는 데 초점을 옮겼다. 데이터 범위는 N5에서 N1까지 7,493단어로 넓어졌지...</text></g><g data-node="review-first-selection"><rect x="80" y="346" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">신규 진도보다 복습 우선</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="408" fill="#52606d" font-size="12">책의 day를 채우는 신규 우선 방식에서는 완료율이 오르지 않고 한 번 맞힌 카드가 다시 나타나지 않는 문제가 있었다. 이를 철회하고 직전 오답 전체, due 전체, 2회 전 오답...</text></g><g data-node="mastery-state"><rect x="80" y="504" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">연속 정답으로 복습 단계 계산</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="566" fill="#52606d" font-size="12">stage는 누적 정답 수가 아니라 연속 정답을 기준으로 한다. 3일, 7일, 10일 간격으로 복습하고 네 번 연속 성공하면 archive로 보낸다. 중간 오답이 있어도 총 정답만...</text></g><g data-node="answer-evaluation"><rect x="80" y="662" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">정규화와 동의어 뒤에 의미 유사도 사용</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="724" fill="#52606d" font-size="12">답안은 먼저 문자열 정규화와 동의어 목록으로 판정하고, 이 규칙으로 판단하기 어려운 경우 서버의 임베딩 의미 유사도를 보조로 사용한다. 모든 답을 외부 생성 모델에 보내는 방식보다...</text></g><g data-node="progress-board"><rect x="80" y="820" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">진행 상태와 오답 강도를 함께 표시</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="882" fill="#52606d" font-size="12">전체 단어 보드는 진행 중, 완료와 오답으로 나누고 오답 횟수가 많을수록 강조를 높인다. 이후 정답 수가 오답 수보다 하나 많아지면 오답 강조를 제거해 오래된 실수를 영구 낙인처럼...</text></g><g data-node="sync-merge"><rect x="80" y="978" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">로그아웃 보존과 로그인 병합</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="1040" fill="#52606d" font-size="12">비로그인 상태는 localStorage, 로그인 상태는 로컬과 계정 서버에 저장한다. 로그아웃할 때 로컬 학습 기록을 모두 지우는 안은 사용자 확인 뒤 채택하지 않았다. 다시 비로그...</text></g><g data-node="stable-rendering"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">답 제출 때 전체 화면 재생성 중단</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1198" fill="#52606d" font-size="12">답을 제출할 때 전체 root를 다시 그리면 nav와 인증 헤더가 깜박이고 설정 초기화가 반복될 수 있었다. nav는 유지하고 학습 본문 중심으로 렌더하도록 수정했다. 이니셜 ava...</text></g><g data-node="implementation-flow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">학습 선택과 계정 저장 구조</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">정적 브라우저 앱이 급수별 단어 데이터, 카드 상태와 세션 selection을 관리한다. Node 서버는 인증, 계정 상태 JSON과 임베딩 의미 판정을 제공한다. 비로그인은 로컬만...</text></g><g data-node="validation"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">과거 배포 흔적과 현재 문법 확인</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">과거 작업 기록에는 진행도 보존, 요청 크기 제한, 병합, 페이지네이션, 복습 우선과 인증 헤더 수정 때마다 문법 검사, 서버 시작과 원격 반영을 확인한 흔적이 있다. 이는 각 변경...</text></g><g data-node="limitations"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">데이터와 동기화에 남은 과제</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1672" fill="#52606d" font-size="12">N1과 N2를 포함한 OCR 기반 단어 데이터의 중복과 오류를 전수 검증하지 않았다. 임베딩 임계값의 정밀도, 첫 로드 지연과 오답 설명도 남아 있다. 개발용 세션 fallback과...</text></g></svg>
