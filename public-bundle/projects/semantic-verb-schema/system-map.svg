<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">한국어 명령의 동사 의미 스키마 재구성: 구조와 결정 흐름</title><desc id="system-map-desc">규칙으로 빈칸을 채우는 방식에서 벗어나 한국어 명령을 엔티티와 액션으로 분해하고, 형태소·활용형 정보를 후속 사전과 학습에서 다시 쓸 수 있게 보존한 과정을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">한국어 명령의 동사 의미 스키마 재구성: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">규칙으로 빈칸을 채우는 방식에서 벗어나 한국어 명령을 엔티티와 액션으로</tspan><tspan x="80" y="108">분해하고, 형태소·활용형 정보를 후속 사전과 학습에서 다시 쓸 수 있게</tspan><tspan x="80" y="130">보존한 과정을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1090" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1248" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="entity-action-split"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">엔티티와 액션을 별도 축으로 분리</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">첫 결정은 발화를 하나의 키워드 묶음으로 다루지 않는 것이었다. 무엇을 제어하는지 나타내는 엔티티와 무엇을 하려는지 나타내는 액션을 별도 열로 분리했다. 이 구조는 같은 대상에 실행...</text></g><g data-node="replace-rule-retagging"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">순수 규칙 태깅을 Kiwi 기반으로 교체</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">초기 규칙 태깅은 빠르게 표를 채울 수 있었지만, 활용형과 문맥을 과도하게 정규화하는 문제가 있었다. 로컬 작업에서는 기존 결과를 되돌릴 수 있게 보존한 뒤 Kiwi 형태소 분석으로...</text></g><g data-node="preserve-action-parts"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">어근·어미·표면형을 함께 보존</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">액션은 정규화된 어근만 저장하지 않았다. 활용 어미와 사용자가 실제로 말한 표면형도 별도 값으로 남겼다. 예를 들어 같은 켜기 의도라도 명령형, 부탁형, 구어체가 다르며, 이 차이는...</text></g><g data-node="action-type-contract"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">동작을 열 가지 의미 유형으로 분류</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">액션 스키마는 실행, 수준 조절, 토글, 모드 선택, 상태 조회, 정보 질문, 예약, 권한, 취소, 선호 설정의 열 가지 유형을 정의한다. 단순히 동사 표면형이 같은지를 보는 대신...</text></g><g data-node="staged-corpus-pipeline"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">말뭉치 확장을 단계별 파이프라인으로 분리</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">대규모 말뭉치에서 바로 기능 후보를 확정하지 않고, 문서를 chunk로 나누고 동사 lemma 빈도를 집계한 뒤 기능 후보를 만들고 병합·의미 필터링하는 단계로 분리했다. 동사 in...</text></g><g data-node="split-asset-ownership"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">학습 데이터와 사전 평가의 소유권 분리</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">프로젝트가 커지면서 동사 학습 스크립트, active dictionary, 리플레이 결과가 한 폴더에서 서로의 완료 상태를 가렸다. 2026년 4월 정리에서는 사전 JSON과 리플레...</text></g><g data-node="implementation-flow"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">재태깅과 후보 생성의 구현 흐름</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">재태깅 스크립트는 학습 workbook을 읽고 기능명에서 seed를 만들며, 각 발화를 Kiwi로 분석해 엔티티와 액션 부분을 기록한다. 별도 inventory 스크립트는 말뭉치에서...</text></g><g data-node="validation-boundary"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">과거 점검과 현재 재현성의 경계</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">현재 확인 가능한 것은 action type 스키마, Kiwi 재태깅 코드, 동사 inventory와 후보 처리 스크립트가 존재한다는 사실이다. 재태깅 구현은 workbook의 en...</text></g><g data-node="current-status"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">현재 상태와 남은 작업</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">이 프로젝트는 한국어 명령을 엔티티와 액션으로 분해하고 활용 정보를 보존하는 방법론과 구현 자산을 남겼다. 반면 비어 있는 token schema, 누락된 의존 모듈, 테스트 부재...</text></g></svg>
