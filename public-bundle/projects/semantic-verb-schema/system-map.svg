<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">한국어 문장에서 동사 의미 스키마까지</title><desc id="system-map-desc">문장을 entity와 action으로 나누고 형태 정보를 보존한 태깅·후보 생성 파이프라인으로 바꾼다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">한국어 문장에서 동사 의미 스키마까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">문장을 entity와 action으로 나누고 형태 정보를 보존한 태깅·후보</tspan><tspan x="40" y="108">생성 파이프라인으로 바꾼다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">language schema pipeline</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">형태 분석</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">의미 분류</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="855.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">후보 생성</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">자산 저장</text></g><g data-node="korean-command"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">한국어 명령</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">기능을 수행하려는 자연어 문장이다.</tspan></text></g><g data-node="kiwi-parser"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">형태 분석</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">규칙만으로 자르지 않고 Kiwi 기반으로 어근·어미·표면형을</tspan><tspan x="350" y="304">분석한다.</tspan></text></g><g data-node="action-schema"><rect x="624" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">동사 의미 스키마</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">동작을 열 가지 의미 유형과 액션 구성요소로 표현한다.</tspan></text></g><g data-node="retagging-pipeline"><rect x="916" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">재태깅 파이프라인</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">말뭉치 확장과 후보 생성을 단계별로 실행한다.</tspan></text></g><g data-node="schema-assets"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">학습·평가 자산</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">학습 데이터와 사전 평가의 소유권을 분리해 결과를 관리한다.</tspan></text></g></svg>
