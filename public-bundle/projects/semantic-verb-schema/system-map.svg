<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 608" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">한국어 문장에서 동사 의미 스키마까지</title><desc id="system-map-desc">문장을 entity와 action으로 나누고 형태 정보를 보존한 태깅·후보 생성 파이프라인으로 바꾼다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="608" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">한국어 문장에서 동사 의미 스키마까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">문장을 entity와 action으로 나누고 형태 정보를 보존한 태깅·후보</tspan><tspan x="40" y="108">생성 파이프라인으로 바꾼다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 271 C 294.25 299, 344.75 243, 344.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="280" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">형태 분석</text></g><g data-flow="flow-02"><path d="M 594.75 271 C 594.75 299, 645.25 243, 645.25 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="273" text-anchor="middle" fill="#52606d" font-size="11">의미 분류</text></g><g data-flow="flow-03"><path d="M 895.25 271 C 895.25 299, 945.75 243, 945.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="881" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">후보 생성</text></g><g data-flow="flow-04"><path d="M 945.75 271 C 945.75 381, 294.25 381, 294.25 491" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="367" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="383" text-anchor="middle" fill="#52606d" font-size="11">자산 저장</text></g><g data-node="korean-command"><rect x="44.25" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="235" r="14" fill="#17212b"/><text x="70.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="240" fill="#17212b" font-size="16" font-weight="700">한국어 명령</text><text x="278.25" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="62.25" y="286" fill="#52606d" font-size="12"><tspan x="62.25" y="288">기능을 수행하려는 자연어 문장이다.</tspan></text></g><g data-node="kiwi-parser"><rect x="344.75" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="235" r="14" fill="#17212b"/><text x="370.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="240" fill="#17212b" font-size="16" font-weight="700">형태 분석</text><text x="578.75" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="362.75" y="286" fill="#52606d" font-size="12"><tspan x="362.75" y="288">규칙만으로 자르지 않고 Kiwi 기반으로 어근·어미·표면형을</tspan><tspan x="362.75" y="304">분석한다.</tspan></text></g><g data-node="action-schema"><rect x="645.25" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="235" r="14" fill="#17212b"/><text x="671.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="240" fill="#17212b" font-size="16" font-weight="700">동사 의미 스키마</text><text x="879.25" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="663.25" y="286" fill="#52606d" font-size="12"><tspan x="663.25" y="288">동작을 열 가지 의미 유형과 액션 구성요소로 표현한다.</tspan></text></g><g data-node="retagging-pipeline"><rect x="945.75" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="235" r="14" fill="#17212b"/><text x="971.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="240" fill="#17212b" font-size="16" font-weight="700">재태깅 파이프라인</text><text x="1179.75" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="963.75" y="286" fill="#52606d" font-size="12"><tspan x="963.75" y="288">말뭉치 확장과 후보 생성을 단계별로 실행한다.</tspan></text></g><g data-node="schema-assets"><rect x="44.25" y="428" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="455" r="14" fill="#17212b"/><text x="70.25" y="460" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="460" fill="#17212b" font-size="16" font-weight="700">학습·평가 자산</text><text x="278.25" y="483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="506" fill="#52606d" font-size="12"><tspan x="62.25" y="508">학습 데이터와 사전 평가의 소유권을 분리해 결과를 관리한다.</tspan></text></g></svg>
