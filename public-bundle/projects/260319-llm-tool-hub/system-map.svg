<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 608" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">사용자 요청에서 도구 실행과 운영 상태까지</title><desc id="system-map-desc">도구 레지스트리와 메모리 어댑터를 분리해 요청을 선택된 provider 실행으로 연결하고 운영 상태를 확인한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="608" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">사용자 요청에서 도구 실행과 운영 상태까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">도구 레지스트리와 메모리 어댑터를 분리해 요청을 선택된 provider</tspan><tspan x="40" y="108">실행으로 연결하고 운영 상태를 확인한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 271 C 294.25 299, 344.75 243, 344.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="280" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">도구 선택</text></g><g data-flow="flow-02"><path d="M 594.75 271 C 594.75 299, 645.25 243, 645.25 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="273" text-anchor="middle" fill="#52606d" font-size="11">입력 변환</text></g><g data-flow="flow-03"><path d="M 895.25 271 C 895.25 299, 945.75 243, 945.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="859" y="257" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">공통 prompt</text></g><g data-flow="flow-04"><path d="M 945.75 271 C 945.75 381, 294.25 381, 294.25 491" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="367" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="383" text-anchor="middle" fill="#52606d" font-size="11">실행 상태</text></g><g data-node="user-request"><rect x="44.25" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="235" r="14" fill="#17212b"/><text x="70.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="240" fill="#17212b" font-size="16" font-weight="700">사용자 요청</text><text x="278.25" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="62.25" y="286" fill="#52606d" font-size="12"><tspan x="62.25" y="288">사용자가 원하는 작업과 도구를 자연어로 요청한다.</tspan></text></g><g data-node="tool-registry"><rect x="344.75" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="235" r="14" fill="#17212b"/><text x="370.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="240" fill="#17212b" font-size="16" font-weight="700">도구 레지스트리</text><text x="578.75" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="362.75" y="286" fill="#52606d" font-size="12"><tspan x="362.75" y="288">도구의 capability와 운영 메타데이터를 정본으로</tspan><tspan x="362.75" y="304">관리한다.</tspan></text></g><g data-node="memory-adapter"><rect x="645.25" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="235" r="14" fill="#17212b"/><text x="671.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="240" fill="#17212b" font-size="16" font-weight="700">메모리 어댑터</text><text x="879.25" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="663.25" y="286" fill="#52606d" font-size="12"><tspan x="663.25" y="288">공통 프로필과 도구별 입력 형식 사이를 변환한다.</tspan></text></g><g data-node="provider-run"><rect x="945.75" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="235" r="14" fill="#17212b"/><text x="971.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="240" fill="#17212b" font-size="16" font-weight="700">Provider 실행</text><text x="1179.75" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="963.75" y="286" fill="#52606d" font-size="12"><tspan x="963.75" y="288">공통 prompt 계약 뒤에 서로 다른 LLM</tspan><tspan x="963.75" y="304">provider를 배치한다.</tspan></text></g><g data-node="usage-status"><rect x="44.25" y="428" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="455" r="14" fill="#17212b"/><text x="70.25" y="460" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="460" fill="#17212b" font-size="16" font-weight="700">로그인·사용량·상태</text><text x="278.25" y="483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="506" fill="#52606d" font-size="12"><tspan x="62.25" y="508">인증, 사용량과 갱신 실패를 운영자가 확인할 수 있게</tspan><tspan x="62.25" y="524">남긴다.</tspan></text></g></svg>
