<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">LLM 도구와 메모리 어댑터 운영 허브: 구조와 결정 흐름</title><desc id="system-map-desc">모델·도구·프로젝트 registry와 normalized memory를 분리하고 도구별 adapter를 생성한 허브의 구조, 인증 변경과 오래된 registry 한계를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">LLM 도구와 메모리 어댑터 운영 허브: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">모델·도구·프로젝트 registry와 normalized memory를</tspan><tspan x="80" y="108">분리하고 도구별 adapter를 생성한 허브의 구조, 인증 변경과 오래된</tspan><tspan x="80" y="130">registry 한계를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x