<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">요청에서 승인된 실행과 검증까지</title><desc id="system-map-desc">대표 요청을 실행 계획과 handoff packet으로 바꾸고 승인·구현·검증 상태를 분리해 관리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">요청에서 승인된 실행과 검증까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">대표 요청을 실행 계획과 handoff packet으로 바꾸고</tspan><tspan x="40" y="108">승인·구현·검증 상태를 분리해 관리한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">agent execution control</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">계획 작성</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">승인 요청</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="811.5" y="257" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">승인 후 dispatch</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">검증 인계</text></g><g data-node="task-intake"><rect x="40" y="208" width="250" height="126" rx="8" fill="#e9f2fb" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">대표 요청</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">actor</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">사람이 해결하려는 업무와 완료 조건을 하나의 intake로</tspan><tspan x="58" y="304">넣는다.</tspan></text></g><g data-node="execution-plan"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">실행 계획</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">구현자에게 범위·산출물·검증 조건을 구조화해 전달한다.</tspan></text></g><g data-node="approval-gate"><rect x="624" y="208" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">사람 승인</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">실제 구현과 외부 효과가 발생하기 전에 진행 여부를</tspan><tspan x="642" y="304">확인한다.</tspan></text></g><g data-node="agent-run"><rect x="916" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">에이전트 실행</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">Python orchestrator와 Codex</tspan><tspan x="934" y="304">backend가 승인된 단계를 수행한다.</tspan></text></g><g data-node="verification-report"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">검증 보고</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">구현 검증과 사용자 수용 검증을 별도 상태로 기록한다.</tspan></text></g></svg>
