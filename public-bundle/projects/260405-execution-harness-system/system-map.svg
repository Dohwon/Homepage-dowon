<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 674" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">요청에서 승인된 실행과 검증까지</title><desc id="system-map-desc">대표 요청을 실행 계획과 handoff packet으로 바꾸고 승인·구현·검증 상태를 분리해 관리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="674" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">요청에서 승인된 실행과 검증까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">대표 요청을 실행 계획과 handoff packet으로</tspan><tspan x="40" y="108">바꾸고 승인·구현·검증 상태를 분리해</tspan><tspan x="40" y="130">관리한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 304 C 294.25 332, 344.75 276, 344.75 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="280.5" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="306" text-anchor="middle" fill="#52606d" font-size="11">계획 작성</text></g><g data-flow="flow-02"><path d="M 594.75 304 C 594.75 332, 645.25 276, 645.25 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="306" text-anchor="middle" fill="#52606d" font-size="11">승인 요청</text></g><g data-flow="flow-03"><path d="M 895.25 304 C 895.25 332, 945.75 276, 945.75 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="860.5" y="290" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="306" text-anchor="middle" fill="#52606d" font-size="11">승인 후 dispatch</text></g><g data-flow="flow-04"><path d="M 945.75 304 C 945.75 425, 294.25 425, 294.25 546" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="411" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="427" text-anchor="middle" fill="#52606d" font-size="11">검증 인계</text></g><g data-node="task-intake"><rect x="44.25" y="230" width="250" height="148" rx="8" fill="#e9f2fb" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="257" r="14" fill="#17212b"/><text x="70.25" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="94.25" y="262">대표 요청</tspan></text><text x="278.25" y="302" text-anchor="end" fill="#52606d" font-size="11">actor</text><text x="62.25" y="308" fill="#52606d" font-size="12"><tspan x="62.25" y="324">사람이 해결하려는 업무와</tspan><tspan x="62.25" y="340">완료 조건을 하나의 intake로</tspan><tspan x="62.25" y="356">넣는다.</tspan></text></g><g data-node="execution-plan"><rect x="344.75" y="230" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="257" r="14" fill="#17212b"/><text x="370.75" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="394.75" y="262">실행 계획</tspan></text><text x="578.75" y="302" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362.75" y="308" fill="#52606d" font-size="12"><tspan x="362.75" y="324">구현자에게</tspan><tspan x="362.75" y="340">범위·산출물·검증 조건을</tspan><tspan x="362.75" y="356">구조화해 전달한다.</tspan></text></g><g data-node="approval-gate"><rect x="645.25" y="230" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="257" r="14" fill="#17212b"/><text x="671.25" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="695.25" y="262">사람 승인</tspan></text><text x="879.25" y="302" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="663.25" y="308" fill="#52606d" font-size="12"><tspan x="663.25" y="324">실제 구현과 외부 효과가</tspan><tspan x="663.25" y="340">발생하기 전에 진행 여부를</tspan><tspan x="663.25" y="356">확인한다.</tspan></text></g><g data-node="agent-run"><rect x="945.75" y="230" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="257" r="14" fill="#17212b"/><text x="971.75" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="995.75" y="262">에이전트 실행</tspan></text><text x="1179.75" y="302" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="963.75" y="308" fill="#52606d" font-size="12"><tspan x="963.75" y="324">Python orchestrator와 Codex</tspan><tspan x="963.75" y="340">backend가 승인된 단계를</tspan><tspan x="963.75" y="356">수행한다.</tspan></text></g><g data-node="verification-report"><rect x="44.25" y="472" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="499" r="14" fill="#17212b"/><text x="70.25" y="504" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="504" fill="#17212b" font-size="16" font-weight="700"><tspan x="94.25" y="504">검증 보고</tspan></text><text x="278.25" y="544" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="550" fill="#52606d" font-size="12"><tspan x="62.25" y="566">구현 검증과 사용자 수용</tspan><tspan x="62.25" y="582">검증을 별도 상태로 기록한다.</tspan></text></g></svg>
