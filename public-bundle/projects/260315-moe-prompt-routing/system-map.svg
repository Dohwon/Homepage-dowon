<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 674" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">사용자 요청에서 expert 결과까지</title><desc id="system-map-desc">명확한 명령은 사전이 처리하고, 남은 요청만 family 선택과 expert 실행으로 넘기는 라우팅 흐름이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="674" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">사용자 요청에서 expert 결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">명확한 명령은 사전이 처리하고, 남은 요청만</tspan><tspan x="40" y="108">family 선택과 expert 실행으로 넘기는</tspan><tspan x="40" y="130">라우팅 흐름이다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 304 C 294.25 332, 344.75 276, 344.75 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="259.5" y="290" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="306" text-anchor="middle" fill="#52606d" font-size="11">확실한 명령 우선</text></g><g data-flow="flow-02"><path d="M 594.75 304 C 594.75 332, 645.25 276, 645.25 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="290" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="306" text-anchor="middle" fill="#52606d" font-size="11">미해결 요청</text></g><g data-flow="flow-03"><path d="M 895.25 304 C 895.25 332, 945.75 276, 945.75 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="875.5" y="290" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="306" text-anchor="middle" fill="#52606d" font-size="11">family 전달</text></g><g data-flow="flow-04"><path d="M 945.75 304 C 945.75 425, 294.25 425, 294.25 546" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="581" y="411" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="427" text-anchor="middle" fill="#52606d" font-size="11">결과 평가</text></g><g data-node="user-request"><rect x="44.25" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="257" r="14" fill="#17212b"/><text x="70.25" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="94.25" y="262">사용자 요청</tspan></text><text x="278.25" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="62.25" y="308" fill="#52606d" font-size="12"><tspan x="62.25" y="324">음성 또는 텍스트로 들어온</tspan><tspan x="62.25" y="340">자연어 요청이다.</tspan></text></g><g data-node="dictionary-router"><rect x="344.75" y="230" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="257" r="14" fill="#17212b"/><text x="370.75" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="394.75" y="262">명확한 명령 라우터</tspan></text><text x="578.75" y="302" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362.75" y="308" fill="#52606d" font-size="12"><tspan x="362.75" y="324">사전에 확실히 매핑되는</tspan><tspan x="362.75" y="340">요청을 낮은 비용으로 먼저</tspan><tspan x="362.75" y="356">처리한다.</tspan></text></g><g data-node="family-selector"><rect x="645.25" y="230" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="257" r="14" fill="#17212b"/><text x="671.25" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="695.25" y="262">기능 family 선택</tspan></text><text x="879.25" y="302" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="663.25" y="308" fill="#52606d" font-size="12"><tspan x="663.25" y="324">모호한 요청만 적절한 기능</tspan><tspan x="663.25" y="340">family로 분류한다.</tspan></text></g><g data-node="expert-executor"><rect x="945.75" y="230" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="257" r="14" fill="#17212b"/><text x="971.75" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="995.75" y="262">expert 실행</tspan></text><text x="1179.75" y="302" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="963.75" y="308" fill="#52606d" font-size="12"><tspan x="963.75" y="324">선택된 family의 expert가</tspan><tspan x="963.75" y="340">실행 가능한 결과 계약을</tspan><tspan x="963.75" y="356">만든다.</tspan></text></g><g data-node="evaluated-result"><rect x="44.25" y="472" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="499" r="14" fill="#17212b"/><text x="70.25" y="504" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="504" fill="#17212b" font-size="16" font-weight="700"><tspan x="94.25" y="504">평가 결과</tspan></text><text x="278.25" y="544" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="550" fill="#52606d" font-size="12"><tspan x="62.25" y="566">라우팅과 expert 결과를 별도</tspan><tspan x="62.25" y="582">조건으로 평가하고 실패 행도</tspan><tspan x="62.25" y="598">남긴다.</tspan></text></g></svg>
