<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">계층형 음성 라우팅과 평가 경계 정리: 구조와 결정 흐름</title><desc id="system-map-desc">dictionary, family classifier, specialist와 selector의 책임을 나누고 라우팅과 결과 계약을 별도 평가한 과정 및 Stage 2 미달 상태를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">계층형 음성 라우팅과 평가 경계 정리: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">dictionary, family classifier, specialist와</tspan><tspan x="80" y="108">selector의 책임을 나누고 라우팅과 결과 계약을 별도 평가한 과정 및</tspan><tspan x="80" y="130">Stage 2 미달 상태를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="774" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="dictionary-first"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">명확한 요청은 dictionary가 먼저 처리</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="250" fill="#52606d" font-size="12">exact match나 높은 신뢰의 로컬 사전 경로를 LLM보다 앞에 둔다. 이미 정해진 기기 명령까지 매번 생성 모...</text></g><g data-node="family-then-expert"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">family 선택과 expert 실행 분리</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">모든 expert를 한 번에 경쟁시키는 대신 Stage 1이 처리 family를 먼저 정한다. 고신뢰이면 한 spec...</text></g><g data-node="bounded-selector"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">selector를 저신뢰 예외로 제한</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">selector는 항상 호출되는 마지막 LLM이 아니다. family 신뢰도가 낮고 허용된 두 후보를 실행한 경우에만...</text></g><g data-node="rules-and-normalization"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">prompt 규칙과 후처리 효과 분리</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">few-shot 예시를 계속 늘리는 대신 capability와 반복 가능한 분류 규칙을 prompt에 둔다. 표기 차...</text></g><g data-node="operational-sample"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">운영 표본은 별도 조건으로 해석</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">월별 500행씩 모은 총 1,500행 표본의 과거 prompt-only 결과는 1,316/1,500, 87.73%였다...</text></g><g data-node="owner-failure"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">Stage 2 owner 선택 26/100</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">100행 Stage 2 owner 선택 실험은 원래 judge의 quota 문제로 다른 judge를 사용한 조건에서...</text></g><g data-node="result-contract"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">expert 결과 계약은 별도 평가</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">seed 두 개에서 각 200행을 실행한 별도 평가는 pass 95.25%, partial 0.75%, fail 2%...</text></g><g data-node="failure-policy"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">실패 행과 평가 조건 보존</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">일시적인 provider 오류는 제한적으로 재시도하지만 최종 실패를 빈 성공 행으로 바꾸지 않는다. error와 em...</text></g><g data-node="limitations"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">완료로 볼 수 없는 상태</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">Stage 2 owner 선택 26/100은 해결되지 않았다. 현재 full cross-validation summa...</text></g></svg>
