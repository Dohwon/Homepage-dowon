<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">사용자 요청에서 expert 결과까지</title><desc id="system-map-desc">명확한 명령은 사전이 처리하고, 남은 요청만 family 선택과 expert 실행으로 넘기는 라우팅 흐름이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">사용자 요청에서 expert 결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">명확한 명령은 사전이 처리하고, 남은 요청만 family 선택과 expert</tspan><tspan x="40" y="108">실행으로 넘기는 라우팅 흐름이다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">routing pipeline</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="249.5" y="257" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">확실한 명령 우선</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">미해결 요청</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="833.5" y="257" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">family 전달</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">결과 평가</text></g><g data-node="user-request"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">사용자 요청</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">음성 또는 텍스트로 들어온 자연어 요청이다.</tspan></text></g><g data-node="dictionary-router"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">명확한 명령 라우터</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">사전에 확실히 매핑되는 요청을 낮은 비용으로 먼저 처리한다.</tspan></text></g><g data-node="family-selector"><rect x="624" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">기능 family 선택</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">모호한 요청만 적절한 기능 family로 분류한다.</tspan></text></g><g data-node="expert-executor"><rect x="916" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">expert 실행</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">선택된 family의 expert가 실행 가능한 결과 계약을</tspan><tspan x="934" y="304">만든다.</tspan></text></g><g data-node="evaluated-result"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">평가 결과</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">라우팅과 expert 결과를 별도 조건으로 평가하고 실패</tspan><tspan x="58" y="522">행도 남긴다.</tspan></text></g></svg>
