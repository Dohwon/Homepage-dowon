<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">음성 AI 오케스트레이션 전환 problem-solving map</title>
<desc id="desc">Revision to Decision.</desc>
<style>
:root { --atlas-bg: #f6f8fb; --atlas-node: #ffffff; --atlas-ink: #172033; --atlas-line: #52657f; --atlas-accent: #0b7285; --atlas-muted: #52657f; }
@media (prefers-color-scheme: dark) { :root { --atlas-bg: #121820; --atlas-node: #1d2632; --atlas-ink: #f4f7fb; --atlas-line: #9ab1c8; --atlas-accent: #5fd0d8; --atlas-muted: #c2d0df; } }
svg { background: var(--atlas-bg); font-family: Arial, sans-serif; }
.node { fill: var(--atlas-node); stroke: var(--atlas-line); stroke-width: 2; }
.stage { fill: var(--atlas-accent); font-size: 18px; font-weight: bold; }
.body { fill: var(--atlas-ink); font-size: 13px; }
.muted { fill: var(--atlas-muted); font-size: 12px; }
.arrow { fill: none; stroke: var(--atlas-line); stroke-width: 2; }
</style>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="var(--atlas-line)" /></marker></defs>
<path class="arrow" d="M 588 320 H 600" marker-end="url(#arrowhead)" />
<g id="node-revision">
<rect class="node" x="380" y="142" width="208" height="356" rx="6" />
<text class="stage" x="394" y="180">Revision</text>
<text class="body" x="394" y="216">Title: Revision</text>
<text class="muted" x="394" y="288">Context: 전체 교체는 기존 경로의 회귀와 운영 중단</text>
<text class="muted" x="394" y="305">위험이 컸습니다.</text>
<text class="muted" x="394" y="360">Decision: feature flag와 bridge</text>
<text class="muted" x="394" y="377">contract를 둔 점진적 전환 구조를</text>
<text class="muted" x="394" y="432">Result: 새 경로를 끄면 기존 직접 경로로 돌아갈 수</text>
<text class="muted" x="394" y="449">있게 됐습니다.</text>
</g>
<g id="node-decision">
<rect class="node" x="612" y="142" width="208" height="356" rx="6" />
<text class="stage" x="626" y="180">Decision</text>
<text class="body" x="626" y="216">Title: Decision</text>
<text class="muted" x="626" y="288">Context: 라우터가 내부 delegate까지 무제한으로</text>
<text class="muted" x="626" y="305">호출하면 책임과 비용을 추적하기 어려웠습니다.</text>
<text class="muted" x="626" y="360">Decision: 상위 라우터와 전문가의 호출 깊이를</text>
<text class="muted" x="626" y="377">제한했습니다.</text>
<text class="muted" x="626" y="432">Result: 오케스트레이션 흐름과 실패 지점을 예측할 수</text>
<text class="muted" x="626" y="449">있게 됐습니다.</text>
</g>
</svg>
