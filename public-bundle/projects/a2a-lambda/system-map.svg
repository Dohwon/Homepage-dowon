<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 608" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">질문에서 제한된 backend 실행까지</title><desc id="system-map-desc">feature flag와 응답 envelope를 유지하면서 family agent와 실제 backend의 경계를 지키는 A2A 라우팅이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="608" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">질문에서 제한된 backend 실행까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">feature flag와 응답 envelope를 유지하면서 family</tspan><tspan x="40" y="108">agent와 실제 backend의 경계를 지키는 A2A 라우팅이다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 271 C 294.25 299, 344.75 243, 344.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="280" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">계약 생성</text></g><g data-flow="flow-02"><path d="M 594.75 271 C 594.75 299, 645.25 243, 645.25 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558.5" y="257" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="273" text-anchor="middle" fill="#52606d" font-size="11">family 전달</text></g><g data-flow="flow-03"><path d="M 895.25 271 C 895.25 299, 945.75 243, 945.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="875.5" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">제한된 위임</text></g><g data-flow="flow-04"><path d="M 945.75 271 C 945.75 381, 294.25 381, 294.25 491" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="367" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="383" text-anchor="middle" fill="#52606d" font-size="11">응답 반환</text></g><g data-node="incoming-question"><rect x="44.25" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="235" r="14" fill="#17212b"/><text x="70.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="240" fill="#17212b" font-size="16" font-weight="700">준비된 질문</text><text x="278.25" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="62.25" y="286" fill="#52606d" font-size="12"><tspan x="62.25" y="288">지원 범위와 실행 조건을 가진 질문을 받는다.</tspan></text></g><g data-node="route-envelope"><rect x="344.75" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="235" r="14" fill="#17212b"/><text x="370.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="240" fill="#17212b" font-size="16" font-weight="700">A2A 응답 계약</text><text x="578.75" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="362.75" y="286" fill="#52606d" font-size="12"><tspan x="362.75" y="288">depth·family·상태를 포함한 공통 envelope로</tspan><tspan x="362.75" y="304">전달한다.</tspan></text></g><g data-node="family-agent"><rect x="645.25" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="235" r="14" fill="#17212b"/><text x="671.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="240" fill="#17212b" font-size="16" font-weight="700">Family agent</text><text x="879.25" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="663.25" y="286" fill="#52606d" font-size="12"><tspan x="663.25" y="288">기능별 질문을 담당하지만 실제 외부 실행의 소유권은 넘겨받지</tspan><tspan x="663.25" y="304">않는다.</tspan></text></g><g data-node="backend-boundary"><rect x="945.75" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="235" r="14" fill="#17212b"/><text x="971.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="240" fill="#17212b" font-size="16" font-weight="700">실제 backend</text><text x="1179.75" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="963.75" y="286" fill="#52606d" font-size="12"><tspan x="963.75" y="288">action·schedule 등 실제 실행 가능 여부를 별도</tspan><tspan x="963.75" y="304">경계에서 판단한다.</tspan></text></g><g data-node="validated-response"><rect x="44.25" y="428" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="455" r="14" fill="#17212b"/><text x="70.25" y="460" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="460" fill="#17212b" font-size="16" font-weight="700">검증된 응답</text><text x="278.25" y="483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="506" fill="#52606d" font-size="12"><tspan x="62.25" y="508">flag와 자유 질의 경계를 포함해 전환 가능한 결과를</tspan><tspan x="62.25" y="524">반환한다.</tspan></text></g></svg>
