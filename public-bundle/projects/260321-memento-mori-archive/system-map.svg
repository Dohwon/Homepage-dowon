<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 618" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">기록 작성에서 공개·비공개 응답까지</title><desc id="system-map-desc">개인 기록을 저장하고 요청자의 권한에 따라 본문·목록·관리 기능을 다르게 제공한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="618" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">기록 작성에서 공개·비공개 응답까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">개인 기록을 저장하고 요청자의 권한에 따라 본문·목록·관리 기능을 다르게</tspan><tspan x="40" y="108">제공한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 271 C 290 299, 358 243, 358 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="288" y="257" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="273" text-anchor="middle" fill="#52606d" font-size="11">저장</text></g><g data-flow="flow-02"><path d="M 608 271 C 608 299, 676 243, 676 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="602.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="273" text-anchor="middle" fill="#52606d" font-size="11">권한 확인</text></g><g data-flow="flow-03"><path d="M 676 271 C 676 386, 290 386, 290 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="427" y="372" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="388" text-anchor="middle" fill="#52606d" font-size="11">접근 경로 선택</text></g><g data-flow="flow-04"><path d="M 290 501 C 290 529, 358 473, 358 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="268" y="487" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="503" text-anchor="middle" fill="#52606d" font-size="11">공개 범위 적용</text></g><g data-node="journal-entry"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">개인 기록</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">사용자가 작성하거나 수정하려는 기록 본문이다.</tspan></text></g><g data-node="volume-storage"><rect x="358" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="235" r="14" fill="#17212b"/><text x="384" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="240" fill="#17212b" font-size="16" font-weight="700">영속 저장소</text><text x="592" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="376" y="286" fill="#52606d" font-size="12"><tspan x="376" y="288">runtime data와 legacy 데이터를 공개 정적</tspan><tspan x="376" y="304">파일과 분리해 보존한다.</tspan></text></g><g data-node="session-auth"><rect x="676" y="208" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="235" r="14" fill="#17212b"/><text x="702" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="240" fill="#17212b" font-size="16" font-weight="700">서명 세션</text><text x="910" y="263" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="694" y="286" fill="#52606d" font-size="12"><tspan x="694" y="288">HttpOnly cookie와 서버 검증으로 요청자의 접근</tspan><tspan x="694" y="304">권한을 확인한다.</tspan></text></g><g data-node="access-router"><rect x="40" y="438" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="465" r="14" fill="#17212b"/><text x="66" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="470" fill="#17212b" font-size="16" font-weight="700">접근별 API</text><text x="274" y="493" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="58" y="516" fill="#52606d" font-size="12"><tspan x="58" y="518">관리자·채팅 archive·개별 글 접근을 서로 다른 인증</tspan><tspan x="58" y="534">경계로 처리한다.</tspan></text></g><g data-node="safe-response"><rect x="358" y="438" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="465" r="14" fill="#17212b"/><text x="384" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="470" fill="#17212b" font-size="16" font-weight="700">안전한 응답</text><text x="592" y="493" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="516" fill="#52606d" font-size="12"><tspan x="376" y="518">잠긴 요청에는 본문과 excerpt 대신 고정된 비공개</tspan><tspan x="376" y="534">응답만 돌려준다.</tspan></text></g></svg>
