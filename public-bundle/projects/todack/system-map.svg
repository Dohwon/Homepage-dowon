<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">감정 입력에서 개인화된 보조 작업까지</title><desc id="system-map-desc">웹·모바일 입력을 사용자 원장과 개인화 프로필에 연결하고 대화·캡슐·미션을 같은 계정 경계에서 처리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">감정 입력에서 개인화된 보조 작업까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">웹·모바일 입력을 사용자 원장과 개인화 프로필에 연결하고 대화·캡슐·미션을</tspan><tspan x="40" y="108">같은 계정 경계에서 처리한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">personal agent service</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="266" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">사용자 식별</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">프로필 조회</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="850" y="257" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">개인화 실행</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="547" y="364" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">기록·통계 반영</text></g><g data-node="feeling-entry"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">감정·대화 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">웹, 모바일과 음성 채널에서 사용자의 기록과 대화를 받는다.</tspan></text></g><g data-node="identity-session"><rect x="332" y="208" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">사용자 세션</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">브라우저와 모바일의 세션 전달 방식을 사용자 단위로</tspan><tspan x="350" y="304">통일한다.</tspan></text></g><g data-node="personalization"><rect x="624" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">프로필·기억</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">사용자별 프롬프트와 기억을 다른 사용자의 데이터와 섞지</tspan><tspan x="642" y="304">않는다.</tspan></text></g><g data-node="assistant-actions"><rect x="916" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">대화·캡슐·미션</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">대화 응답, 미래 캡슐과 미션 상태를 서버에서 처리한다.</tspan></text></g><g data-node="user-dashboard"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">기록·통계 화면</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">감정 기록과 기간별 통계를 다시 보여 주되 관측 강도와</tspan><tspan x="58" y="522">표본을 함께 고려한다.</tspan></text></g></svg>
