<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 588.2623792124926" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">감정 입력에서 개인화된 보조 작업까지</title><desc id="system-map-desc">웹·모바일 입력을 사용자 원장과 개인화 프로필에 연결하고 대화·캡슐·미션을 같은 계정 경계에서 처리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="588.2623792124926" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">감정 입력에서 개인화된 보조 작업까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">웹·모바일 입력을 사용자 원장과 개인화 프로필에 연결하고 대화·캡슐·미션을</tspan><tspan x="40" y="108">같은 계정 경계에서 처리한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 218 C 674 218, 955.933 314.738, 1009.93 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="769.967" y="252.369" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="814.967" y="268.369" text-anchor="middle" fill="#52606d" font-size="11">사용자 식별</text></g><g data-flow="flow-02"><path d="M 1009.93 314.738 C 955.933 314.738, 914.992 471.262, 860.992 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="890.463" y="379" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="935.463" y="395" text-anchor="middle" fill="#52606d" font-size="11">프로필 조회</text></g><g data-flow="flow-03"><path d="M 860.992 471.262 C 806.992 471.262, 433.008 471.262, 379.008 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="457.262" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="473.262" text-anchor="middle" fill="#52606d" font-size="11">개인화 실행</text></g><g data-flow="flow-04"><path d="M 379.008 471.262 C 325.008 471.262, 284.067 314.738, 230.067 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="248.537" y="379" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="304.537" y="395" text-anchor="middle" fill="#52606d" font-size="11">기록·통계 반영</text></g><g data-node="feeling-entry"><rect x="495.0" y="155.0" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="182.0" r="14" fill="#17212b"/><text x="521.0" y="187.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="187.0" fill="#17212b" font-size="16" font-weight="700">감정·대화 입력</text><text x="729.0" y="210.0" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="233.0" fill="#52606d" font-size="12"><tspan x="513.0" y="235.0">웹, 모바일과 음성 채널에서 사용자의 기록과 대화를 받는다.</tspan></text></g><g data-node="identity-session"><rect x="884.9331716810129" y="251.73762078750735" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="910.9331716810129" cy="278.73762078750735" r="14" fill="#17212b"/><text x="910.9331716810129" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="934.9331716810129" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">사용자 세션</text><text x="1118.933171681013" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="902.9331716810129" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="902.9331716810129" y="331.73762078750735">브라우저와 모바일의 세션 전달 방식을 사용자 단위로</tspan><tspan x="902.9331716810129" y="347.73762078750735">통일한다.</tspan></text></g><g data-node="personalization"><rect x="735.991953439914" y="408.26237921249265" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="761.991953439914" cy="435.26237921249265" r="14" fill="#17212b"/><text x="761.991953439914" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="785.991953439914" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">프로필·기억</text><text x="969.991953439914" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="753.991953439914" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="753.991953439914" y="488.26237921249265">사용자별 프롬프트와 기억을 다른 사용자의 데이터와 섞지</tspan><tspan x="753.991953439914" y="504.26237921249265">않는다.</tspan></text></g><g data-node="assistant-actions"><rect x="254.0080465600861" y="408.26237921249265" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="280.0080465600861" cy="435.26237921249265" r="14" fill="#17212b"/><text x="280.0080465600861" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="304.0080465600861" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">대화·캡슐·미션</text><text x="488.0080465600861" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="272.0080465600861" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="272.0080465600861" y="488.26237921249265">대화 응답, 미래 캡슐과 미션 상태를 서버에서 처리한다.</tspan></text></g><g data-node="user-dashboard"><rect x="105.066828318987" y="251.73762078750735" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="131.066828318987" cy="278.73762078750735" r="14" fill="#17212b"/><text x="131.066828318987" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="155.066828318987" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">기록·통계 화면</text><text x="339.066828318987" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="123.066828318987" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="123.066828318987" y="331.73762078750735">감정 기록과 기간별 통계를 다시 보여 주되 관측 강도와</tspan><tspan x="123.066828318987" y="347.73762078750735">표본을 함께 고려한다.</tspan></text></g></svg>
