<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 2108" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">여러 화면에 감정 기록을 잇는 Todack: 구조와 결정 흐름</title><desc id="system-map-desc">감정 기록과 대화에서 출발해 웹, 데스크톱 위젯과 모바일이 같은 사용자 데이터와 개인화 경로를 사용하도록 확장한 선택, 롤백과 아직 검증되지 않은 운영 경계를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="2108" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">여러 화면에 감정 기록을 잇는 Todack: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">감정 기록과 대화에서 출발해 웹, 데스크톱 위젯과 모바일이 같은 사용자</tspan><tspan x="80" y="108">데이터와 개인화 경로를 사용하도록 확장한 선택, 롤백과 아직 검증되지 않은</tspan><tspan x="80" y="130">운영 경계를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1564" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-10"><path d="M 560 1704 L 560 1760" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1722" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1739" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-11"><path d="M 560 1862 L 560 1918" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1880" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1897" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="common-product-boundary"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">후속 기능을 하나의 제품과 원장으로 통합</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">기존 감정 기록 경험을 Todack으로 이어받되 별도 앱들의 느슨한 묶음으로 만들지 않았다. 웹, 데스크톱 위젯과 E...</text></g><g data-node="identity-and-session"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">사용자 경계와 모바일 세션 전달</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">초기 익명 또는 공유 저장 방식보다 사용자별 데이터 분리를 우선해 Google OAuth와 서버 세션을 중심으로 인증...</text></g><g data-node="realtime-conversation"><rect x="80" y="504" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">음성과 텍스트가 같은 기억을 사용</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="566" fill="#52606d" font-size="12">텍스트 채팅과 실시간 음성을 서로 다른 인격으로 운영하지 않고 같은 사용자 기억과 개인화 프로필 경로에 연결했다. 채...</text></g><g data-node="profile-evolution"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">개인화 프롬프트와 프로필 변화 제어</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">프롬프트를 서버 코드 안에 고정하지 않고 런타임 파일로 분리했다. 신규 사용자는 특정 개인의 성향을 물려받지 않는 일...</text></g><g data-node="capsule-scheduling"><rect x="80" y="820" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">미래 캡슐의 예약과 공유 재정렬</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="882" fill="#52606d" font-size="12">미래 캡슐은 수동 전달 API로 가장 작은 흐름을 먼저 만든 뒤 due 항목을 자동 전달하는 방식으로 확장했다. 예약...</text></g><g data-node="mission-pet-state"><rect x="80" y="978" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">미션과 보상의 중복 방지</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="1040" fill="#52606d" font-size="12">미션과 펫 진행을 브라우저에만 저장하지 않고 서버의 사용자 상태로 관리한다. 일일 보상은 같은 요청이 반복돼도 한 번...</text></g><g data-node="redesign-boundary"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">색상 변경에서 컴포넌트 재설계로</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">첫 리디자인은 정보 구조와 기능을 고정하고 표면 스타일만 바꾸려 했다. 그러나 색만 달라지고 사용 흐름이 그대로라는...</text></g><g data-node="operations-storage"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">원격 SQLite를 중간 운영안으로 채택</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">현재 운영 저장소는 영속 볼륨을 붙인 SQLite를 전제로 한다. 초기 규모에서 배포와 백업 구조를 단순하게 유지할...</text></g><g data-node="statistics-model"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">감정 신뢰도와 기간을 분리한 통계</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">감정 카드, 코멘트와 대화는 같은 강도의 관측이 아니다. 통계 설계는 입력 채널별 신뢰도를 구분하고 7일, 28일,...</text></g><g data-node="implementation-flow"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">클라이언트와 서버의 구현 경계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1672" fill="#52606d" font-size="12">Python API가 인증, 사용자별 SQLite, 프롬프트, 대화, 프로필, 캡슐, 미션, 펫과 실시간 세션을 집중...</text></g><g data-node="validation"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">문법 확인과 제품 품질의 차이</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1830" fill="#52606d" font-size="12">현재 Python 서버와 데스크톱 위젯은 문법 검사를 통과했다. 통계 fixture도 제공된 매핑 안에서는 180개가...</text></g><g data-node="limitations"><rect x="80" y="1926" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1960" r="18" fill="#17212b"/><text x="116" y="1965" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">12</text><text x="150" y="1957" fill="#17212b" font-size="17" font-weight="700">운영과 안전에 남은 경계</text><text x="1022" y="1957" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1988" fill="#52606d" font-size="12">원격 SQLite는 단일 인스턴스 전제가 강하고, 서버 기능이 한 모듈에 집중돼 있다. 실시간 음성, 모바일 알림과...</text></g></svg>
