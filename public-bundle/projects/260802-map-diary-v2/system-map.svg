<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">계획 경로에서 방문 기록까지</title><desc id="system-map-desc">TMAP은 계획 경로를 만들고 VWorld는 확정 도로를 보존하며, 사용자가 확인한 결과만 trip record가 된다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">계획 경로에서 방문 기록까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">TMAP은 계획 경로를 만들고 VWorld는 확정 도로를 보존하며, 사용자가</tspan><tspan x="40" y="108">확인한 결과만 trip record가 된다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">planned route recording</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">계획 계산</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">확정 후보</text></g><g data-flow="flow-03"><path d="M 874 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="855.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="273" text-anchor="middle" fill="#52606d" font-size="11">방문 저장</text></g><g data-flow="flow-04"><path d="M 457 334 C 457 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="275" y="364" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="380" text-anchor="middle" fill="#52606d" font-size="11">미리보기</text></g><g data-node="trip-plan"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">주행 계획</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">출발·도착과 사용자 경유 pin으로 계획을 만든다.</tspan></text></g><g data-node="tmap-preview"><rect x="332" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">TMAP 계획 경로</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">외부 provider의 경로를 미리보기와 안내 후보로만</tspan><tspan x="350" y="304">사용한다.</tspan></text></g><g data-node="vworld-confirmation"><rect x="624" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">VWorld 확정 도로</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">실제로 기록할 도로의 원본과 geometry를 확인한다.</tspan></text></g><g data-node="trip-record"><rect x="916" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">trip·route·spot 기록</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">계획·도로 그룹·방문 지점을 서로 다른 데이터 단위로</tspan><tspan x="934" y="304">저장한다.</tspan></text></g><g data-node="static-preview"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">정적 미리보기</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">GPS 주행을 먼저 구현하지 않고 계획 결과를 확인하는</tspan><tspan x="58" y="522">화면을 제공한다.</tspan></text></g></svg>
