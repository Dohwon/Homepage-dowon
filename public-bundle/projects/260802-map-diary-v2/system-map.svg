<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1814" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">계획 경로와 방문 기록을 나누는 두 번째 실험: 구조와 결정 흐름</title><desc id="system-map-desc">TMAP 계획 데이터와 VWorld 영구 기록을 분리하려 한 설계, static preview로의 범위 조정, 그리고 현재 displayGeometry와 TTL 부재가 만든 핵심 미해결 계약을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1814" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">계획 경로와 방문 기록을 나누는 두 번째 실험: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">TMAP 계획 데이터와 VWorld 영구 기록을 분리하려 한 설계,</tspan><tspan x="80" y="108">static preview로의 범위 조정, 그리고 현재</tspan><tspan x="80" y="130">displayGeometry와 TTL 부재가 만든 핵심 미해결 계약을</tspan><tspan x="80" y="152">정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 304 L 560 360" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="322" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="339" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 462 L 560 518" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="480" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="497" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 620 L 560 676" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="638" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="655" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 778 L 560 834" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="796" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="813" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 936 L 560 992" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="954" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="971" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1094 L 560 1150" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1112" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1129" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1252 L 560 1308" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1270" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1287" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1410 L 560 1466" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1428" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1445" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1568 L 560 1624" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1586" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1603" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="provider-role-boundary"><rect x="80" y="210" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="244" r="18" fill="#17212b"/><text x="116" y="249" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="241" fill="#17212b" font-size="17" font-weight="700">TMAP 계획과 VWorld 확정의 역할 분리</text><text x="1022" y="241" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="272" fill="#52606d" font-size="12">장소 검색과 예상 자동차 경로는 TMAP이 맡고, 영구 방문선은 VWorld 도로 Feature를 확인한 뒤에만 만들...</text></g><g data-node="provider-adapter-proxy"><rect x="80" y="368" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="402" r="18" fill="#17212b"/><text x="116" y="407" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="399" fill="#17212b" font-size="17" font-weight="700">외부 API를 서버 프록시 뒤에 배치</text><text x="1022" y="399" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="430" fill="#52606d" font-size="12">브라우저가 외부 API의 인증 정보와 원본 응답 형식을 직접 소유하지 않도록 Node 서버에 POI와 자동차 경로 e...</text></g><g data-node="scope-rollback-static-preview"><rect x="80" y="526" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="560" r="18" fill="#17212b"/><text x="116" y="565" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="557" fill="#17212b" font-size="17" font-weight="700">GPS 주행 설계에서 static preview로 범위 축소</text><text x="1022" y="557" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="588" fill="#52606d" font-size="12">초기 설계는 foreground GPS, 경로 이탈 감지, 재탐색, 주행 종료 후 VWorld match review...</text></g><g data-node="separate-preview-state"><rect x="80" y="684" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="718" r="18" fill="#17212b"/><text x="116" y="723" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="715" fill="#17212b" font-size="17" font-weight="700">계획 경로를 별도 preview 상태로 유지</text><text x="1022" y="715" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="746" fill="#52606d" font-size="12">예상 경로는 검색 도로, 현재 선택, 저장 완료 도로와 다른 Leaflet layer와 state로 유지했다. 사용자...</text></g><g data-node="unresolved-data-lifetime"><rect x="80" y="842" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="876" r="18" fill="#17212b"/><text x="116" y="881" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="873" fill="#17212b" font-size="17" font-weight="700">설계한 데이터 수명과 현재 저장 계약의 충돌</text><text x="1022" y="873" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="904" fill="#52606d" font-size="12">설계 목표는 명확하다. 조사 기준의 TMAP API 약관은 API 데이터의 저장 후 24시간 이상 사용을 제한하므로...</text></g><g data-node="visible-pin-hidden-guidance"><rect x="80" y="1000" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1034" r="18" fill="#17212b"/><text x="116" y="1039" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1031" fill="#17212b" font-size="17" font-weight="700">사용자 경유 pin과 내부 guidance point 분리</text><text x="1022" y="1031" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1062" fill="#52606d" font-size="12">경유지 수정은 사용자가 지도에서 보는 pin과 provider 요청을 안정화하는 내부 guidance point를 분...</text></g><g data-node="route-trip-spot-flow"><rect x="80" y="1158" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1192" r="18" fill="#17212b"/><text x="116" y="1197" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1189" fill="#17212b" font-size="17" font-weight="700">도로 기록을 route group과 trip과 spot으로 확장</text><text x="1022" y="1189" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1220" fill="#52606d" font-size="12">V2는 하나의 도로 record에 머물지 않고 여러 잘린 도로 구간을 route group으로 묶고, 여행과 장소 기...</text></g><g data-node="implementation-flow"><rect x="80" y="1316" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1350" r="18" fill="#17212b"/><text x="116" y="1355" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1347" fill="#17212b" font-size="17" font-weight="700">예상 경로에서 방문 record까지</text><text x="1022" y="1347" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1378" fill="#52606d" font-size="12">사용자가 출발지, 도착지, 경유지를 고르면 브라우저는 서버 프록시를 통해 TMAP route 후보를 받고 별도 pre...</text></g><g data-node="validation"><rect x="80" y="1474" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1508" r="18" fill="#17212b"/><text x="116" y="1513" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1505" fill="#17212b" font-size="17" font-weight="700">확인된 회귀와 실패한 계약</text><text x="1022" y="1505" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1536" fill="#52606d" font-size="12">현재 테스트 소스에는 domain 42개, build 1개, provider와 workflow 21개, server...</text></g><g data-node="limitations"><rect x="80" y="1632" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1666" r="18" fill="#17212b"/><text x="116" y="1671" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1663" fill="#17212b" font-size="17" font-weight="700">다음 구현이 닫아야 할 경계</text><text x="1022" y="1663" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1694" fill="#52606d" font-size="12">우선 routeGroup.displayGeometry를 영구 record에서 제거하거나 VWorld snapshot에...</text></g></svg>
