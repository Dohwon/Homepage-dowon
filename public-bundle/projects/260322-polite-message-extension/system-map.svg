<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1634" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">상황에 맞춰 문장을 다듬는 Chrome 확장: 구조와 결정 흐름</title><desc id="system-map-desc">수신자와 관계, 톤과 배경을 구조화해 문장을 재작성하고, 로그인과 사용량 제한, 문의와 제출 패키지를 서버 경계에서 운영한 Chrome 확장의 결정과 미확인 출시 상태를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1634" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">상황에 맞춰 문장을 다듬는 Chrome 확장: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">수신자와 관계, 톤과 배경을 구조화해 문장을 재작성하고, 로그인과 사용량</tspan><tspan x="80" y="108">제한, 문의와 제출 패키지를 서버 경계에서 운영한 Chrome 확장의 결정과</tspan><tspan x="80" y="130">미확인 출시 상태를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1090" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1248" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="backend-boundary"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">외부 호출과 사용량을 서버에서 관리</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">배포되는 확장에는 외부 모델 호출 권한을 넣지 않고 backend만 재작성 요청을 수행한다. 사용자가 직접 외부 설정을 제공하는 경로는 self-host 범위로 제한했다. 무료, P...</text></g><g data-node="oauth-session"><rect x="80" y="346" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">Google 로그인과 명시적 세션 전달</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="408" fill="#52606d" font-size="12">이메일 기반 자체 인증은 중단하고 Google OAuth만 지원한다. 이전 auth endpoint는 더 이상 사용하는 척 남기지 않고 종료 상태를 반환한다. 확장과 웹 브라우저의...</text></g><g data-node="rewrite-contract"><rect x="80" y="504" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">수신자와 톤을 구조화한 재작성</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="566" fill="#52606d" font-size="12">prompt는 수신자, 역할, 톤과 배경을 구조화해 만든다. 자유 설명 하나로 모든 조건을 추측하게 하지 않아 UI 입력과 서버 요청의 의미를 맞췄다. 출력 언어는 한국어와 Engl...</text></g><g data-node="contact-email-rollback"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">문의 저장과 메일 발송 분리</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">서버에서 Gmail SMTP로 문의를 보내는 방식이 반복 timeout된 뒤 브라우저 EmailJS로 전환했다. 먼저 문의를 backend 데이터베이스에 저장하고 브라우저가 메일을...</text></g><g data-node="payment-boundary"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">결제 준비와 실제 활성 상태 분리</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">외부 checkout 코드와 주문 테이블은 준비돼 있지만 feature flag의 기본은 off다. landing도 무료 사용을 우선하고 유료 기능을 준비 중으로 표시한다. 코드가...</text></g><g data-node="release-package"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">제출 ZIP과 권한 범위 정리</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="1040" fill="#52606d" font-size="12">제출물은 현재 `extension` 내용만 release ZIP으로 만들고 루트에 남아 있던 오래된 ZIP은 기준에서 제외했다. 과거 패키지에는 오래된 UI, 과도한 권한과 불필요...</text></g><g data-node="implementation-flow"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">popup에서 backend까지</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1198" fill="#52606d" font-size="12">MV3 popup은 OAuth session과 사용자 설정을 Chrome storage에 보관하고 backend API로 재작성 요청을 보낸다. backend는 사용자, 사용량, 문...</text></g><g data-node="validation"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">제출 후보와 실제 스토어의 차이</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">현재 backend server와 prompt 모듈, extension popup의 JavaScript 문법을 확인했다. 과거 기록에는 최신 제출 ZIP 생성, manifest 권한...</text></g><g data-node="limitations"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">정책 정합성과 운영 검증 과제</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1514" fill="#52606d" font-size="12">공개 소스에는 운영용 공개 식별자와 연락 기본값, 특정 사용자 우회 기본값이 있어 저장소 정책을 검토해야 한다. 가격과 제한 문서도 실행 코드와 일치하지 않는다. OAuth poll...</text></g></svg>
