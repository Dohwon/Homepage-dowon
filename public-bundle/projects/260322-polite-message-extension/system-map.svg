<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">선택한 문장에서 다듬은 문장까지</title><desc id="system-map-desc">브라우저에서 선택한 문장과 수신자·톤을 서버 재작성 요청으로 보내고 결과를 다시 삽입하거나 복사한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="684" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">선택한 문장에서 다듬은 문장까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">브라우저에서 선택한 문장과 수신자·톤을</tspan><tspan x="40" y="108">서버 재작성 요청으로 보내고 결과를 다시</tspan><tspan x="40" y="130">삽입하거나 복사한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 304 C 290 332, 358 276, 358 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="306" text-anchor="middle" fill="#52606d" font-size="11">맥락 추가</text></g><g data-flow="flow-02"><path d="M 608 304 C 608 332, 676 276, 676 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="603" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="306" text-anchor="middle" fill="#52606d" font-size="11">입력 확인</text></g><g data-flow="flow-03"><path d="M 676 304 C 676 430, 290 430, 290 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="444" y="416" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="432" text-anchor="middle" fill="#52606d" font-size="11">서버 요청</text></g><g data-flow="flow-04"><path d="M 290 556 C 290 584, 358 528, 358 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="542" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="558" text-anchor="middle" fill="#52606d" font-size="11">결과 반환</text></g><g data-node="selected-text"><rect x="40" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">선택한 문장</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">사용자가 웹페이지나 메일에서</tspan><tspan x="58" y="340">다듬을 문장을 선택한다.</tspan></text></g><g data-node="rewrite-context"><rect x="358" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="257" r="14" fill="#17212b"/><text x="384" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="262">수신자와 톤</tspan></text><text x="592" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="376" y="308" fill="#52606d" font-size="12"><tspan x="376" y="324">재작성에 필요한 수신자와</tspan><tspan x="376" y="340">말투를 구조화한다.</tspan></text></g><g data-node="extension-popup"><rect x="676" y="230" width="250" height="148" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="257" r="14" fill="#17212b"/><text x="702" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="726" y="262">확장 팝업</tspan></text><text x="910" y="302" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="694" y="308" fill="#52606d" font-size="12"><tspan x="694" y="324">입력과 결과를 확인하고</tspan><tspan x="694" y="340">사용자가 다음 행동을</tspan><tspan x="694" y="356">선택하는 화면이다.</tspan></text></g><g data-node="rewrite-api"><rect x="40" y="482" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="509" r="14" fill="#17212b"/><text x="66" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="514">재작성 API</tspan></text><text x="274" y="554" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="58" y="560" fill="#52606d" font-size="12"><tspan x="58" y="576">세션과 사용량을 확인한 뒤</tspan><tspan x="58" y="592">외부 모델 호출을 서버에서</tspan><tspan x="58" y="608">수행한다.</tspan></text></g><g data-node="insert-or-copy"><rect x="358" y="482" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="509" r="14" fill="#17212b"/><text x="384" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="514">삽입·복사 결과</tspan></text><text x="592" y="554" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="560" fill="#52606d" font-size="12"><tspan x="376" y="576">완성된 문장을 원래 입력</tspan><tspan x="376" y="592">위치에 넣거나 클립보드로</tspan><tspan x="376" y="608">전달한다.</tspan></text></g></svg>
