<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 550" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">지원 범위에서 재현 가능한 평가까지</title><desc id="system-map-desc">capability registry를 기준으로 라우팅 테스트를 만들고 실행 결과와 점수, runtime 반영을 분리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1546" height="550" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">지원 범위에서 재현 가능한 평가까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">capability registry를 기준으로 라우팅</tspan><tspan x="40" y="108">테스트를 만들고 실행 결과와 점수, runtime</tspan><tspan x="40" y="130">반영을 분리한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="flow-01"><path d="M 290 304 C 290 363, 344 363, 344 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="263" y="349" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="365" text-anchor="middle" fill="#52606d" font-size="11">지원 범위 확인</text></g><g data-flow="flow-02"><path d="M 594 422 C 594 481, 648 245, 648 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="579" y="349" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="365" text-anchor="middle" fill="#52606d" font-size="11">route 증거</text></g><g data-flow="flow-03"><path d="M 898 304 C 898 363, 952 363, 952 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="886" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="365" text-anchor="middle" fill="#52606d" font-size="11">점수 계산</text></g><g data-flow="flow-04"><path d="M 1202 422 C 1202 481, 1256 245, 1256 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1190" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="365" text-anchor="middle" fill="#52606d" font-size="11">결과 기록</text></g><g data-node="capability-registry"><rect x="40" y="230" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">Capability</tspan><tspan x="90" y="280">registry</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">현재 지원하는 기능과 route의</tspan><tspan x="58" y="340">정본이다.</tspan></text></g><g data-node="preclassifier"><rect x="344" y="348" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="375" r="14" fill="#17212b"/><text x="370" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="394" y="380">사전 분류</tspan></text><text x="578" y="420" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="362" y="426" fill="#52606d" font-size="12"><tspan x="362" y="442">최종 정책을 결정하지 않고</tspan><tspan x="362" y="458">관찰용 증거만 제공한다.</tspan></text></g><g data-node="route-run"><rect x="648" y="230" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="257" r="14" fill="#17212b"/><text x="674" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="698" y="262">Stage 1 route</tspan></text><text x="882" y="302" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="666" y="308" fill="#52606d" font-size="12"><tspan x="666" y="324">질문을 담당 route로 보내고</tspan><tspan x="666" y="340">실행 결과를 수집한다.</tspan></text></g><g data-node="policy-score"><rect x="952" y="348" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="375" r="14" fill="#17212b"/><text x="978" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="1002" y="380">정책·최종 점수</tspan></text><text x="1186" y="420" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="970" y="426" fill="#52606d" font-size="12"><tspan x="970" y="442">정책 score와 final score를</tspan><tspan x="970" y="458">섞지 않고 평가한다.</tspan></text></g><g data-node="runtime-result"><rect x="1256" y="230" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="257" r="14" fill="#17212b"/><text x="1282" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="1306" y="262">재현 결과</tspan></text><text x="1490" y="302" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1274" y="308" fill="#52606d" font-size="12"><tspan x="1274" y="324">source 수정, runtime 반영과</tspan><tspan x="1274" y="340">재실행 완료 여부를 구분해</tspan><tspan x="1274" y="356">남긴다.</tspan></text></g></svg>
