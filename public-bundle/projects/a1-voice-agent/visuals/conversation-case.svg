<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">청정 중 대화가 시작되는 기존 코드 경로</title>
  <desc id="desc">AI Agent가 녹음 시작 시 일시정지를 요청하고, Device Agent가 상태 정책을 처리한다. AI는 이전 동작 값을 사용하며 재개 함수는 상태 전달과 내부 정리도 수행한다.</desc>
  <rect width="760" height="500" rx="14" fill="#f7f9f8"/>
  <text x="30" y="38" font-family="sans-serif" font-size="18" font-weight="700" fill="#243d36">사례: 청정 중 음성 대화 시작</text>
  <text x="30" y="62" font-family="sans-serif" font-size="12" fill="#526962">확인한 기존 로컬 코드의 경로 · 실제 Live 배포 경로는 별도 확인 필요</text>
  <g font-family="sans-serif" fill="#29443d">
    <text x="120" y="108" text-anchor="middle" font-size="15" font-weight="700">AI Agent</text>
    <text x="380" y="108" text-anchor="middle" font-size="15" font-weight="700">Device Agent</text>
    <text x="640" y="108" text-anchor="middle" font-size="15" font-weight="700">기기 상태</text>
    <path d="M120 124V413 M380 124V413 M640 124V413" stroke="#9baea8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="132" y="151" font-size="13">1. 녹음 준비</text>
    <path d="M120 175H368" fill="none" stroke="#398775" stroke-width="3"/>
    <path d="M359 169l10 6-10 6" fill="none" stroke="#398775" stroke-width="3"/>
    <text x="245" y="166" text-anchor="middle" font-size="13">2. 상태 일시정지 요청</text>
    <path d="M380 220H628" fill="none" stroke="#398775" stroke-width="3"/>
    <path d="M619 214l10 6-10 6" fill="none" stroke="#398775" stroke-width="3"/>
    <text x="504" y="211" text-anchor="middle" font-size="13">3. 정책 처리와 상태 갱신</text>
    <path d="M640 270H132" fill="none" stroke="#6788a2" stroke-width="3"/>
    <path d="M141 264l-10 6 10 6" fill="none" stroke="#6788a2" stroke-width="3"/>
    <text x="385" y="261" text-anchor="middle" font-size="13">4. AI의 일부 판정이 이전 동작을 소비</text>
    <path d="M120 327H368" fill="none" stroke="#ad7b40" stroke-width="3"/>
    <path d="M359 321l10 6-10 6" fill="none" stroke="#ad7b40" stroke-width="3"/>
    <text x="245" y="318" text-anchor="middle" font-size="13">5. 종료 경로에서 재개 요청</text>
    <text x="132" y="364" font-size="12">재개 함수는 상태 API 호출과</text>
    <text x="132" y="383" font-size="12">내부 플래그 정리도 수행</text>
  </g>
  <text x="30" y="463" font-family="sans-serif" font-size="12" fill="#526962">화살표는 요청과 상태 소비 방향이다. 취소, 에러, 별도 명령 경로는 본문에서 따로 설명한다.</text>
</svg>
