<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1612" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">프롬프트 비교 평가 흐름 개선: 구조와 결정 흐름</title><desc id="system-map-desc">같은 입력에서 여러 생성 모델을 비교하고 독립 judge, 구조 검사, 원시 결과와 요약을 분리한 평가 도구의 설계와 한계를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1612" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">프롬프트 비교 평가 흐름 개선: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">같은 입력에서 여러 생성 모델을 비교하고 독립 judge, 구조 검사, 원시</tspan><tspan x="80" y="108">결과와 요약을 분리한 평가 도구의 설계와 한계를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 260 L 560 316" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="278" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="295" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 418 L 560 474" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="436" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="453" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 576 L 560 632" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="594" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="611" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 734 L 560 790" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="752" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="769" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 892 L 560 948" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="910" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="927" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1050 L 560 1106" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1068" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1085" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1208 L 560 1264" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1226" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1243" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-08"><path d="M 560 1366 L 560 1422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1384" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1401" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="fixed-input"><rect x="80" y="166" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="200" r="18" fill="#17212b"/><text x="116" y="205" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="197" fill="#17212b" font-size="17" font-weight="700">입력 행을 비교 단위로 고정</text><text x="1022" y="197" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="228" fill="#52606d" font-size="12">모델마다 다른 예시를 주는 대신 같은 테스트 행과 같은 function 명세를 사용한다. 결과를 모델 전체의 인상으로 묶지 않고 행 단위로 남겨, 특정 조건에서만 좋아진 변경을 찾을...</text></g><g data-node="judge-boundary"><rect x="80" y="324" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="358" r="18" fill="#17212b"/><text x="116" y="363" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="355" fill="#17212b" font-size="17" font-weight="700">생성 모델과 judge 역할 분리</text><text x="1022" y="355" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="386" fill="#52606d" font-size="12">생성 모델이 자기 응답을 직접 채점하면 응답 전략과 판정 기준이 한 호출에 섞인다. 생성 endpoint와 judge endpoint를 별도 설정으로 두고, 생성 응답이 모두 준비된...</text></g><g data-node="n-way"><rect x="80" y="482" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="516" r="18" fill="#17212b"/><text x="116" y="521" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="513" fill="#17212b" font-size="17" font-weight="700">두 후보를 넘어 N-way 비교</text><text x="1022" y="513" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="544" fill="#52606d" font-size="12">A/B 두 개에 고정하지 않고 등록된 모든 모델 쌍을 round-robin으로 비교한다. 새 후보를 추가해도 비교 코드를 다시 쓰지 않고 같은 scoreboard에 포함할 수 있다.</text></g><g data-node="structural-validation"><rect x="80" y="640" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="674" r="18" fill="#17212b"/><text x="116" y="679" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="671" fill="#17212b" font-size="17" font-weight="700">형식 통과와 의미 승패 분리</text><text x="1022" y="671" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="702" fill="#52606d" font-size="12">응답이 JSON으로 파싱되는지, 필수 필드가 있는지, function과 action이 허용 범위에 속하는지를 먼저 기록한다. 그 뒤 judge의 승패를 별도 필드로 남긴다.</text></g><g data-node="failure-isolation"><rect x="80" y="798" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="832" r="18" fill="#17212b"/><text x="116" y="837" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="829" fill="#17212b" font-size="17" font-weight="700">실패 행을 남기고 batch 계속 실행</text><text x="1022" y="829" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="860" fill="#52606d" font-size="12">개별 생성 호출이나 judge 호출이 실패해도 전체 실행을 첫 오류에서 버리지 않는다. 실패 payload와 상태를 해당 행에 남기고 나머지 행을 처리한다.</text></g><g data-node="output-lifecycle"><rect x="80" y="956" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="990" r="18" fill="#17212b"/><text x="116" y="995" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="987" fill="#17212b" font-size="17" font-weight="700">원시 결과와 검토용 요약 분리</text><text x="1022" y="987" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1018" fill="#52606d" font-size="12">JSONL은 행별 생성 응답, judge 판정과 오류를 보존하는 재감사 원본이다. Excel은 사람이 모델별 승패와 케이스 분포를 빠르게 비교하는 표면이다.</text></g><g data-node="score-and-tie"><rect x="80" y="1114" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1148" r="18" fill="#17212b"/><text x="116" y="1153" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1145" fill="#17212b" font-size="17" font-weight="700">승점과 동률 규칙 명시</text><text x="1022" y="1145" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1176" fill="#52606d" font-size="12">승리는 1점, 무승부는 양쪽에 0.5점을 준다. 총점이 같으면 동률 후보끼리의 head-to-head를 보고, 그래도 같으면 설정에 등록된 순서를 사용한다.</text></g><g data-node="validation"><rect x="80" y="1272" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1306" r="18" fill="#17212b"/><text x="116" y="1311" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1303" fill="#17212b" font-size="17" font-weight="700">현재와 과거 실행의 범위</text><text x="1022" y="1303" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1334" fill="#52606d" font-size="12">현재 샘플은 6행이고 자동 합격 목표가 없다. 보관된 과거 JSONL은 145행이며 1행 실패가 있지만, 당시 입력과 설정은 현재 샘플과 다르다. 과거 결과는 도구가 실제 batch...</text></g><g data-node="limitations"><rect x="80" y="1430" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1464" r="18" fill="#17212b"/><text x="116" y="1469" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1461" fill="#17212b" font-size="17" font-weight="700">남은 평가 gate</text><text x="1022" y="1461" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1492" fill="#52606d" font-size="12">사람 이중평가와 judge 일치율, 후보 순서 편향, 재시도 횟수, 비용과 latency 측정이 없다. 현재 샘플도 너무 작고 명시적인 합격 기준이 없다.</text></g></svg>
