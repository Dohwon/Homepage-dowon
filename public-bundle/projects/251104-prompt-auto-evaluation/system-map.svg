<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1546 550" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">입력 행에서 비교 결과까지</title><desc id="system-map-desc">한 입력 행이 후보 생성, 형식 확인, judge 비교와 결과 보존을 거치는 평가 파이프라인이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1546" height="550" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">입력 행에서 비교 결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">한 입력 행이 후보 생성, 형식 확인, judge</tspan><tspan x="40" y="108">비교와 결과 보존을 거치는 평가</tspan><tspan x="40" y="130">파이프라인이다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">평가 루프</text><g data-flow="flow-01"><path d="M 290 304 C 290 363, 344 363, 344 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="278" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="317" y="365" text-anchor="middle" fill="#52606d" font-size="11">후보 생성</text></g><g data-flow="flow-02"><path d="M 594 422 C 594 481, 648 245, 648 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="582" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="621" y="365" text-anchor="middle" fill="#52606d" font-size="11">형식 확인</text></g><g data-flow="flow-03"><path d="M 898 304 C 898 363, 952 363, 952 422" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="877" y="349" width="96" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="925" y="365" text-anchor="middle" fill="#52606d" font-size="11">통과 행 평가</text></g><g data-flow="flow-04"><path d="M 1202 422 C 1202 481, 1256 245, 1256 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1190" y="349" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1229" y="365" text-anchor="middle" fill="#52606d" font-size="11">결과 보존</text></g><g data-node="test-row"><rect x="40" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">평가 입력 행</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">동일한 질문과 기대 조건을</tspan><tspan x="58" y="340">가진 한 건의 비교 단위다.</tspan></text></g><g data-node="candidate-runs"><rect x="344" y="348" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="370" cy="375" r="14" fill="#17212b"/><text x="370" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="394" y="380">후보 생성 실행</tspan></text><text x="578" y="420" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="362" y="426" fill="#52606d" font-size="12"><tspan x="362" y="442">같은 입력에 대해 둘 이상의</tspan><tspan x="362" y="458">모델 후보를 생성한다.</tspan></text></g><g data-node="format-gate"><rect x="648" y="230" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="674" cy="257" r="14" fill="#17212b"/><text x="674" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="698" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="698" y="262">형식 검증</tspan></text><text x="882" y="302" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="666" y="308" fill="#52606d" font-size="12"><tspan x="666" y="324">JSON과 필수 필드가 맞는지</tspan><tspan x="666" y="340">먼저 확인하고 의미 평가와</tspan><tspan x="666" y="356">분리한다.</tspan></text></g><g data-node="judge-comparison"><rect x="952" y="348" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="978" cy="375" r="14" fill="#17212b"/><text x="978" y="380" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="1002" y="380" fill="#17212b" font-size="16" font-weight="700"><tspan x="1002" y="380">후보 비교</tspan></text><text x="1186" y="420" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="970" y="426" fill="#52606d" font-size="12"><tspan x="970" y="442">N-way 후보의 의미적 승패와</tspan><tspan x="970" y="458">동률 규칙을 계산한다.</tspan></text></g><g data-node="review-output"><rect x="1256" y="230" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1282" cy="257" r="14" fill="#17212b"/><text x="1282" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1306" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="1306" y="262">원시 결과와 요약</tspan></text><text x="1490" y="302" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1274" y="308" fill="#52606d" font-size="12"><tspan x="1274" y="324">실패 행을 잃지 않고 원시</tspan><tspan x="1274" y="340">실행과 검토용 요약을 함께</tspan><tspan x="1274" y="356">남긴다.</tspan></text></g></svg>
