<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">감정 입력에서 공통 기록과 대화까지</title><desc id="system-map-desc">브라우저와 데스크톱 위젯의 감정 입력을 하나의 원장으로 모으고 필요한 경우에만 대화를 시작한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="710" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">감정 입력에서 공통 기록과 대화까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">브라우저와 데스크톱 위젯의 감정 입력을 하나의 원장으로 모으고 필요한</tspan><tspan x="40" y="108">경우에만 대화를 시작한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">cross surface ledger</text><g data-flow="flow-01"><path d="M 290 271 L 324 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="271.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="273" text-anchor="middle" fill="#52606d" font-size="11">기록 저장</text></g><g data-flow="flow-02"><path d="M 582 271 L 616 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="547" y="257" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="273" text-anchor="middle" fill="#52606d" font-size="11">최근 기록 확인</text></g><g data-flow="flow-03"><path d="M 582 271 L 908 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="693" y="257" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="273" text-anchor="middle" fill="#52606d" font-size="11">필요할 때 대화</text></g><g data-flow="flow-04"><path d="M 1041 334 C 1041 376, 165 376, 165 418" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563.5" y="364" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="380" text-anchor="middle" fill="#52606d" font-size="11">다시 보기</text></g><g data-node="feeling-input"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">감정 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">한 번의 클릭이나 짧은 기록으로 현재 감정을 남긴다.</tspan></text></g><g data-node="shared-ledger"><rect x="332" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="235" r="14" fill="#17212b"/><text x="358" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="240" fill="#17212b" font-size="16" font-weight="700">공통 감정 원장</text><text x="566" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="350" y="286" fill="#52606d" font-size="12"><tspan x="350" y="288">웹과 위젯이 함께 읽는 기록 저장소다.</tspan></text></g><g data-node="reminder-window"><rect x="624" y="208" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="235" r="14" fill="#17212b"/><text x="650" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="240" fill="#17212b" font-size="16" font-weight="700">최근 기록 알림</text><text x="858" y="263" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="642" y="286" fill="#52606d" font-size="12"><tspan x="642" y="288">오래된 누락을 전부 경고하지 않고 최근 일주일 범위만 보여</tspan><tspan x="642" y="304">준다.</tspan></text></g><g data-node="conversation-entry"><rect x="916" y="208" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="235" r="14" fill="#17212b"/><text x="942" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="240" fill="#17212b" font-size="16" font-weight="700">선택적 대화</text><text x="1150" y="263" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="934" y="286" fill="#52606d" font-size="12"><tspan x="934" y="288">기록만 남길지 대화를 시작할지 사용자의 의도를 분리한다.</tspan></text></g><g data-node="insight-view"><rect x="40" y="426" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="453" r="14" fill="#17212b"/><text x="66" y="458" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="90" y="458" fill="#17212b" font-size="16" font-weight="700">인사이트 화면</text><text x="274" y="481" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="58" y="504" fill="#52606d" font-size="12"><tspan x="58" y="506">축적된 기록을 요약해 다시 보는 화면이다.</tspan></text></g></svg>
