<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 588.2623792124926" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">감정 입력에서 공통 기록과 대화까지</title><desc id="system-map-desc">브라우저와 데스크톱 위젯의 감정 입력을 하나의 원장으로 모으고 필요한 경우에만 대화를 시작한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="588.2623792124926" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">감정 입력에서 공통 기록과 대화까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">브라우저와 데스크톱 위젯의 감정 입력을 하나의 원장으로 모으고 필요한</tspan><tspan x="40" y="108">경우에만 대화를 시작한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">상태 전이</text><g data-flow="flow-01"><path d="M 620 218 C 674 218, 955.933 314.738, 1009.93 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="775.467" y="252.369" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="814.967" y="268.369" text-anchor="middle" fill="#52606d" font-size="11">기록 저장</text></g><g data-flow="flow-02"><path d="M 1009.93 314.738 C 955.933 314.738, 914.992 471.262, 860.992 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="879.463" y="379" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="935.463" y="395" text-anchor="middle" fill="#52606d" font-size="11">최근 기록 확인</text></g><g data-flow="flow-03"><path d="M 1009.93 314.738 C 955.933 314.738, 433.008 471.262, 379.008 471.262" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="638.471" y="379" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="694.471" y="395" text-anchor="middle" fill="#52606d" font-size="11">필요할 때 대화</text></g><g data-flow="flow-04"><path d="M 379.008 471.262 C 325.008 471.262, 284.067 314.738, 230.067 314.738" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="265.037" y="379" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="304.537" y="395" text-anchor="middle" fill="#52606d" font-size="11">다시 보기</text></g><g data-node="feeling-input"><rect x="495.0" y="155.0" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="182.0" r="14" fill="#17212b"/><text x="521.0" y="187.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="187.0" fill="#17212b" font-size="16" font-weight="700">감정 입력</text><text x="729.0" y="210.0" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="233.0" fill="#52606d" font-size="12"><tspan x="513.0" y="235.0">한 번의 클릭이나 짧은 기록으로 현재 감정을 남긴다.</tspan></text></g><g data-node="shared-ledger"><rect x="884.9331716810129" y="251.73762078750735" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="910.9331716810129" cy="278.73762078750735" r="14" fill="#17212b"/><text x="910.9331716810129" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="934.9331716810129" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">공통 감정 원장</text><text x="1118.933171681013" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="902.9331716810129" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="902.9331716810129" y="331.73762078750735">웹과 위젯이 함께 읽는 기록 저장소다.</tspan></text></g><g data-node="reminder-window"><rect x="735.991953439914" y="408.26237921249265" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="761.991953439914" cy="435.26237921249265" r="14" fill="#17212b"/><text x="761.991953439914" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="785.991953439914" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">최근 기록 알림</text><text x="969.991953439914" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="753.991953439914" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="753.991953439914" y="488.26237921249265">오래된 누락을 전부 경고하지 않고 최근 일주일 범위만 보여</tspan><tspan x="753.991953439914" y="504.26237921249265">준다.</tspan></text></g><g data-node="conversation-entry"><rect x="254.0080465600861" y="408.26237921249265" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="280.0080465600861" cy="435.26237921249265" r="14" fill="#17212b"/><text x="280.0080465600861" y="440.26237921249265" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="304.0080465600861" y="440.26237921249265" fill="#17212b" font-size="16" font-weight="700">선택적 대화</text><text x="488.0080465600861" y="463.26237921249265" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="272.0080465600861" y="486.26237921249265" fill="#52606d" font-size="12"><tspan x="272.0080465600861" y="488.26237921249265">기록만 남길지 대화를 시작할지 사용자의 의도를 분리한다.</tspan></text></g><g data-node="insight-view"><rect x="105.066828318987" y="251.73762078750735" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="131.066828318987" cy="278.73762078750735" r="14" fill="#17212b"/><text x="131.066828318987" y="283.73762078750735" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="155.066828318987" y="283.73762078750735" fill="#17212b" font-size="16" font-weight="700">인사이트 화면</text><text x="339.066828318987" y="306.73762078750735" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="123.066828318987" y="329.73762078750735" fill="#52606d" font-size="12"><tspan x="123.066828318987" y="331.73762078750735">축적된 기록을 요약해 다시 보는 화면이다.</tspan></text></g></svg>
