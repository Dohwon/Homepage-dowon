<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1498 460" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">도로 검색에서 방문 기록까지</title><desc id="system-map-desc">VWorld 원본 도로를 검색·선택하고 Feature ID와 geometry snapshot을 방문 기록으로 보존한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1498" height="460" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">도로 검색에서 방문 기록까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">VWorld 원본 도로를 검색·선택하고 Feature</tspan><tspan x="40" y="108">ID와 geometry snapshot을 방문 기록으로</tspan><tspan x="40" y="130">보존한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-01"><path d="M 290 332 L 324 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="272" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="332" text-anchor="middle" fill="#52606d" font-size="11">원본 조회</text></g><g data-flow="flow-02"><path d="M 582 332 L 616 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="564" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="332" text-anchor="middle" fill="#52606d" font-size="11">후보 표시</text></g><g data-flow="flow-03"><path d="M 874 332 L 908 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="856" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="332" text-anchor="middle" fill="#52606d" font-size="11">구간 확정</text></g><g data-flow="flow-04"><path d="M 1166 332 L 1200 332" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1148" y="316" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="332" text-anchor="middle" fill="#52606d" font-size="11">방문 저장</text></g><g data-node="road-search"><rect x="40" y="258" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="285" r="14" fill="#17212b"/><text x="66" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="290">도로 검색</tspan></text><text x="274" y="330" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="336" fill="#52606d" font-size="12"><tspan x="58" y="352">사용자가 도로명과 지역으로</tspan><tspan x="58" y="368">저장할 후보를 찾는다.</tspan></text></g><g data-node="vworld-feature"><rect x="332" y="258" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="285" r="14" fill="#17212b"/><text x="358" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="382" y="290">VWorld 도로</tspan><tspan x="382" y="308">Feature</tspan></text><text x="566" y="330" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="350" y="336" fill="#52606d" font-size="12"><tspan x="350" y="352">도로명·코드·Feature</tspan><tspan x="350" y="368">ID·geometry를 가진 원본</tspan><tspan x="350" y="384">객체다.</tspan></text></g><g data-node="selected-segment"><rect x="624" y="258" width="250" height="148" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="285" r="14" fill="#17212b"/><text x="650" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="674" y="290">선택 구간</tspan></text><text x="858" y="330" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="642" y="336" fill="#52606d" font-size="12"><tspan x="642" y="352">검색 후보와 사용자가 확정한</tspan><tspan x="642" y="368">구간을 다른 상태로 표시한다.</tspan></text></g><g data-node="geometry-snapshot"><rect x="916" y="258" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="285" r="14" fill="#17212b"/><text x="942" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="966" y="290">geometry snapshot</tspan></text><text x="1150" y="330" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="934" y="336" fill="#52606d" font-size="12"><tspan x="934" y="352">확정 시점의 Feature ID와</tspan><tspan x="934" y="368">잘라낸 선형을 함께 보존한다.</tspan></text></g><g data-node="visit-record"><rect x="1208" y="258" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="285" r="14" fill="#17212b"/><text x="1234" y="290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="290" fill="#17212b" font-size="16" font-weight="700"><tspan x="1258" y="290">방문 기록</tspan></text><text x="1442" y="330" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1226" y="336" fill="#52606d" font-size="12"><tspan x="1226" y="352">방문 날짜와 횟수를 상세</tspan><tspan x="1226" y="368">패널에서 다시 보여 준다.</tspan></text></g></svg>
