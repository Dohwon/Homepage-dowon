<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">원본 도로를 고르는 지도 기록 다이어리: 구조와 결정 흐름</title><desc id="system-map-desc">추천 경로를 복사하지 않고 VWorld 원본 도로 Feature의 일부 구간을 사용자가 확인해 저장하는 로컬 지도 다이어리 MVP의 결정과 한계를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">원본 도로를 고르는 지도 기록 다이어리: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">추천 경로를 복사하지 않고 VWorld 원본 도로 Feature의 일부</tspan><tspan x="80" y="108">구간을 사용자가 확인해 저장하는 로컬 지도 다이어리 MVP의 결정과 한계를</tspan><tspan x="80" y="130">정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1248" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1406" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="source-feature-record"><rect x="80" y="188" width="960" height="94" rx="6" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">원본 도로 Feature를 저장 단위로 선택</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="150" y="250" fill="#52606d" font-size="12">좌표 두 점이나 자동차 경로 API의 폴리라인을 저장하는 대신 도로 Feature ID와 사용자가 확인한 선형을 기록 단위로 선택했다. 이 방식은 경로 계산 결과가 바뀌어도 어떤 공...</text></g><g data-node="vworld-road-layer"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">VWorld 도로명주소도로 레이어 채택</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">검색과 저장 후보의 정본은 VWorld WFS 도로명주소도로 레이어로 고정했다. 이 레이어는 도로명과 도로코드, Feature ID, MultiLineString geometry를...</text></g><g data-node="geometry-snapshot"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">Feature ID와 geometry snapshot을 함께 보존</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">Feature ID만 저장하면 새로고침할 때마다 외부 조회가 필요하고, 원본이 갱신되거나 일시적으로 조회되지 않을 때 사용자가 확정한 모양을 복원하기 어렵다. 반대로 좌표만 저장하면...</text></g><g data-node="visual-state-layers"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">검색과 선택과 저장 상태를 분리</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="724" fill="#52606d" font-size="12">검색으로 받은 모든 도로가 곧 방문 기록은 아니다. 지도에는 검색 가능한 원본 도로, 현재 사용자가 고른 구간, 저장 완료된 방문 구간을 별도 상태와 스타일로 렌더링했다. 사용자는...</text></g><g data-node="date-in-details"><rect x="80" y="820" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">방문 날짜는 상세 패널에서 표시</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="882" fill="#52606d" font-size="12">방문 날짜를 도로선 위에 상시 표시하는 대안은 선이 늘수록 지도 가독성을 빠르게 떨어뜨렸다. 날짜는 저장된 기록을 선택했을 때 상세 패널에서 최초 방문일, 최근 방문일, 방문 횟수와...</text></g><g data-node="browser-local-storage"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">MVP 저장소를 브라우저로 제한</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">로그인과 서버 데이터베이스를 먼저 만들지 않고 방문 record를 localStorage에 보관했다. 이 선택으로 원본 Feature 선택, 수정, 삭제, 새로고침 복원이라는 핵심...</text></g><g data-node="fail-closed-linking"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">없는 도로를 만들지 않는 연결 규칙</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">WFS 응답이 없을 때 임의 geometry를 표시하던 접근은 폐기했다. 구간 연결이 필요할 때도 같은 원본 Feature 또는 endpoint가 허용오차 안에서 인접한 Featur...</text></g><g data-node="implementation-flow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">검색부터 복원까지의 구현</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">브라우저 UI가 도로명 검색을 요청하면 Node 개발 서버가 VWorld WFS XML/GML을 받아 정규화된 Feature로 바꾼다. 앱은 도로코드와 지역코드 기준 후보를 지도에...</text></g><g data-node="validation"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">확인된 검증과 증거의 범위</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">현재 테스트 소스는 Feature 선택, snapshot 저장과 복원, 날짜와 방문 횟수 수정, 단일·인접 Feature clipping, endpoint 허용오차 경계를 다룬다....</text></g><g data-node="limitations"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">남아 있는 제품 경계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1672" fill="#52606d" font-size="12">현재 코드는 문서 일부가 아직 미구현이라고 적은 endpoint graph를 포함하므로, 공개 설명은 현재 코드와 테스트를 기준으로 했다. 그러나 같은 도로명이 전국에 많을 때 응답...</text></g></svg>
