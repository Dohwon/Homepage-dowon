<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">주행 센서에서 영구 도로 기록까지</title><desc id="system-map-desc">네이티브 SQLite가 raw drive를 보존하고 WebView는 동기화된 후보를 검토해 승인된 도로만 영구 기록으로 확정한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="420" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">주행 센서에서 영구 도로 기록까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">네이티브 SQLite가 raw drive를 보존하고 WebView는 동기화된</tspan><tspan x="40" y="108">후보를 검토해 승인된 도로만 영구 기록으로 확정한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-01"><path d="M 290 299 L 324 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="266" y="283" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="311" y="299" text-anchor="middle" fill="#52606d" font-size="11">raw 저장</text></g><g data-flow="flow-02"><path d="M 582 299 L 616 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="536" y="283" width="134" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="603" y="299" text-anchor="middle" fill="#52606d" font-size="11">cursor 동기화</text></g><g data-flow="flow-03"><path d="M 874 299 L 908 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="855.5" y="283" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="299" text-anchor="middle" fill="#52606d" font-size="11">후보 분석</text></g><g data-flow="flow-04"><path d="M 1166 299 L 1200 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1142" y="283" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="299" text-anchor="middle" fill="#52606d" font-size="11">사용자 확정</text></g><g data-node="native-location"><rect x="40" y="236" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="263" r="14" fill="#17212b"/><text x="66" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="268" fill="#17212b" font-size="16" font-weight="700">네이티브 위치 기록</text><text x="274" y="291" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="314" fill="#52606d" font-size="12"><tspan x="58" y="316">iOS 주행 중 위치와 센서 이벤트를 raw drive로</tspan><tspan x="58" y="332">수집한다.</tspan></text></g><g data-node="raw-drive-db"><rect x="332" y="236" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="263" r="14" fill="#17212b"/><text x="358" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="268" fill="#17212b" font-size="16" font-weight="700">Native SQLite</text><text x="566" y="291" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="350" y="314" fill="#52606d" font-size="12"><tspan x="350" y="316">짧은 보존 기간의 원시 주행 데이터를 기기 정본으로</tspan><tspan x="350" y="332">저장한다.</tspan></text></g><g data-node="webview-sync"><rect x="624" y="236" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="263" r="14" fill="#17212b"/><text x="650" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="268" fill="#17212b" font-size="16" font-weight="700">WebView 동기화</text><text x="858" y="291" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="642" y="314" fill="#52606d" font-size="12"><tspan x="642" y="316">sequence cursor로 새 기록만 웹 화면에</tspan><tspan x="642" y="332">전달한다.</tspan></text></g><g data-node="road-candidates"><rect x="916" y="236" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="263" r="14" fill="#17212b"/><text x="942" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="268" fill="#17212b" font-size="16" font-weight="700">도로 후보·분석</text><text x="1150" y="291" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="934" y="314" fill="#52606d" font-size="12"><tspan x="934" y="316">TMAP 정보는 gap 후보로만 쓰고 분석 실패와</tspan><tspan x="934" y="332">provider 실패를 분리한다.</tspan></text></g><g data-node="approved-road"><rect x="1208" y="236" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="263" r="14" fill="#17212b"/><text x="1234" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="268" fill="#17212b" font-size="16" font-weight="700">승인된 도로 snapshot</text><text x="1442" y="291" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1226" y="314" fill="#52606d" font-size="12"><tspan x="1226" y="316">사용자 검토와 revision CAS를 통과한 도로만 장기</tspan><tspan x="1226" y="332">보존한다.</tspan></text></g></svg>
