<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 2266" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">웹 지도와 네이티브 주행 기록의 경계: 구조와 결정 흐름</title><desc id="system-map-desc">웹 UI의 반복 속도를 유지하면서 iOS 백그라운드 위치 수집과 SQLite 원본 보존을 네이티브가 소유하도록 바꾸고, 실패를 숨기지 않는 review workflow로 영구 기록을 확정한 과정이다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="2266" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">웹 지도와 네이티브 주행 기록의 경계: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">웹 UI의 반복 속도를 유지하면서 iOS 백그라운드 위치 수집과 SQLite</tspan><tspan x="80" y="108">원본 보존을 네이티브가 소유하도록 바꾸고, 실패를 숨기지 않는 review</tspan><tspan x="80" y="130">workflow로 영구 기록을 확정한 과정이다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1406" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-10"><path d="M 560 1704 L 560 1760" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1722" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1739" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-11"><path d="M 560 1862 L 560 1918" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1880" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1897" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-12"><path d="M 560 2020 L 560 2076" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="2038" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="2055" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="hybrid-container"><rect x="80" y="188" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">PWA 대신 web-native 하이브리드 선택</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="250" fill="#52606d" font-size="12">기존 HTML, CSS, JavaScript 화면을 Capacitor iOS 컨테이너 안에 유지하고 Core Location과 저장소는 전용 Swift plugin으로 옮겼다. PW...</text></g><g data-node="native-sqlite-source"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">Native SQLite를 raw drive 정본으로 채택</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">위치 event를 곧바로 WebView 배열이나 localStorage에 넣지 않고 네이티브 SQLite에 먼저 기록한다. 세션, sequence가 있는 점, gap, review...</text></g><g data-node="sequence-paging"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">sequence cursor 기반 WebView 동기화</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">웹은 전체 GPS 배열을 매번 다시 받지 않는다. getDrivePoints에 afterSequence와 page limit을 넘기고, nextSequence와 hasMore를 따라...</text></g><g data-node="state-based-retention"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">저장 상태에 따라 24시간과 30일로 보존</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">초기 문서는 종료된 raw GPS를 마지막 좌표 기준 24시간 보관한다고 단순화했다. 최신 구현은 사용자가 영구 저장을 끝낸 saved 세션은 24시간 뒤 정리하지만, 아직 검토가...</text></g><g data-node="approved-snapshot-only"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">승인된 공공 도로 snapshot만 영구 저장</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">raw GPS와 TMAP route를 영구 방문선으로 바꾸지 않고, strict normalization을 통과한 공공 도로 snapshot만 최종 record에 넣는다. 초기 설계...</text></g><g data-node="tmap-candidate-only"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">TMAP을 gap 후보 생성으로 제한</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">GPS가 끊긴 구간에서 TMAP은 두 endpoint 사이의 도로 후보를 찾는 입력으로 사용할 수 있지만 resolution이나 영구 payload에는 들어가지 않는다. 서버는 TM...</text></g><g data-node="revision-cas"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">review mutation을 revision CAS로 보호</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1198" fill="#52606d" font-size="12">후보 확정, 수동 연결, 저장 제외는 session ID와 span key, expectedRevision이 모두 일치할 때만 native SQLite에 반영한다. 새 resolut...</text></g><g data-node="fail-closed-analysis"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">분석과 provider 실패를 별도 상태로 보존</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1356" fill="#52606d" font-size="12">일부 window만 성공하거나 provider가 timeout, rate limit, 인증 오류를 반환했을 때 빈 후보를 곧바로 &quot;도로 없음&quot;으로 해석하지 않는다. complete...</text></g><g data-node="manual-gap-confirmation"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">기존 도로 연결 검증을 재사용한 수동확정</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">분석은 완전하게 끝났지만 후보가 0개인 closed gap을 needsManualJoin으로 분류한다. 사용자는 지도에서 진입과 이탈 endpoint를 순서대로 지정하고, 서버가 T...</text></g><g data-node="opt-in-auto-detection"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">자동 주행 감지를 opt-in review-only로 제한</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size="12">자동 감지는 기본 OFF다. 사용자가 Always 위치, full accuracy, motion, 알림 권한을 허용한 경우에만 significant-change service로 저전...</text></g><g data-node="implementation-flow"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">기록에서 영구 도로 확정까지</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1830" fill="#52606d" font-size="12">Core Location과 Motion이 native coordinator에 event를 보내면 recorder가 quality filter를 통과한 점을 SQLite transac...</text></g><g data-node="validation"><rect x="80" y="1926" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1960" r="18" fill="#17212b"/><text x="116" y="1965" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">12</text><text x="150" y="1957" fill="#17212b" font-size="17" font-weight="700">로컬 통합 성공과 release gate의 분리</text><text x="1022" y="1957" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1988" fill="#52606d" font-size="12">release evidence에는 Node와 build 통합 433/433 PASS, focused Task 6 Playwright 13/13, 전체 브라우저 127/127과 후속...</text></g><g data-node="limitations"><rect x="80" y="2084" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="2118" r="18" fill="#17212b"/><text x="116" y="2123" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">13</text><text x="150" y="2115" fill="#17212b" font-size="17" font-weight="700">아직 release-ready가 아닌 이유</text><text x="1022" y="2115" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="2146" fill="#52606d" font-size="12">iPhone 실제 주행 감지율, 정지·실내·대중교통 오탐, sequence jump, 화면 잠금과 재부팅 복구, 접근성, 알림, 배터리 기준이 비어 있다. significant-ch...</text></g></svg>
