<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">웹과 네이티브 주행 기록의 소유권 경계</title>
  <desc id="desc">Core Location과 Swift recorder가 SQLite에 원본 위치를 먼저 저장하고 sequence paging으로 WebView review에 전달한다. 서버 후보와 사용자 확인을 거쳐 승인된 VWorld와 ITS snapshot만 영구 기록이 된다.</desc>
  <rect x="0" y="0" width="1200" height="680" fill="#f7f8fa"/>
  <text x="70" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Native ownership</text>
  <rect x="70" y="100" width="230" height="118" rx="6" fill="#e9f3ee" stroke="#387052" stroke-width="2"/>
  <text x="185" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#234b38">Core Location</text>
  <text x="185" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3d6451">위치 · motion · gap</text>
  <path d="M 300 159 H 390" fill="none" stroke="#59697a" stroke-width="3"/>
  <path d="M 390 159 l -14 -8 v 16 z" fill="#59697a"/>
  <rect x="410" y="100" width="260" height="118" rx="6" fill="#e9f3ee" stroke="#387052" stroke-width="2"/>
  <text x="540" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#234b38">Swift recorder</text>
  <text x="540" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3d6451">quality · session state</text>
  <path d="M 670 159 H 760" fill="none" stroke="#59697a" stroke-width="3"/>
  <path d="M 760 159 l -14 -8 v 16 z" fill="#59697a"/>
  <rect x="780" y="100" width="350" height="118" rx="6" fill="#e9f3ee" stroke="#387052" stroke-width="2"/>
  <text x="955" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#234b38">Native SQLite</text>
  <text x="955" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3d6451">sequence · gap · revision · cleanup</text>
  <line x1="70" y1="276" x2="1130" y2="276" stroke="#c8ced6" stroke-width="2"/>
  <text x="70" y="328" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Web review ownership</text>
  <rect x="70" y="364" width="300" height="118" rx="6" fill="#e8f1fb" stroke="#4776a8" stroke-width="2"/>
  <text x="220" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d">Sequence bridge</text>
  <text x="220" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#38526a">afterSequence paging</text>
  <path d="M 370 423 H 460" fill="none" stroke="#59697a" stroke-width="3"/>
  <path d="M 460 423 l -14 -8 v 16 z" fill="#59697a"/>
  <rect x="480" y="364" width="300" height="118" rx="6" fill="#fff7df" stroke="#a97816" stroke-width="2"/>
  <text x="630" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#523b0b">WebView review</text>
  <text x="630" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#69551f">후보 비교 · 사용자 확정</text>
  <path d="M 780 423 H 870" fill="none" stroke="#59697a" stroke-width="3"/>
  <path d="M 870 423 l -14 -8 v 16 z" fill="#59697a"/>
  <rect x="890" y="364" width="240" height="118" rx="6" fill="#edf5ea" stroke="#4f7f45" stroke-width="2"/>
  <text x="1010" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2f5528">영구 기록</text>
  <text x="1010" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b6b45">승인된 도로 snapshot</text>
  <path d="M 955 218 V 294 H 220 V 364" fill="none" stroke="#4776a8" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="590" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#38526a">WebView 복귀 후 누락 sequence catch-up</text>
  <rect x="70" y="542" width="1060" height="78" rx="6" fill="#ffffff" stroke="#8f98a4" stroke-width="2"/>
  <text x="100" y="588" font-family="Arial, sans-serif" font-size="17" fill="#384554">Web event는 원본이 아니다. 위치 수명과 transaction은 native가, 표시와 명시적 최종 선택은 web이 소유한다.</text>
</svg>
