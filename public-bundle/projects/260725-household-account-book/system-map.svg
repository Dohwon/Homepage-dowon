<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1950" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">연간 예산을 한 화면에서 관리하는 가계부: 구조와 결정 흐름</title><desc id="system-map-desc">연간 계획과 월별 실제 금액을 같은 표에 유지하면서 웹 업데이트, Windows 실행, 로컬 데이터 이관과 실패 시 복귀를 함께 다룬 가계부의 결정과 위험을 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1950" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">연간 예산을 한 화면에서 관리하는 가계부: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">연간 계획과 월별 실제 금액을 같은 표에 유지하면서 웹 업데이트,</tspan><tspan x="80" y="108">Windows 실행, 로컬 데이터 이관과 실패 시 복귀를 함께 다룬 가계부의</tspan><tspan x="80" y="130">결정과 위험을 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1248" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1406" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1564" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-10"><path d="M 560 1704 L 560 1760" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1722" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1739" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="planning-background"><rect x="80" y="188" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">월별 화면보다 연간 비교 유지</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="250" fill="#52606d" font-size="12">이 가계부의 중심은 한 달의 거래를 자세히 분류하는 것이 아니라, 연간 계획 행과 12개월 실제 금액을 한 화면에서 비교하며 집행 상태를 확인하는 데 있다. 월별 카드 화면으로 전환...</text></g><g data-node="annual-table-state"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">금액 입력 자체를 완료 상태로 사용</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">연간 계획 행과 12개월 실제 금액을 같은 표에서 유지하고, 별도 완료 체크박스는 없앴다. 실제 금액이 입력됐다는 사실 자체를 집행 상태로 사용하며 예산 이내, 초과와 미입력을 서로...</text></g><g data-node="atomic-json-store"><rect x="80" y="504" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">단일 JSON을 원자 교체</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="566" fill="#52606d" font-size="12">Node 서버는 현재 예산과 월별 상태를 하나의 JSON으로 보존한다. 요청 크기를 제한하고 입력을 정리한 뒤 임시 파일에 먼저 쓰고 rename으로 교체해, 쓰기 도중 프로세스가...</text></g><g data-node="windows-shell"><rect x="80" y="662" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">웹 화면을 여는 얇은 Windows 앱</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="724" fill="#52606d" font-size="12">웹과 Electron을 함께 제공하고 Windows에는 설치형과 포터블 패키지를 만들었다. 폴더 속 실행 파일만 전달하면 어떤 파일을 열어야 하는지와 업데이트 방법이 불명확해 설치형...</text></g><g data-node="migration-fallback"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">기존 로컬 기록을 보존한 이관</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">첫 실행 때 기존 로컬 상태를 원격으로 한 번 PUT하고 성공하면 원격 화면을 사용한다. 이관이 실패하면 사용자 데이터 위치에서 로컬 서버를 열어 작성한 항목을 잃지 않게 했다. 업...</text></g><g data-node="table-language"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">위치 기반 중간 합계로 용어 통일</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="1040" fill="#52606d" font-size="12">`고정비 소계`와 `소계2`처럼 카테고리처럼 보이던 이름을 위치 기반 `중간 합계`로 통일했다. 이 행은 비용 종류가 아니라 표 안의 임의 구간을 합산하는 기능이므로 화면 용어를 실...</text></g><g data-node="sticky-regression"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">월 헤더와 삽입선의 겹침 수정</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="150" y="1198" fill="#52606d" font-size="12">sticky 월 헤더가 예산 영역을 덮거나 중간 합계 추가선이 다른 행 위에서 눌리는 회귀가 있었다. z-index와 hit area를 재조정해 화면에 보이는 위치와 실제 클릭 대상...</text></g><g data-node="visual-direction"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">카드 전환 대신 표의 가독성 개선</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1356" fill="#52606d" font-size="12">전체를 카드뷰로 바꾸는 방향보다 표의 비교 장점을 유지하는 `엑셀 프리미엄` 방향을 선택했다. 현재월 요약 카드, 절제된 상태색과 일관된 카테고리 표시를 보조로 추가하고 월 집중 보...</text></g><g data-node="implementation-flow"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">서버 화면과 Electron의 역할</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1514" fill="#52606d" font-size="12">Node HTTP 서버가 정적 웹과 하나의 상태 API를 제공하고, 브라우저 앱이 연간 표를 렌더링한다. 저장은 정리된 JSON을 임시 파일과 rename으로 교체한다. Electr...</text></g><g data-node="validation"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">과거 패키징과 현재 확인 범위</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size="12">과거 작업 기록에는 Windows 설치형과 포터블 패키지 생성, 로컬 HTTP 응답과 원격 배포 성공이 남아 있다. 당시 패키지는 약 95MB였고 이관과 화면 회귀가 변경 범위별로...</text></g><g data-node="limitations"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">개인 가계부로 공개하기 전의 위험</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1830" fill="#52606d" font-size="12">원격 상태 API에는 인증과 사용자 격리가 없어 여러 사용자가 같은 문서를 읽거나 덮을 수 있다. 1회 PUT은 충돌 해결이 아니며 원격 상태가 이미 있을 때 잘못 덮어쓸 위험이 있...</text></g></svg>
