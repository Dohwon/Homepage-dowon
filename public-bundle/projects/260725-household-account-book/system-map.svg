<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">금액 입력에서 연간 비교 화면까지</title><desc id="system-map-desc">월별 기록을 단일 JSON에 원자적으로 저장하고 연간 비교가 가능한 표와 얇은 Windows 실행기로 제공한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="684" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">금액 입력에서 연간 비교 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">월별 기록을 단일 JSON에 원자적으로</tspan><tspan x="40" y="108">저장하고 연간 비교가 가능한 표와 얇은</tspan><tspan x="40" y="130">Windows 실행기로 제공한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 304 C 290 332, 358 276, 358 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="306" text-anchor="middle" fill="#52606d" font-size="11">표에 반영</text></g><g data-flow="flow-02"><path d="M 608 304 C 608 332, 676 276, 676 304" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="603" y="290" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="306" text-anchor="middle" fill="#52606d" font-size="11">원장 저장</text></g><g data-flow="flow-03"><path d="M 676 304 C 676 430, 290 430, 290 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="444" y="416" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="432" text-anchor="middle" fill="#52606d" font-size="11">합계 계산</text></g><g data-flow="flow-04"><path d="M 290 556 C 290 584, 358 528, 358 556" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="285" y="542" width="78" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="558" text-anchor="middle" fill="#52606d" font-size="11">실행 화면</text></g><g data-node="amount-input"><rect x="40" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="257" r="14" fill="#17212b"/><text x="66" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="262">금액 입력</tspan></text><text x="274" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="308" fill="#52606d" font-size="12"><tspan x="58" y="324">금액 입력 자체를 기록 완료로</tspan><tspan x="58" y="340">취급한다.</tspan></text></g><g data-node="annual-table"><rect x="358" y="230" width="250" height="148" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="257" r="14" fill="#17212b"/><text x="384" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="262">연간 비교 표</tspan></text><text x="592" y="302" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="376" y="308" fill="#52606d" font-size="12"><tspan x="376" y="324">월별 화면을 오가는 대신 한</tspan><tspan x="376" y="340">해의 수입·지출을 비교한다.</tspan></text></g><g data-node="json-ledger"><rect x="676" y="230" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="257" r="14" fill="#17212b"/><text x="702" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="726" y="262">단일 JSON 원장</tspan></text><text x="910" y="302" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="694" y="308" fill="#52606d" font-size="12"><tspan x="694" y="324">기존 로컬 기록을 보존하면서</tspan><tspan x="694" y="340">원자 교체로 저장한다.</tspan></text></g><g data-node="summary-calculation"><rect x="40" y="482" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="509" r="14" fill="#17212b"/><text x="66" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="514">중간 합계</tspan></text><text x="274" y="554" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="58" y="560" fill="#52606d" font-size="12"><tspan x="58" y="576">위치 기반 합계와 표의 용어를</tspan><tspan x="58" y="592">일관되게 계산한다.</tspan></text></g><g data-node="windows-shell"><rect x="358" y="482" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="509" r="14" fill="#17212b"/><text x="384" y="514" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="514" fill="#17212b" font-size="16" font-weight="700"><tspan x="408" y="514">Windows 실행기</tspan></text><text x="592" y="554" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="560" fill="#52606d" font-size="12"><tspan x="376" y="576">웹 화면을 여는 얇은 데스크톱</tspan><tspan x="376" y="592">진입점이다.</tspan></text></g></svg>
