<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 618" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">금액 입력에서 연간 비교 화면까지</title><desc id="system-map-desc">월별 기록을 단일 JSON에 원자적으로 저장하고 연간 비교가 가능한 표와 얇은 Windows 실행기로 제공한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="618" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">금액 입력에서 연간 비교 화면까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">월별 기록을 단일 JSON에 원자적으로 저장하고 연간 비교가 가능한 표와</tspan><tspan x="40" y="108">얇은 Windows 실행기로 제공한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">서비스 경계</text><g data-flow="flow-01"><path d="M 290 271 C 290 299, 358 243, 358 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="273" text-anchor="middle" fill="#52606d" font-size="11">표에 반영</text></g><g data-flow="flow-02"><path d="M 608 271 C 608 299, 676 243, 676 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="602.5" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="642" y="273" text-anchor="middle" fill="#52606d" font-size="11">원장 저장</text></g><g data-flow="flow-03"><path d="M 676 271 C 676 386, 290 386, 290 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="443.5" y="372" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="483" y="388" text-anchor="middle" fill="#52606d" font-size="11">합계 계산</text></g><g data-flow="flow-04"><path d="M 290 501 C 290 529, 358 473, 358 501" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="284.5" y="487" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="324" y="503" text-anchor="middle" fill="#52606d" font-size="11">실행 화면</text></g><g data-node="amount-input"><rect x="40" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="235" r="14" fill="#17212b"/><text x="66" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="240" fill="#17212b" font-size="16" font-weight="700">금액 입력</text><text x="274" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="286" fill="#52606d" font-size="12"><tspan x="58" y="288">금액 입력 자체를 기록 완료로 취급한다.</tspan></text></g><g data-node="annual-table"><rect x="358" y="208" width="250" height="126" rx="8" fill="#f4effa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="235" r="14" fill="#17212b"/><text x="384" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="408" y="240" fill="#17212b" font-size="16" font-weight="700">연간 비교 표</text><text x="592" y="263" text-anchor="end" fill="#52606d" font-size="11">interface</text><text x="376" y="286" fill="#52606d" font-size="12"><tspan x="376" y="288">월별 화면을 오가는 대신 한 해의 수입·지출을 비교한다.</tspan></text></g><g data-node="json-ledger"><rect x="676" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="702" cy="235" r="14" fill="#17212b"/><text x="702" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="726" y="240" fill="#17212b" font-size="16" font-weight="700">단일 JSON 원장</text><text x="910" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="694" y="286" fill="#52606d" font-size="12"><tspan x="694" y="288">기존 로컬 기록을 보존하면서 원자 교체로 저장한다.</tspan></text></g><g data-node="summary-calculation"><rect x="40" y="438" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="465" r="14" fill="#17212b"/><text x="66" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="90" y="470" fill="#17212b" font-size="16" font-weight="700">중간 합계</text><text x="274" y="493" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="58" y="516" fill="#52606d" font-size="12"><tspan x="58" y="518">위치 기반 합계와 표의 용어를 일관되게 계산한다.</tspan></text></g><g data-node="windows-shell"><rect x="358" y="438" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="384" cy="465" r="14" fill="#17212b"/><text x="384" y="470" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="408" y="470" fill="#17212b" font-size="16" font-weight="700">Windows 실행기</text><text x="592" y="493" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="376" y="516" fill="#52606d" font-size="12"><tspan x="376" y="518">웹 화면을 여는 얇은 데스크톱 진입점이다.</tspan></text></g></svg>
