<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1950" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">중앙 메모리 원본과 도구별 어댑터 분리: 구조와 결정 흐름</title><desc id="system-map-desc">사용자·업무 규칙을 한 원본에서 여러 AI 도구용 문서로 내보내고 프롬프트 카탈로그로 확장하려 했던 설계, 실제 one-shot 동기화 범위와 현재 대체 구조를 구분해 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1950" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">중앙 메모리 원본과 도구별 어댑터 분리: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">사용자·업무 규칙을 한 원본에서 여러 AI 도구용 문서로 내보내고 프롬프트</tspan><tspan x="80" y="108">카탈로그로 확장하려 했던 설계, 실제 one-shot 동기화 범위와 현재</tspan><tspan x="80" y="130">대체 구조를 구분해 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x