<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 608" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">중앙 메모리에서 도구별 참조까지</title><desc id="system-map-desc">하나의 canonical profile과 공유 메모리를 각 도구가 읽을 수 있는 어댑터와 카탈로그로 배포한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="608" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">중앙 메모리에서 도구별 참조까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">하나의 canonical profile과 공유 메모리를 각 도구가 읽을 수</tspan><tspan x="40" y="108">있는 어댑터와 카탈로그로 배포한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">에이전트 오케스트레이션</text><g data-flow="flow-01"><path d="M 294.25 271 C 294.25 299, 344.75 243, 344.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="280" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="319.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">공통 정본</text></g><g data-flow="flow-02"><path d="M 594.75 271 C 594.75 299, 645.25 243, 645.25 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="564" y="257" width="112" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="273" text-anchor="middle" fill="#52606d" font-size="11">공통 정본 변환</text></g><g data-flow="flow-03"><path d="M 895.25 271 C 895.25 299, 945.75 243, 945.75 271" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="881" y="257" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="920.5" y="273" text-anchor="middle" fill="#52606d" font-size="11">스킬 연결</text></g><g data-flow="flow-04"><path d="M 945.75 271 C 945.75 381, 294.25 381, 294.25 491" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="569.5" y="367" width="101" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="383" text-anchor="middle" fill="#52606d" font-size="11">실행 시 참조</text></g><g data-node="canonical-profile"><rect x="44.25" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="235" r="14" fill="#17212b"/><text x="70.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="94.25" y="240" fill="#17212b" font-size="16" font-weight="700">Canonical profile</text><text x="278.25" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="62.25" y="286" fill="#52606d" font-size="12"><tspan x="62.25" y="288">사용자의 안정적인 특성과 응답 선호를 하나의 정본으로</tspan><tspan x="62.25" y="304">관리한다.</tspan></text></g><g data-node="shared-memory"><rect x="344.75" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="370.75" cy="235" r="14" fill="#17212b"/><text x="370.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="394.75" y="240" fill="#17212b" font-size="16" font-weight="700">공유 메모리</text><text x="578.75" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="362.75" y="286" fill="#52606d" font-size="12"><tspan x="362.75" y="288">전역 작업 규칙과 프로젝트 인덱스를 자동 대화 저장소와</tspan><tspan x="362.75" y="304">구분해 둔다.</tspan></text></g><g data-node="tool-adapter"><rect x="645.25" y="208" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="671.25" cy="235" r="14" fill="#17212b"/><text x="671.25" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="695.25" y="240" fill="#17212b" font-size="16" font-weight="700">도구별 어댑터</text><text x="879.25" y="263" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="663.25" y="286" fill="#52606d" font-size="12"><tspan x="663.25" y="288">각 실행 도구의 입력 형식에 맞는 얇은 참조를 만든다.</tspan></text></g><g data-node="skill-catalog"><rect x="945.75" y="208" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="971.75" cy="235" r="14" fill="#17212b"/><text x="971.75" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="995.75" y="240" fill="#17212b" font-size="16" font-weight="700">스킬 카탈로그</text><text x="1179.75" y="263" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="963.75" y="286" fill="#52606d" font-size="12"><tspan x="963.75" y="288">런타임 스킬과 공개 설명 문서의 소유권을 별도로 기록한다.</tspan></text></g><g data-node="runtime-context"><rect x="44.25" y="428" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="70.25" cy="455" r="14" fill="#17212b"/><text x="70.25" y="460" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="94.25" y="460" fill="#17212b" font-size="16" font-weight="700">실행 컨텍스트</text><text x="278.25" y="483" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="62.25" y="506" fill="#52606d" font-size="12"><tspan x="62.25" y="508">작업을 시작할 때 필요한 프로필·규칙·프로젝트 링크를</tspan><tspan x="62.25" y="524">제공한다.</tspan></text></g></svg>
