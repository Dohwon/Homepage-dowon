troke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">watcher가 아닌 one-shot sync를 채택</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">sync 스크립트는 실행할 때 profile을 읽어 source-of-truth와 adapter, memory ind...</text></g><g data-node="thin-project-link"><rect x="80" y="820" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">프로젝트에는 전체 복제 대신 얇은 링크를 두려 함</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="882" fill="#52606d" font-size="12">각 프로젝트에 중앙 메모리 전체를 복사하지 않고 정본, short·mid·long-term layer와 log 위치를...</text></g><g data-node="catalog-access"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">결제 전에 로그인과 allowlist로 접근 제어</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">웹 카탈로그는 prompt와 운영 문서를 목록으로 보여 주고, 상세 본문은 Google 로그인 후 관리자·구매자 이메...</text></g><g data-node="ownership-replacement"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">자동 메모리와 workspace 기록의 소유권 재분리</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1198" fill="#52606d" font-size="12">초기 키트는 사용자 프로필, 작업 layer와 프로젝트 link를 하나의 `central_memory` 아래에 모으려...</text></g><g data-node="implementation-flow"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">profile 생성과 카탈로그 구현</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">Python sync는 JSON profile을 읽어 shared Markdown을 만들고 다섯 종류 adapter와...</text></g><g data-node="deployment-history"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">과거 build와 미완료 운영 설정</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">manager log에는 `npm run build`, Railway 프로젝트 초기화와 첫 업로드, 도메인 발급 기록...</text></g><g data-node="failed-wiring"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">자동 갱신으로 동작하지 않은 이유</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1672" fill="#52606d" font-size="12">자동화가 실패한 핵심은 central이라는 이름이 아니라 trigger 부재다. sync는 수동 실행형이고 proje...</text></g><g data-node="current-status"><rect x="80" y="1768" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1802" r="18" fill="#17212b"/><text x="116" y="1807" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">11</text><text x="150" y="1799" fill="#17212b" font-size="17" font-weight="700">legacy 상태와 남은 가치</text><text x="1022" y="1799" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1830" fill="#52606d" font-size="12">현재 이 프로젝트는 초기 중앙 메모리와 prompt vault의 역사 자산이다. one-shot 생성 코드와 adap...</text></g></svg>
