<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2958 494" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">실제 주행과 저장 기록에서 지도 일기까지</title><desc id="system-map-desc">실제 GPS를 수집해 종료 후 자동 저장하고 긴 공백은 나눠 보관한다. 화면 전환과 기준 셀 통계 및 지도 표현을 분리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="2958" height="494" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">실제 주행과 저장 기록에서 지도</tspan><tspan x="40" y="86">일기까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="120">실제 GPS를 수집해 종료 후 자동 저장하고 긴</tspan><tspan x="40" y="142">공백은 나눠 보관한다. 화면 전환과 기준 셀</tspan><tspan x="40" y="164">통계 및 지도 표현을 분리한다.</tspan></text><rect x="40" y="212" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="227" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-00"><path d="M 290 366 L 1200 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="671" y="350" width="156" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="366" text-anchor="middle" fill="#52606d" font-size="11">자동 주행 중심 지도...</text></g><g data-flow="flow-01"><path d="M 582 366 L 908 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="683" y="350" width="132" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="366" text-anchor="middle" fill="#52606d" font-size="11">승인된 위치와 끊김</text></g><g data-flow="flow-02"><path d="M 874 366 L 908 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="844" y="350" width="102" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="366" text-anchor="middle" fill="#52606d" font-size="11">저장 geometry</text></g><g data-flow="flow-03"><path d="M 1166 366 L 1492 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1264" y="350" width="138" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1333" y="366" text-anchor="middle" fill="#52606d" font-size="11">기준 셀과 준비 상태</text></g><g data-flow="flow-04"><path d="M 1458 366 L 1492 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1398" y="350" width="162" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1479" y="366" text-anchor="middle" fill="#52606d" font-size="11">지도 재사용과 표시 정책</text></g><g data-flow="flow-05"><path d="M 582 366 L 1784 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1109" y="350" width="156" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1187" y="366" text-anchor="middle" fill="#52606d" font-size="11">주행 종료와 앱 복귀...</text></g><g data-flow="flow-06"><path d="M 1792 366 C 1792 394, 874 338, 874 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1264" y="352" width="138" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1333" y="368" text-anchor="middle" fill="#52606d" font-size="11">중복 없는 영구 기록</text></g><g data-flow="flow-07"><path d="M 2042 366 L 2076 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1982" y="350" width="162" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2063" y="366" text-anchor="middle" fill="#52606d" font-size="11">정리 결과와 저장 영수증</text></g><g data-flow="flow-08"><path d="M 1166 366 L 2076 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1547" y="350" width="156" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1625" y="366" text-anchor="middle" fill="#52606d" font-size="11">실제 저장 전후 칸 통계</text></g><g data-flow="flow-09"><path d="M 1458 366 L 2368 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1836" y="350" width="162" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1917" y="366" text-anchor="middle" fill="#52606d" font-size="11">화면별 동일한 정렬과...</text></g><g data-flow="flow-10"><path d="M 1458 366 L 2660 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1982" y="350" width="162" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2063" y="366" text-anchor="middle" fill="#52606d" font-size="11">viewport 경계에 따른...</text></g><g data-flow="flow-11"><path d="M 2668 366 C 2668 394, 1750 338, 1750 366" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="2125" y="352" width="168" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2209" y="368" text-anchor="middle" fill="#52606d" font-size="11">단일 지도 크기 동기화...</text></g><g data-node="version-lineage"><rect x="40" y="292" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="319" r="14" fill="#17212b"/><text x="66" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="90" y="324">v1→v5 제품 진화</tspan></text><text x="274" y="364" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="370" fill="#52606d" font-size="12"><tspan x="58" y="386">수동 원본 도로 기록에서 경로</tspan><tspan x="58" y="402">미리보기와 iOS 주행 기록,</tspan><tspan x="58" y="418">자동 감지를 거쳐 지도 일...</tspan></text></g><g data-node="native-drive"><rect x="332" y="292" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="319" r="14" fill="#17212b"/><text x="358" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="382" y="324">실제 주행 수집</tspan></text><text x="566" y="364" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="350" y="370" fill="#52606d" font-size="12"><tspan x="350" y="386">승인된 위치와 끊김 구간 및</tspan><tspan x="350" y="402">세션 시작 시각을 제공한다.</tspan></text></g><g data-node="saved-records"><rect x="624" y="292" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="319" r="14" fill="#17212b"/><text x="650" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="674" y="324">저장 기록</tspan></text><text x="858" y="364" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="642" y="370" fill="#52606d" font-size="12"><tspan x="642" y="386">기존 저장 geometry와</tspan><tspan x="642" y="402">메타데이터를 유지한다.</tspan></text></g><g data-node="territory-runtime"><rect x="916" y="292" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="319" r="14" fill="#17212b"/><text x="942" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="966" y="324">기준 셀 계산</tspan></text><text x="1150" y="364" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="934" y="370" fill="#52606d" font-size="12"><tspan x="934" y="386">저장과 실시간 셀을 분리하고</tspan><tspan x="934" y="402">작업 한도 및 취소 상태를</tspan><tspan x="934" y="418">관리하며 기존 색칠 칸…</tspan></text></g><g data-node="journal-router"><rect x="1208" y="292" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="319" r="14" fill="#17212b"/><text x="1234" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="1258" y="324">전체 화면 전환</tspan></text><text x="1442" y="364" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="1226" y="370" fill="#52606d" font-size="12"><tspan x="1226" y="386">일반 검색 재진입은</tspan><tspan x="1226" y="402">초기화하고 주행 개입 초안과</tspan><tspan x="1226" y="418">기존 기록 편집은 보존한다.…</tspan></text></g><g data-node="map-display"><rect x="1500" y="292" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1526" cy="319" r="14" fill="#17212b"/><text x="1526" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="1550" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="1550" y="324">지도와 주행 지표</tspan></text><text x="1734" y="364" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1518" y="370" fill="#52606d" font-size="12"><tspan x="1518" y="386">실제 km와 주행 경과 시간 및</tspan><tspan x="1518" y="402">새 칸을 한 행에 표시하고</tspan><tspan x="1518" y="418">종료 확인은 dim 위에서…</tspan></text></g><g data-node="durable-save"><rect x="1792" y="292" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="1818" cy="319" r="14" fill="#17212b"/><text x="1818" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">7</text><text x="1842" y="324" fill="#17212b" font-size="16" font-weight="700"><tspan x="1842" y="324">GPS 자동 저장 후</tspan><tspan x="1842" y="342">원본 정리</tspan></text><text x="2026" y="364" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="1810" y="370" fill="#52606d" font-size="12"><tspan x="1810" y="386">도로 확정 없이 GPS 구간과</tspan><tspan x="1810" y="402">거리를 저장하며 긴 공백은</tspan><tspan x="1810" y="418">연결하지 않는다.…</tspan></text></g><g data-node="record-pages"><rect x="2084" y="292" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="2110" cy="319" r="14" fill="#17212b"/><text x="2110" y="324" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">8</text><text x="2134" y="3