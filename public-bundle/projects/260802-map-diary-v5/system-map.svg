<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">실제 주행과 저장 기록에서 지도 일기까지</title><desc id="system-map-desc">수집과 저장 복구 계약을 유지하며 화면 전환, 기준 셀 통계와 지도 표현을 분리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="420" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">실제 주행과 저장 기록에서 지도 일기까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">수집과 저장 복구 계약을 유지하며 화면 전환, 기준 셀 통계와 지도 표현을</tspan><tspan x="40" y="108">분리한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">버전 로드맵</text><g data-flow="flow-00"><path d="M 290 299 L 1200 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="654" y="283" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="299" text-anchor="middle" fill="#52606d" font-size="11">자동 주행 중심 지도 일기로 확장</text></g><g data-flow="flow-01"><path d="M 582 299 L 908 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="682" y="283" width="134" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="749" y="299" text-anchor="middle" fill="#52606d" font-size="11">승인된 위치와 끊김</text></g><g data-flow="flow-02"><path d="M 874 299 L 908 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="822.5" y="283" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="895" y="299" text-anchor="middle" fill="#52606d" font-size="11">저장 geometry</text></g><g data-flow="flow-03"><path d="M 1166 299 L 1492 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1260.5" y="283" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1333" y="299" text-anchor="middle" fill="#52606d" font-size="11">기준 셀과 준비 상태</text></g><g data-flow="flow-04"><path d="M 1458 299 L 1492 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1395.5" y="283" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1479" y="299" text-anchor="middle" fill="#52606d" font-size="11">지도 재사용과 표시 정책</text></g><g data-flow="flow-05"><path d="M 1458 299 L 1784 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1563.5" y="283" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1625" y="299" text-anchor="middle" fill="#52606d" font-size="11">명시적 저장 요청</text></g><g data-flow="flow-06"><path d="M 1792 299 C 1792 327, 874 271, 874 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1260.5" y="285" width="145" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1333" y="301" text-anchor="middle" fill="#52606d" font-size="11">중복 없는 영구 기록</text></g><g data-flow="flow-07"><path d="M 2042 299 L 2076 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1979.5" y="283" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="2063" y="299" text-anchor="middle" fill="#52606d" font-size="11">정리 결과와 저장 영수증</text></g><g data-flow="flow-08"><path d="M 1166 299 L 2076 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1541.5" y="283" width="167" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1625" y="299" text-anchor="middle" fill="#52606d" font-size="11">실제 저장 전후 칸 통계</text></g><g data-flow="flow-09"><path d="M 1458 299 L 2368 299" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="1822" y="283" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="1917" y="299" text-anchor="middle" fill="#52606d" font-size="11">화면별 동일한 정렬과 행동 위계</text></g><g data-node="version-lineage"><rect x="40" y="236" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="66" cy="263" r="14" fill="#17212b"/><text x="66" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="90" y="268" fill="#17212b" font-size="16" font-weight="700">v1→v5 제품 진화</text><text x="274" y="291" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="58" y="314" fill="#52606d" font-size="12"><tspan x="58" y="316">수동 원본 도로 기록에서 경로 미리보기와 iOS 주행 기록,</tspan><tspan x="58" y="332">자동 감지를 거쳐 지도 일기와 영역 통계 중심 구조로</tspan><tspan x="58" y="348">확장했다.</tspan></text></g><g data-node="native-drive"><rect x="332" y="236" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="358" cy="263" r="14" fill="#17212b"/><text x="358" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="382" y="268" fill="#17212b" font-size="16" font-weight="700">실제 주행 수집</text><text x="566" y="291" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="350" y="314" fill="#52606d" font-size="12"><tspan x="350" y="316">승인된 위치와 끊김 구간 및 세션 시작 시각을 제공한다.</tspan></text></g><g data-node="saved-records"><rect x="624" y="236" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="650" cy="263" r="14" fill="#17212b"/><text x="650" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="674" y="268" fill="#17212b" font-size="16" font-weight="700">저장 기록</text><text x="858" y="291" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="642" y="314" fill="#52606d" font-size="12"><tspan x="642" y="316">기존 저장 geometry와 메타데이터를 유지한다.</tspan></text></g><g data-node="territory-runtime"><rect x="916" y="236" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="942" cy="263" r="14" fill="#17212b"/><text x="942" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="966" y="268" fill="#17212b" font-size="16" font-weight="700">기준 셀 계산</text><text x="1150" y="291" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="934" y="314" fill="#52606d" font-size="12"><tspan x="934" y="316">저장과 실시간 셀을 분리하고 작업 한도 및 취소 상태를</tspan><tspan x="934" y="332">관리하며 기존 색칠 칸 재방문을 자동 집계한다.</tspan></text></g><g data-node="journal-router"><rect x="1208" y="236" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="1234" cy="263" r="14" fill="#17212b"/><text x="1234" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="1258" y="268" fill="#17212b" font-size="16" font-weight="700">전체 화면 전환</text><text x="1442" y="291" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="1226" y="314" fill="#52606d" font-size="12"><tspan x="1226" y="316">일반 검색 재진입은 초기화하고 주행 개입 초안과 기존 기록</tspan><tspan x="1226" y="332">편집은 보존한다. 뒤로가기 버튼과 좌측 가장자리 스와이프는</tspan><tspan x="1226" y="348">같은 전환 명령을 사용하며 권한 화면에서는 단일 지도를 숨겨</tspan></text></g><g data-node="map-display"><rect x="1500" y="236" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="1526" cy="263" r="14" fill="#17212b"/><text x="1526" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="1550" y="268" fill="#17212b" font-size="16" font-weight="700">지도와 주행 지표</text><text x="1734" y="291" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="1518" y="314" fill="#52606d" font-size="12"><tspan x="1518" y="316">실제 km와 주행 경과 시간 및 새 칸을 한 행에 표시하고</tspan><tspan x="1518" y="332">종료 확인은 dim 위에서 입력을 받는다. 상하단</tspan><tspan x="1518" y="348">iPhone 안전영역과 공통 간격 및 테마 배경으로 버튼</tspan></text></g><g data-node="durable-save"><rect x="1792" y="236" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="1818" cy="263" r="14" fill="#17212b"/><text x="1818" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">7</text><text x="1842" y="268" fill="#17212b" font-size="16" font-weight="700">저장 후 원본 정리</text><text x="2026" y="291" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="1810" y="314" fill="#52606d" font-size="12"><tspan x="1810" y="316">영구 저장과 네이티브 정리의 성공을 나누어 재시도 중복을</tspan><tspan x="1810" y="332">방지한다.</tspan></text></g><g data-node="record-pages"><rect x="2084" y="236" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="2110" cy="263" r="14" fill="#17212b"/><text x="2110" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">8</text><text x="2134" y="268" fill="#17212b" font-size="16" font-weight="700">완료와 기록함</text><text x="2318" y="291" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="2102" y="314" fill="#52606d" font-size="12"><tspan x="2102" y="316">준비된 실제 통계와 저장 기록 상세를 제공한다.</tspan></text></g><g data-node="v38-visual-guideline"><rect x="2376" y="236" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="2402" cy="263" r="14" fill="#17212b"/><text x="2402" y="268" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">9</text><text x="2426" y="268" fill="#17212b" font-size="16" font-weight="700">공통 화면 규격</text><text x="2610" y="291" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="2394" y="314" fill="#52606d" font-size="12"><tspan x="2394" y="316">iPhone 안전영역 안의 중앙 제목과 44–48px</tspan><tspan x="2394" y="332">뒤로가기 영역, 52px 검색 행, 44px 지도 컨트롤</tspan><tspan x="2394" y="348">열, 지표 세 행, 기록 상세 편집과 주·보조·파괴적 행동</tspan></text></g></svg>
