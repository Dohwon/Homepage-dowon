<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1438" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">월별 대화 품질 분석의 설계 흐름</title><desc id="system-map-desc">입력 제외와 대화 복원 이후 운영 지표·품질 신호를 월별 산출물로 내보내기 위한 설계다. 실행 구현은 아직 없다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1438" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">월별 대화 품질 분석의 설계 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">입력 제외와 대화 복원 이후 운영 지표·품질 신호를 월별 산출물로 내보내기</tspan><tspan x="40" y="108">위한 설계다. 실행 구현은 아직 없다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 334 C 620 372, 620 372, 620 410" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="575" y="358" width="90" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="374" text-anchor="middle" fill="#52606d" font-size="11">스키마 확인</text></g><g data-flow="flow-02"><path d="M 620 544 C 620 582, 620 582, 620 620" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="568" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="584" text-anchor="middle" fill="#52606d" font-size="11">정렬·복원</text></g><g data-flow="flow-03"><path d="M 620 754 C 620 792, 620 792, 620 830" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="778" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="794" text-anchor="middle" fill="#52606d" font-size="11">신호 계산</text></g><g data-flow="flow-04"><path d="M 620 964 C 620 1107, 620 1107, 620 1250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="580.5" y="1093" width="79" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1109" text-anchor="middle" fill="#52606d" font-size="11">월별 산출</text></g><g data-flow="flow-05"><path d="M 620 754 C 620 897, 620 897, 620 1040" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="553" y="883" width="134" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="899" text-anchor="middle" fill="#52606d" font-size="11">확인된 클라우드 턴</text></g><g data-flow="flow-06"><path d="M 620 1174 C 620 1212, 620 1212, 620 1250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558.5" y="1198" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1214" text-anchor="middle" fill="#52606d" font-size="11">품질 신호와 근거</text></g><g data-node="raw-events"><rect x="495.0" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700">원천 이벤트</text><text x="729.0" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="288">월별 질문·액션·답변 이벤트를 읽도록 설계한다.</tspan></text></g><g data-node="schema-normalizer"><rect x="495.0" y="418" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="445" r="14" fill="#17212b"/><text x="521.0" y="450" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="450" fill="#17212b" font-size="16" font-weight="700">스키마 정규화</text><text x="729.0" y="473" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="496" fill="#52606d" font-size="12"><tspan x="513.0" y="498">음성 이벤트와 빈 텍스트를 제외하고 원천 계보와 관측 기간을</tspan><tspan x="513.0" y="514">기록한다.</tspan></text></g><g data-node="session-rebuilder"><rect x="495.0" y="628" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="655" r="14" fill="#17212b"/><text x="521.0" y="660" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="660" fill="#17212b" font-size="16" font-weight="700">세션 복원</text><text x="729.0" y="683" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="706" fill="#52606d" font-size="12"><tspan x="513.0" y="708">세션 식별자와 시간 간격으로 대화를 복원하고 토큰 근거와</tspan><tspan x="513.0" y="724">순서 불확실성을 보존한다.</tspan></text></g><g data-node="search-metrics"><rect x="495.0" y="838" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="865" r="14" fill="#17212b"/><text x="521.0" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="870" fill="#17212b" font-size="16" font-weight="700">운영·검색 추정 지표</text><text x="729.0" y="893" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="916" fill="#52606d" font-size="12"><tspan x="513.0" y="918">기존 운영 지표와 검색 후보·후처리 문구 교차표를 계산하도록</tspan><tspan x="513.0" y="934">설계한다.</tspan></text></g><g data-node="quality-signals"><rect x="495.0" y="1048" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1075" r="14" fill="#17212b"/><text x="521.0" y="1080" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1080" fill="#17212b" font-size="16" font-weight="700">클라우드 품질 신호</text><text x="729.0" y="1103" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="1126" fill="#52606d" font-size="12"><tspan x="513.0" y="1128">클라우드 턴에 규칙·의미 기반 탐지·문맥 분류를 적용하고</tspan><tspan x="513.0" y="1144">근거와 유보 상태를 보존하도록 설계한다.</tspan></text></g><g data-node="monthly-handoff"><rect x="495.0" y="1258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1285" r="14" fill="#17212b"/><text x="521.0" y="1290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="545.0" y="1290" fill="#17212b" font-size="16" font-weight="700">월별 인계 산출물</text><text x="729.0" y="1313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1336" fill="#52606d" font-size="12"><tspan x="513.0" y="1338">월별 요약과 시간·질문·답변을 앞에 둔 품질 상세 시트의</tspan><tspan x="513.0" y="1354">출력 계약이다.</tspan></text></g></svg>
