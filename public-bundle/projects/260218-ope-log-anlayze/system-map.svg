<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1592" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">월 CSV에서 검증된 분석 결과까지</title><desc id="system-map-desc">원본을 바꾸지 않고 중복 조정, 대화 복원, 운영·품질 분석과 원자적 공개를 순서대로 수행한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1592" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">월 CSV에서 검증된 분석 결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">원본을 바꾸지 않고 중복 조정, 대화 복원,</tspan><tspan x="40" y="108">운영·품질 분석과 원자적 공개를 순서대로</tspan><tspan x="40" y="130">수행한다.</tspan></text><rect x="40" y="178" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="193" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 378 C 620 416, 620 416, 620 454" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="545" y="402" width="150" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="418" text-anchor="middle" fill="#52606d" font-size="11">hash 검증과 중복 조정</text></g><g data-flow="flow-02"><path d="M 620 610 C 620 648, 620 648, 620 686" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="554" y="634" width="132" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="650" text-anchor="middle" fill="#52606d" font-size="11">ASC sessionization</text></g><g data-flow="flow-03"><path d="M 620 842 C 620 880, 620 880, 620 918" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="563" y="866" width="114" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="882" text-anchor="middle" fill="#52606d" font-size="11">turn·근거 전달</text></g><g data-flow="flow-04"><path d="M 620 1074 C 620 1112, 620 1112, 620 1150" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="560" y="1098" width="120" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1114" text-anchor="middle" fill="#52606d" font-size="11">월별 파일과 검산</text></g><g data-flow="flow-05"><path d="M 620 1306 C 620 1344, 620 1344, 620 1382" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="539" y="1330" width="162" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1346" text-anchor="middle" fill="#52606d" font-size="11">fsync 후 pointer commit</text></g><g data-node="monthly-csv"><rect x="495.0" y="230" width="250" height="148" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="257" r="14" fill="#17212b"/><text x="521.0" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="262" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="262">data 월별 CSV</tspan></text><text x="729.0" y="302" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="308" fill="#52606d" font-size="12"><tspan x="513.0" y="324">매월 추가하는 원본 파일이며</tspan><tspan x="513.0" y="340">SHA와 encoding을 먼저</tspan><tspan x="513.0" y="356">확인한다.</tspan></text></g><g data-node="canonical-store"><rect x="495.0" y="462" width="250" height="148" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="489" r="14" fill="#17212b"/><text x="521.0" y="494" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="494" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="494">SQLite canonical</tspan><tspan x="545.0" y="512">원장</tspan></text><text x="729.0" y="534" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="540" fill="#52606d" font-size="12"><tspan x="513.0" y="556">source별 fingerprint 등장</tspan><tspan x="513.0" y="572">횟수와 provenance를 보존해</tspan><tspan x="513.0" y="588">겹친 snapshot을 조정한다.</tspan></text></g><g data-node="conversation-engine"><rect x="495.0" y="694" width="250" height="148" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="721" r="14" fill="#17212b"/><text x="521.0" y="726" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="726" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="726">세션·turn 복원</tspan></text><text x="729.0" y="766" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="772" fill="#52606d" font-size="12"><tspan x="513.0" y="788">log_id와 시간순으로</tspan><tspan x="513.0" y="804">질문·token·답변을 연결하고</tspan><tspan x="513.0" y="820">ambiguity는 유보한다.</tspan></text></g><g data-node="analytics-quality"><rect x="495.0" y="926" width="250" height="148" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="953" r="14" fill="#17212b"/><text x="521.0" y="958" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="958" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="958">운영 9개와 품질</tspan><tspan x="545.0" y="976">후보</tspan></text><text x="729.0" y="998" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="1004" fill="#52606d" font-size="12"><tspan x="513.0" y="1020">범위·분모·근거를 가진 운영</tspan><tspan x="513.0" y="1036">지표와 rule-only 한국어 품질</tspan><tspan x="513.0" y="1052">후보를 만든다.</tspan></text></g><g data-node="validation-gate"><rect x="495.0" y="1158" width="250" height="148" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1185" r="14" fill="#17212b"/><text x="521.0" y="1190" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1190" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1190">reconciliation·자</tspan><tspan x="545.0" y="1208">원·무결성 gate</tspan></text><text x="729.0" y="1230" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="1236" fill="#52606d" font-size="12"><tspan x="513.0" y="1252">월 합계, 파일 hash, 잠금</tspan><tspan x="513.0" y="1268">소유권과 전체 산출물을</tspan><tspan x="513.0" y="1284">제한된 프로세스에서…</tspan></text></g><g data-node="published-run"><rect x="495.0" y="1390" width="250" height="148" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1417" r="14" fill="#17212b"/><text x="521.0" y="1422" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="545.0" y="1422" fill="#17212b" font-size="16" font-weight="700"><tspan x="545.0" y="1422">output 최신 run</tspan></text><text x="729.0" y="1462" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1468" fill="#52606d" font-size="12"><tspan x="513.0" y="1484">모든 검증 뒤 latest</tspan><tspan x="513.0" y="1500">pointer가 가리키는 내부 감사</tspan><tspan x="513.0" y="1516">산출물과…</tspan></text></g></svg>
