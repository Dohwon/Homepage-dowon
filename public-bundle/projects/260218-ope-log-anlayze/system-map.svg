<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1792" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">운영 로그 분석을 위한 스키마 탐색과 인계 계약: 구조와 결정 흐름</title><desc id="system-map-desc">잘못 가정한 사용량 테이블을 버리고 실제 대화 이벤트와 고객·동의 데이터를 두 계층으로 나눈 뒤, 대용량 세션 복원을 위한 정렬·상태·산출물 계약을 만든 조사 프로젝트를 정리한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1120" height="1792" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="80" y="52">운영 로그 분석을 위한 스키마 탐색과 인계 계약: 구조와 결정 흐름</tspan></text><text fill="#52606d" font-size="13"><tspan x="80" y="86">잘못 가정한 사용량 테이블을 버리고 실제 대화 이벤트와 고객·동의 데이터를</tspan><tspan x="80" y="108">두 계층으로 나눈 뒤, 대용량 세션 복원을 위한 정렬·상태·산출물 계약을</tspan><tspan x="80" y="130">만든 조사 프로젝트를 정리한다.</tspan></text><g data-flow="flow-01"><path d="M 560 282 L 560 338" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="300" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="317" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-02"><path d="M 560 440 L 560 496" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="458" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="475" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-03"><path d="M 560 598 L 560 654" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="616" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="633" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-04"><path d="M 560 756 L 560 812" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="774" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="791" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-05"><path d="M 560 914 L 560 970" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="932" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="949" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-06"><path d="M 560 1072 L 560 1128" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1090" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1107" text-anchor="middle" fill="#52606d" font-size="11">다음 판단</text></g><g data-flow="flow-07"><path d="M 560 1230 L 560 1286" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="506" y="1248" width="108" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1265" text-anchor="middle" fill="#52606d" font-size="11">구현으로 연결</text></g><g data-flow="flow-08"><path d="M 560 1388 L 560 1444" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="524" y="1406" width="72" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1423" text-anchor="middle" fill="#52606d" font-size="11">검증</text></g><g data-flow="flow-09"><path d="M 560 1546 L 560 1602" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="518" y="1564" width="84" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="560" y="1581" text-anchor="middle" fill="#52606d" font-size="11">현재 결과</text></g><g data-node="split-data-layers"><rect x="80" y="188" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="222" r="18" fill="#17212b"/><text x="116" y="227" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text><text x="150" y="219" fill="#17212b" font-size="17" font-weight="700">이벤트와 고객 control DB를 두 계층으로 분리</text><text x="1022" y="219" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="250" fill="#52606d" font-size="12">대화 이벤트는 timestamp, 세션 키, log type과 content를 가진 AILogData 계열에서 읽고,...</text></g><g data-node="replace-usage-table-assumption"><rect x="80" y="346" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="380" r="18" fill="#17212b"/><text x="116" y="385" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text><text x="150" y="377" fill="#17212b" font-size="17" font-weight="700">usage 테이블 가정을 실제 이벤트 스키마로 교체</text><text x="1022" y="377" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="408" fill="#52606d" font-size="12">초기 source 후보였던 `cloud_llm_usages`는 device와 prompt, model, 생성 시각을...</text></g><g data-node="ascending-session-contract"><rect x="80" y="504" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="538" r="18" fill="#17212b"/><text x="116" y="543" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text><text x="150" y="535" fill="#17212b" font-size="17" font-weight="700">전체와 세션 내부를 오름차순으로 고정</text><text x="1022" y="535" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="566" fill="#52606d" font-size="12">원본 로그는 최신순으로 내려올 수 있지만 멀티턴 상태는 과거에서 현재 방향으로만 해석해야 한다. 따라서 전체 time...</text></g><g data-node="preserve-blank-anomaly"><rect x="80" y="662" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="696" r="18" fill="#17212b"/><text x="116" y="701" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text><text x="150" y="693" fill="#17212b" font-size="17" font-weight="700">blank와 순서 이상을 정상값에 흡수하지 않음</text><text x="1022" y="693" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="724" fill="#52606d" font-size="12">빈 사용자 발화만 no-LLM으로 보고, 답변이나 token 행의 blank는 cloud drop 가능성 힌트로 남기...</text></g><g data-node="separate-search-contract"><rect x="80" y="820" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="854" r="18" fill="#17212b"/><text x="116" y="859" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text><text x="150" y="851" fill="#17212b" font-size="17" font-weight="700">검색 후보·실행·일치·미래 judge를 분리</text><text x="1022" y="851" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="882" fill="#52606d" font-size="12">질문 내용이 검색을 필요로 보이는지는 `search_judge_target`, 실제 답변에 검색 후처리 근거가 있는지...</text></g><g data-node="monthly-handoff-boundary"><rect x="80" y="978" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1012" r="18" fill="#17212b"/><text x="116" y="1017" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">6</text><text x="150" y="1009" fill="#17212b" font-size="17" font-weight="700">대용량 처리는 월별 산출물 계약으로 제한</text><text x="1022" y="1009" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1040" fill="#52606d" font-size="12">출력은 KST 월별 파일과 달력 기준 주차 sheet, master summary, serial long·wide,...</text></g><g data-node="placeholder-sql"><rect x="80" y="1136" width="960" height="94" rx="6" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1170" r="18" fill="#17212b"/><text x="116" y="1175" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">7</text><text x="150" y="1167" fill="#17212b" font-size="17" font-weight="700">SQL을 실행본이 아닌 환경별 템플릿으로 유지</text><text x="1022" y="1167" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="150" y="1198" fill="#52606d" font-size="12">Athena와 Metabase용 SQL은 이벤트 source 이름을 placeholder로 두고, 정보 스키마 조회...</text></g><g data-node="implementation-discovery"><rect x="80" y="1294" width="960" height="94" rx="6" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1328" r="18" fill="#17212b"/><text x="116" y="1333" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">8</text><text x="150" y="1325" fill="#17212b" font-size="17" font-weight="700">파일 비교와 스키마 해제 과정</text><text x="1022" y="1325" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="150" y="1356" fill="#52606d" font-size="12">두 CSV의 컬럼과 세션 키를 비교해 작은 추출본이 큰 파일의 부분집합이고, 큰 파일에는 serial이 없다는 사실을...</text></g><g data-node="validation-boundary"><rect x="80" y="1452" width="960" height="94" rx="6" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1486" r="18" fill="#17212b"/><text x="116" y="1491" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">9</text><text x="150" y="1483" fill="#17212b" font-size="17" font-weight="700">확인된 discovery와 미실행 구현</text><text x="1022" y="1483" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="150" y="1514" fill="#52606d" font-size="12">현재 확인된 것은 두 로그의 포함 관계와 serial 차이, 해제된 테이블 정의의 필드, schema에 맞춘 SQL...</text></g><g data-node="current-status"><rect x="80" y="1610" width="960" height="94" rx="6" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="116" cy="1644" r="18" fill="#17212b"/><text x="116" y="1649" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">10</text><text x="150" y="1641" fill="#17212b" font-size="17" font-weight="700">현재 상태와 인계 한계</text><text x="1022" y="1641" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="150" y="1672" fill="#52606d" font-size="12">이 프로젝트의 결과는 대시보드가 아니라 틀린 source 가정을 버리고 실행 가능한 데이터 계약을 만든 조사다. 이벤...</text></g></svg>
