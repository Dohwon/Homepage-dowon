<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1438" role="img" aria-labelledby="system-map-title system-map-desc"><title id="system-map-title">월 CSV에서 검증된 분석 결과까지</title><desc id="system-map-desc">원본을 바꾸지 않고 중복 조정, 대화 복원, 운영·품질 분석과 원자적 공개를 순서대로 수행한다.</desc><defs><marker id="system-map-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs><rect width="1240" height="1438" fill="#ffffff"/><text fill="#17212b" font-size="24" font-weight="700"><tspan x="40" y="52">월 CSV에서 검증된 분석 결과까지</tspan></text><text fill="#52606d" font-size="13"><tspan x="40" y="86">원본을 바꾸지 않고 중복 조정, 대화 복원, 운영·품질 분석과 원자적 공개를</tspan><tspan x="40" y="108">순서대로 수행한다.</tspan></text><rect x="40" y="156" width="190" height="22" rx="11" fill="#17212b"/><text x="135" y="171" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">데이터 흐름</text><g data-flow="flow-01"><path d="M 620 334 C 620 372, 620 372, 620 410" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="531" y="358" width="178" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="374" text-anchor="middle" fill="#52606d" font-size="11">hash 검증과 중복 조정</text></g><g data-flow="flow-02"><path d="M 620 544 C 620 582, 620 582, 620 620" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="525" y="568" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="584" text-anchor="middle" fill="#52606d" font-size="11">ASC sessionization</text></g><g data-flow="flow-03"><path d="M 620 754 C 620 792, 620 792, 620 830" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="553" y="778" width="134" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="794" text-anchor="middle" fill="#52606d" font-size="11">turn·근거 전달</text></g><g data-flow="flow-04"><path d="M 620 964 C 620 1002, 620 1002, 620 1040" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="558.5" y="988" width="123" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1004" text-anchor="middle" fill="#52606d" font-size="11">월별 파일과 검산</text></g><g data-flow="flow-05"><path d="M 620 1174 C 620 1212, 620 1212, 620 1250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#system-map-arrow)"/><rect x="525" y="1198" width="190" height="24" rx="4" fill="#ffffff" stroke="#d6dce2"/><text x="620" y="1214" text-anchor="middle" fill="#52606d" font-size="11">fsync 후 pointer commit</text></g><g data-node="monthly-csv"><rect x="495.0" y="208" width="250" height="126" rx="8" fill="#edf6f3" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="235" r="14" fill="#17212b"/><text x="521.0" y="240" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text><text x="545.0" y="240" fill="#17212b" font-size="16" font-weight="700">data 월별 CSV</text><text x="729.0" y="263" text-anchor="end" fill="#52606d" font-size="11">input</text><text x="513.0" y="286" fill="#52606d" font-size="12"><tspan x="513.0" y="288">매월 추가하는 원본 파일이며 SHA와 encoding을 먼저</tspan><tspan x="513.0" y="304">확인한다.</tspan></text></g><g data-node="canonical-store"><rect x="495.0" y="418" width="250" height="126" rx="8" fill="#eaf4ea" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="445" r="14" fill="#17212b"/><text x="521.0" y="450" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text><text x="545.0" y="450" fill="#17212b" font-size="16" font-weight="700">SQLite canonical 원장</text><text x="729.0" y="473" text-anchor="end" fill="#52606d" font-size="11">state</text><text x="513.0" y="496" fill="#52606d" font-size="12"><tspan x="513.0" y="498">source별 fingerprint 등장 횟수와</tspan><tspan x="513.0" y="514">provenance를 보존해 겹친 snapshot을</tspan><tspan x="513.0" y="530">조정한다.</tspan></text></g><g data-node="conversation-engine"><rect x="495.0" y="628" width="250" height="126" rx="8" fill="#fff4d8" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="655" r="14" fill="#17212b"/><text x="521.0" y="660" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text><text x="545.0" y="660" fill="#17212b" font-size="16" font-weight="700">세션·turn 복원</text><text x="729.0" y="683" text-anchor="end" fill="#52606d" font-size="11">process</text><text x="513.0" y="706" fill="#52606d" font-size="12"><tspan x="513.0" y="708">log_id와 시간순으로 질문·token·답변을 연결하고</tspan><tspan x="513.0" y="724">ambiguity는 유보한다.</tspan></text></g><g data-node="analytics-quality"><rect x="495.0" y="838" width="250" height="126" rx="8" fill="#fceceb" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="865" r="14" fill="#17212b"/><text x="521.0" y="870" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4</text><text x="545.0" y="870" fill="#17212b" font-size="16" font-weight="700">운영 9개와 품질 후보</text><text x="729.0" y="893" text-anchor="end" fill="#52606d" font-size="11">service</text><text x="513.0" y="916" fill="#52606d" font-size="12"><tspan x="513.0" y="918">범위·분모·근거를 가진 운영 지표와 rule-only 한국어</tspan><tspan x="513.0" y="934">품질 후보를 만든다.</tspan></text></g><g data-node="validation-gate"><rect x="495.0" y="1048" width="250" height="126" rx="8" fill="#f1f1f1" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1075" r="14" fill="#17212b"/><text x="521.0" y="1080" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5</text><text x="545.0" y="1080" fill="#17212b" font-size="16" font-weight="700">reconciliation·자원·무...</text><text x="729.0" y="1103" text-anchor="end" fill="#52606d" font-size="11">guardrail</text><text x="513.0" y="1126" fill="#52606d" font-size="12"><tspan x="513.0" y="1128">월 합계, 파일 hash, 잠금 소유권과 전체 산출물을</tspan><tspan x="513.0" y="1144">제한된 프로세스에서 검증한다.</tspan></text></g><g data-node="published-run"><rect x="495.0" y="1258" width="250" height="126" rx="8" fill="#eaf0fa" stroke="#52606d" stroke-width="1.5"/><circle cx="521.0" cy="1285" r="14" fill="#17212b"/><text x="521.0" y="1290" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">6</text><text x="545.0" y="1290" fill="#17212b" font-size="16" font-weight="700">output 최신 run</text><text x="729.0" y="1313" text-anchor="end" fill="#52606d" font-size="11">output</text><text x="513.0" y="1336" fill="#52606d" font-size="12"><tspan x="513.0" y="1338">모든 검증 뒤 latest pointer가 가리키는 내부</tspan><tspan x="513.0" y="1354">감사 산출물과</tspan><tspan x="513.0" y="1370">ope_log_summary_yymmdd.xlsx 운영자용</tspan></text></g></svg>
