<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const saved = localStorage.getItem("atlas-theme");
      document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <title>Project Atlas</title>
  <meta name="description" content="Dowon의 프로젝트와 문제 해결 기록을 탐색하는 Project Atlas">
  <link rel="icon" href="/assets/portfolio-homepage-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#atlas-main">본문으로 이동</a>
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>
  <header id="atlas-header" class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-route-link aria-label="Project Atlas 홈">
        <span class="brand-mark" aria-hidden="true">👩‍💻</span>
        <span class="brand-copy"><strong>Project Atlas</strong><small>Dowon Projects</small></span>
      </a>
      <nav class="primary-nav" aria-label="주요 탐색">
        <a href="/" data-route-link data-view="home">Home</a>
        <a href="/projects" data-route-link data-view="projects">Projects</a>
        <a href="/topics" data-route-link data-view="topics">Topics</a>
        <a href="/graph" data-route-link data-view="graph">Graph</a>
        <a href="/changelog" data-route-link data-view="changelog">Changelog</a>
      </nav>
      <div class="header-actions">
        <button class="icon-button search-trigger" type="button" data-search-trigger aria-label="검색" title="검색">
          <i data-lucide="search" aria-hidden="true"></i>
        </button>
        <button class="icon-button" type="button" data-theme-toggle aria-label="테마 전환" title="테마 전환">
          <i data-theme-icon data-lucide="moon" aria-hidden="true"></i>
        </button>
        <a class="icon-button admin-link" href="/admin.html" aria-label="관리 화면" title="관리 화면">
          <i data-lucide="settings-2" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </header>

  <main id="atlas-main" tabindex="-1">
    <div class="loading-state" role="status">
      <span class="loading-line"></span>
      <span class="loading-line short"></span>
    </div>
  </main>

  <nav id="mobile-nav" class="mobile-nav" aria-label="모바일 탐색">
    <a href="/" data-route-link data-view="home" aria-label="홈"><i data-lucide="house" aria-hidden="true"></i><span>Home</span></a>
    <a href="/projects" data-route-link data-view="projects" aria-label="프로젝트"><i data-lucide="layout-grid" aria-hidden="true"></i><span>Projects</span></a>
    <a href="/topics" data-route-link data-view="topics" aria-label="주제"><i data-lucide="tags" aria-hidden="true"></i><span>Topics</span></a>
    <a href="/graph" data-route-link data-view="graph" aria-label="그래프"><i data-lucide="share-2" aria-hidden="true"></i><span>Graph</span></a>
    <a href="/changelog" data-route-link data-view="changelog" aria-label="변경 기록"><i data-lucide="history" aria-hidden="true"></i><span>Changes</span></a>
  </nav>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-dialog-head">
      <i data-lucide="search" aria-hidden="true"></i>
      <h2 id="search-title">프로젝트 검색</h2>
      <button class="icon-button" type="button" data-search-close aria-label="검색 닫기" title="닫기">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
    <label class="search-field">
      <span class="sr-only">검색어</span>
      <input id="atlas-search-input" type="search" autocomplete="off" placeholder="프로젝트, 기술, 문제를 검색">
    </label>
    <div id="search-results" class="search-results" aria-live="polite"></div>
  </dialog>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/3d-force-graph.min.js"></script>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
