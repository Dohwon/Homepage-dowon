project_id: 260802-map-diary-v2
title: 지도 기록 다이어리 v2
summary: TMAP 경로 입력과 영구 방문 기록의 저장 경계를 검증된 근거로 고정한 curated article이다.
readiness: ready
sections:
  - id: retention
    title: TMAP 데이터 장기 저장 제한 해결
    section_type: decision
    body: |
      TMAP 데이터는 24시간을 넘겨 보관할 수 없어서 예상 경로 계산용 세션 입력으로만 사용했다.

      영구 방문 기록에는 VWorld Feature ID와 geometry snapshot만 남겨 같은 도로 객체를 다시 확인할 수 있게 했다.

      영구 변환이 끝난 뒤에는 TMAP 원본 경로를 버리고 방문 기록에 남기지 않도록 저장 계약을 분리했다.
    evidence_ids:
      - v2-tmap-retention-spec
      - v2-vworld-feature-spec
      - v2-source-discard-spec
    diagrams:
      - id: tmap-vworld-lifecycle
        caption: TMAP 세션 입력과 VWorld 영구 기록의 데이터 수명
        alt: TMAP 경로는 세션 입력으로만 쓰고 VWorld Feature ID와 geometry snapshot만 영구 저장하는 흐름
decision_index:
